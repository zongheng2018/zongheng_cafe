<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住戶介面｜昭揚縱橫 咖啡廳點餐系統</title>
</head>

<body>
  <div id="loading">驗證登入狀態中...</div>

  <div id="app" style="display:none;">
    <h2>住戶介面</h2>
    <p>下一步會開始加入公告、點餐、個人設定、訂單紀錄。</p>
    <button id="logoutBtn">登出</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain: "zonghengcafe.firebaseapp.com",
  projectId: "zonghengcafe",
  storageBucket: "zonghengcafe.firebasestorage.app",
  messagingSenderId: "207027108121",
  appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId: "G-8ZE4SE2T7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    alert("請先登入");
    window.location.href = "index.html";
    return;
  }

  const raw = localStorage.getItem("zh_user");
  if (!raw) {
    window.location.href = "index.html";
    return;
  }

  const profile = JSON.parse(raw);

  if (profile.role !== "resident") {
    alert("您沒有權限進入此頁面");
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  localStorage.removeItem("zh_user");
  window.location.href = "index.html";
});
</script>
</body>
</html>
