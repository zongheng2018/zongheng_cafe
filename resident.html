<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住戶介面 - 昭揚縱橫咖啡廳</title>
  <style>
    body {
      font-family:"Microsoft JhengHei", Arial, sans-serif;
      background:#fdf6e3;
      margin:0;
    }
    header {
      background:#5c4033;
      color:white;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header img {height:40px;}
    .container {padding:20px;}
    h1,h2 {color:#5c4033;}

    /* 功能按鈕區 */
    .menu-buttons {
      display:flex;
      flex-wrap:wrap;
      gap:15px;
      margin-bottom:20px;
    }
    .menu-buttons button {
      flex:1;
      min-width:120px;
      padding:12px;
      border:none;
      border-radius:6px;
      background:#5c4033;
      color:white;
      font-size:16px;
      cursor:pointer;
    }
    .menu-buttons button:hover {background:#3e2a20;}

    /* 菜單項目 */
    .menu-item {
      border:1px solid #ccc; border-radius:8px;
      padding:10px; margin:10px 0; display:flex; align-items:center;
    }
    .menu-item img {width:60px; height:60px; margin-right:10px; border-radius:8px;}
    .quantity-control {display:flex; align-items:center; margin-top:5px;}
    .quantity-control button {
      width:30px; height:30px; margin:0 5px;
      background:#5c4033; color:white; border:none; border-radius:4px;
    }

    /* 購物車 */
    .cart {
      position:fixed; top:10px; left:10px;
      background:#fff; border:1px solid #ccc; border-radius:8px;
      padding:10px; width:250px;
    }
    .cart h3 {margin-top:0; color:#5c4033;}
    .cart-item {display:flex; justify-content:space-between; margin:5px 0;}
    .cart-item span {flex:1;}
    .cart-item button {background:red; color:white; border:none; border-radius:4px; cursor:pointer;}

    /* 結帳區 */
    .checkout {margin-top:20px;}
    .checkout select, .checkout input {width:100%; padding:8px; margin:8px 0;}
    .checkout button {
      width:100%; padding:12px; background:#5c4033; color:white;
      border:none; border-radius:6px; cursor:pointer;
    }
    .checkout button:hover {background:#3e2a20;}

    /* RWD 響應式 */
    @media (max-width:480px) {
      .cart {width:90%; left:5%; top:auto; bottom:10px;}
      .menu-buttons {flex-direction:column;}
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="系統Logo">
    <div>餘額：<span id="balance">載入中...</span></div>
  </header>

  <!-- 購物車 -->
  <div class="cart" id="cart">
    <h3>購物車</h3>
    <div id="cartItems"></div>
    <div class="checkout">
      <select id="dineType">
        <option value="takeout">外帶</option>
        <option value="dinein">內用</option>
      </select>
      <select id="seatSelect" style="display:none;"></select>
      <label><input type="checkbox" id="notify"> 餐點完成通知</label>
      <button onclick="submitOrder()">送出訂單</button>
    </div>
  </div>

  <div class="container">
    <h1>住戶介面</h1>
    <div class="menu-buttons">
      <button onclick="showMenu()">開始點餐</button>
      <button onclick="showOrders()">訂單紀錄</button>
      <button onclick="showSettings()">個人設定</button>
      <button onclick="showAnnouncements()">重要通知</button>
    </div>

    <div id="menu"></div>
    <div id="announcements"></div>
    <div id="orderHistory"></div>
    <div id="settings"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = { /* Firebase 設定 */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = [];

    async function loadResident() {
      // 餘額
      const balanceDoc = await db.collection("balances").doc("resident01").get();
      if (balanceDoc.exists) {
        const data = balanceDoc.data();
        document.getElementById("balance").innerText = (data.bonusPoints + data.reservedPoints) + " 點";
      }

      // 座位
      const seatSnap = await db.collection("seats").get();
      seatSnap.forEach(doc => {
        const opt = document.createElement("option");
        opt.value = doc.id;
        opt.textContent = doc.id;
        document.getElementById("seatSelect").appendChild(opt);
      });
    }

    function showMenu() {
      document.getElementById("menu").innerHTML = "";
      db.collection("menu").get().then(menuSnap => {
        menuSnap.forEach(doc => {
          const item = doc.data();
          const div = document.createElement("div");
          div.className = "menu-item";
          div.innerHTML = `
            <img src="${item.image || 'default.jpg'}">
            <div style="flex:1">
              <strong>${item.item}</strong><br>NT$${item.price}
              <div class="quantity-control">
                <button onclick="changeQty('${item.item}', -1)">-</button>
                <span id="qty-${item.item}">0</span>
                <button onclick="changeQty('${item.item}', 1)">+</button>
              </div>
              <label>冰度：
                <select id="ice-${item.item}">
                  <option>正常冰</option><option>少冰</option><option>去冰</option><option>熱</option>
                </select>
              </label>
              <label>甜度：
                <select id="sugar-${item.item}">
                  <option>正常</option><option>少糖</option><option>無糖</option>
                </select>
              </label>
              <textarea id="note-${item.item}" placeholder="備註"></textarea>
            </div>
          `;
          document.getElementById("menu").appendChild(div);
        });
      });
    }

    function changeQty(item, delta) {
      const qtySpan = document.getElementById("qty-" + item);
      let qty = parseInt(qtySpan.innerText) + delta;
      if (qty < 0) qty = 0;
      qtySpan.innerText = qty;
      updateCart(item, qty);
    }

    function updateCart(item, qty) {
      const index = cart.findIndex(c => c.item === item);
      if (index >= 0) {
        if (qty === 0) cart.splice(index,1);
        else cart[index].quantity = qty;
      } else if (qty > 0) {
        cart.push({item, quantity: qty});
      }
      renderCart();
    }

      const cartDiv = document.getElementById("cartItems");
      cartDiv.innerHTML = "";
      cart.forEach(c => {
        const div =
