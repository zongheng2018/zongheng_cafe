<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住戶首頁｜昭揚縱橫 咖啡廳點餐系統</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: url("bg.jpg") center center / cover fixed no-repeat;
      color: #5f574f;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.70);
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    .topbar {
      height: 68px;
      background: rgba(255,255,255,.78);
      border-bottom: 1px solid #ddd5cc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 22px;
      letter-spacing: 2px;
      color: #6d6258;
      font-weight: 600;
    }

    .brand img {
      width: 72px;
      opacity: .75;
    }

    .logout {
      border: 1px solid #c9c0b7;
      background: rgba(255,255,255,.85);
      color: #6d6258;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
    }

    .container {
      max-width: 760px;
      margin: 22px auto;
      padding: 0 16px 28px;
    }

    .card {
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(220,214,207,.85);
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 22px rgba(0,0,0,.08);
    }

    .section-title {
      font-size: 24px;
      color: #6d6258;
      letter-spacing: 2px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .announcement {
      background: rgba(248,245,241,.92);
      border-radius: 8px;
      min-height: 92px;
      padding: 18px;
      line-height: 1.8;
      color: #6b635b;
    }

    .points {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .point-box {
      background: rgba(248,245,241,.92);
      border-radius: 8px;
      text-align: center;
      padding: 18px 10px;
    }

    .point-label {
      color: #8b8178;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .point-value {
      color: #6f4f40;
      font-size: 30px;
      font-weight: 700;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .main-btn {
      border: none;
      border-radius: 8px;
      background: linear-gradient(to bottom, #bcaea1, #9c8e81);
      color: white;
      padding: 22px;
      font-size: 22px;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }

    .main-btn:active {
      transform: scale(.99);
    }

    .notice-item {
      background: rgba(248,245,241,.92);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      line-height: 1.7;
    }

    .loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6d6258;
      letter-spacing: 2px;
      font-size: 18px;
    }

    @media (max-width: 560px) {
      .brand {
        font-size: 17px;
      }

      .brand img {
        width: 58px;
      }

      .points,
      .menu-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div id="loading" class="loading">驗證登入狀態中...</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <div class="brand">
      <img src="logo.png" alt="縱橫 Logo">
      <span>昭揚縱橫 咖啡廳點餐系統</span>
    </div>

    <button class="logout" id="logoutBtn">登出</button>
  </div>

  <div class="container">

    <div class="card">
      <div class="section-title">最新公告</div>
      <div class="announcement" id="announcementBox">目前尚無公告</div>
    </div>

    <div class="card">
      <div class="section-title">我的點數</div>

      <div class="points">
        <div class="point-box">
          <div class="point-label">配發點數</div>
          <div class="point-value" id="grantedPoint">0</div>
        </div>

        <div class="point-box">
          <div class="point-label">儲值點數</div>
          <div class="point-value" id="storedPoint">0</div>
        </div>

        <div class="point-box">
          <div class="point-label">總點數</div>
          <div class="point-value" id="totalPoint">0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">功能選單</div>

      <div class="menu-grid">
        <button class="main-btn">開始點餐</button>
        <button class="main-btn">訂單紀錄</button>
        <button class="main-btn">個人設定</button>
        <button class="main-btn">重要通知</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">重要通知</div>
      <div id="noticeList">
        <div class="notice-item">目前尚無重要通知</div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain: "zonghengcafe.firebaseapp.com",
  projectId: "zonghengcafe",
  storageBucket: "zonghengcafe.firebasestorage.app",
  messagingSenderId: "207027108121",
  appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId: "G-8ZE4SE2T7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let profile = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("請先登入");
    window.location.href = "index.html";
    return;
  }

  const raw = localStorage.getItem("zh_user");

  if (!raw) {
    alert("登入資訊遺失，請重新登入");
    window.location.href = "index.html";
    return;
  }

  profile = JSON.parse(raw);

  if (profile.role !== "resident") {
    alert("您沒有權限進入住戶頁面");
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";

  await loadBalance();
  await loadAnnouncements();
});

async function loadBalance() {
  const username = profile.username;

  const q = query(
    collection(db, "balances"),
    where("uid", "==", username)
  );

  const snapshot = await getDocs(q);

  if (snapshot.empty) {
    document.getElementById("grantedPoint").innerText = "0";
    document.getElementById("storedPoint").innerText = "0";
    document.getElementById("totalPoint").innerText = "0";
    return;
  }

  const data = snapshot.docs[0].data();

  const granted = Number(data.granted_amount || 0);
  const stored = Number(data.stored_amount || 0);

  document.getElementById("grantedPoint").innerText = granted;
  document.getElementById("storedPoint").innerText = stored;
  document.getElementById("totalPoint").innerText = granted + stored;
}

async function loadAnnouncements() {
  const snapshot = await getDocs(collection(db, "announcements"));

  if (snapshot.empty) {
    document.getElementById("announcementBox").innerText = "目前尚無公告";
    document.getElementById("noticeList").innerHTML = '<div class="notice-item">目前尚無重要通知</div>';
    return;
  }

  let latest = "";
  let notices = "";

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();

    if (!latest && data.content) {
      latest = data.content;
    }

    notices += `
      <div class="notice-item">
        <strong>${data.title || "通知"}</strong><br>
        ${data.content || ""}
      </div>
    `;
  });

  document.getElementById("announcementBox").innerText = latest || "目前尚無公告";
  document.getElementById("noticeList").innerHTML = notices || '<div class="notice-item">目前尚無重要通知</div>';
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  localStorage.removeItem("zh_user");
  window.location.href = "index.html";
});
</script>

</body>
</html>
