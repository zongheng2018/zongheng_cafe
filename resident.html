<html lang="zh-TW">
<head>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f;padding-bottom:86px}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.72);backdrop-filter:blur(4px);z-index:-1}
.topbar{height:68px;background:rgba(255,255,255,.86);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand img{width:72px;opacity:.82}
.logout{border:1px solid #c9c0b7;background:rgba(255,255,255,.88);color:#6d6258;border-radius:8px;padding:9px 16px}
.container{max-width:760px;margin:24px auto;padding:0 16px}
.card{background:rgba(255,255,255,.9);border-radius:14px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-bottom:18px}
.section-title{font-size:28px;color:#6d6258;margin-bottom:18px;font-weight:600;letter-spacing:2px}
.announcement{background:rgba(248,245,241,.95);border-radius:10px;min-height:160px;padding:20px;line-height:1.9;font-size:18px}
.bottom-menu{position:fixed;left:0;right:0;bottom:0;height:78px;background:rgba(255,255,255,.95);border-top:1px solid #ddd5cc;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -4px 18px rgba(0,0,0,.08);z-index:10}
.menu-btn{border:none;background:none;color:#8b8885;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menu-btn.active{color:#9b8e81;font-weight:600}
.menu-btn svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.menu-text{font-size:14px;letter-spacing:1px}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#6d6258;font-size:18px;letter-spacing:2px}
.order-item,.notice-item,.point-box{background:#f8f5f1;border-radius:12px;padding:16px;margin-bottom:12px;line-height:1.8}
.order-title{font-weight:700;color:#6d6258;font-size:18px}
.status{display:inline-block;padding:4px 10px;border-radius:999px;background:#e7ded5;color:#6d6258;font-size:13px}
.status.wait{background:#fff1d9;color:#9b681f}
.status.making{background:#e6f0ff;color:#426f9c}
.status.done{background:#e8f5e9;color:#3f7f47}
.status.cancel{background:#fde8e6;color:#b3514a}
.point-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.point-box{text-align:center}
.point-label{font-size:14px;color:#8b8178}
.point-value{font-size:28px;font-weight:800;color:#6f4f40}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.step{text-align:center;border-radius:999px;padding:8px;background:#eee7df;color:#9a8d81;font-size:13px;font-weight:700}
.step.active{background:#9c8e81;color:white}
.input{width:100%;border:none;background:#f5f1eb;border-radius:12px;padding:13px;font-size:15px;margin-bottom:10px;outline:none}
.action-btn{border:none;background:#6d6258;color:white;border-radius:12px;padding:11px 18px;font-weight:800}
.order-time-text{font-size:13px;color:#8c837a;margin-top:2px}

.history-filter-row{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.history-select-input{border:none;background:#f5f1eb;border-radius:8px;padding:10px;font-size:14px;outline:none;color:#5f574f}
.ledger-table-box{width:100%;overflow-x:auto;margin-top:12px}
.ledger-table{width:100%;border-collapse:collapse;font-size:14px;text-align:center}
.ledger-table th{background:#e7ded5;color:#6d6258;padding:10px;font-weight:700}
.ledger-table td{padding:12px 10px;border-bottom:1px solid #eedfd3;color:#5f574f}
.info-popup-link{color:#6f4f40;text-decoration:underline;cursor:pointer;font-weight:700}

.detail-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.detail-modal-card{background:white;width:100%;max-width:340px;border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.15);line-height:1.6}
.detail-modal-header{font-size:16px;font-weight:900;color:#6d6258;border-bottom:1px dashed #ddd;padding-bottom:8px;margin-bottom:10px;display:flex;justify-content:space-between}

.eng-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.eng-modal-card{background:white;width:100%;max-width:420px;border-radius:16px;padding:22px;box-shadow:0 12px 36px rgba(0,0,0,0.2);line-height:1.7}
.eng-author-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;background:#f8f5f1;padding:10px;border-radius:10px}
.eng-avatar{width:36px;height:36px;border-radius:50%;background:#9c8e81;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px}
.eng-meta-info{display:flex;flex-direction:column}
.eng-name{font-weight:800;color:#6d6258;font-size:14px}
.eng-time{font-size:11px;color:#9a8d81}
.eng-broadcast-img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:10px;background:#f5f1eb}
.eng-btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.eng-btn{border:none;padding:11px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.eng-btn.close{background:#f5f1eb;color:#6d6258}
.eng-btn.never{background:#6d6258;color:white}

@media(max-width:560px){.point-grid{grid-template-columns:1fr}.section-title{font-size:24px}.announcement{font-size:16px}}
</style>
</head>

<body>

<div id="loading" class="loading">驗證登入狀態中...</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand"><img src="logo.png"></div>
    <button class="logout" id="logoutBtn">登出</button>

  <div class="container" id="content"></div>

  <div class="bottom-menu">
    <button class="menu-btn active" id="tabNotice" onclick="showNotice()">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v12H7l-3 3V5z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path></svg>

    <button class="menu-btn" onclick="location.href='resident_order.html'">
      <svg viewBox="0 0 24 24"><path d="M7 8h13"></path><path d="M7 12h13"></path><path d="M7 16h13"></path><path d="M3 8h.01"></path><path d="M3 12h.01"></path><path d="M3 16h.01"></path></svg>

      <div class="menu-text">個人設定</div>
    </button>
  </div>
</div>

<div class="eng-modal-bg" id="systemEngineerBroadcastModal" onclick="if(event.target===this) window.closeEngineerBroadcast(false)">
  <div class="eng-modal-card">
    <div class="section-title" style="font-size:20px; margin-bottom:12px; border-bottom:2px solid #6d6258; padding-bottom:6px;">系統公告</div>
    
    <div class="eng-author-row">
      <!-- 🚀 修正點：將頭像文字精密修正為「謝」 -->
      <div class="eng-avatar">謝</div>
      <div class="eng-meta-info">
        <div class="eng-name">系統工程師 - 謝秉諺</div>
        <div class="eng-time" id="engBroadcastTimeText">發布時間：未知</div>
      </div>
    </div>
    
    <div style="font-size:15px; color:#4a433d; word-break:break-all; white-space:pre-line;" id="engBroadcastContentText"></div>
    <img class="eng-broadcast-img" id="engBroadcastImgArea" style="display:none;" src="">
    
    <div class="eng-btn-grid">
      <button class="eng-btn close" onclick="window.closeEngineerBroadcast(false)">關閉</button>
      <button class="eng-btn never" onclick="window.closeEngineerBroadcast(true)">不再顯示</button>

<div class="detail-modal-bg" id="detailPopupModal" onclick="if(event.target===this) this.style.display='none';">
  <div class="detail-modal-card">
    <div class="detail-modal-header">
      <span id="popDateTitle">2026/06/25</span>
      <span style="cursor:pointer; color:#aaa;" onclick="document.getElementById('detailPopupModal').style.display='none';">✕</span>
    </div>
    <div style="font-size:14px; color:#5f574f;">
      <div style="margin-bottom:4px;"><b>異動項目：</b><span id="popType">消費</span></div>
      <div style="margin-bottom:4px;"><b>管道：</b><span id="popVia">點餐系統</span></div>
      <div style="margin-bottom:8px;"><b>配發變更：</b><span id="popGranted">0</span> ｜ <b>儲值變更：</b><span id="popStored">0</span></div>
      <div style="border-top:1px dashed #eee; padding-top:8px; font-weight:700; color:#6d6258; margin-bottom:4px;">餐點內容明細：</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,onAuthStateChanged,signOut,updatePassword,EmailAuthProvider,reauthenticateWithCredential
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore,collection,getDocs,query,where,updateDoc,doc,onSnapshot,orderBy,limit
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",authDomain:"zonghengcafe.firebaseapp.com",projectId:"zonghengcafe",storageBucket:"zonghengcafe.firebasestorage.app",messagingSenderId:"207027108121",appId:"1:207027108121:web:e7a39e19982ed77f9aed88",measurementId:"G-8ZE4SE2T7T"};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let profile=null;
let accountDocId=null;
const appDiv=document.getElementById("app");
const content=document.getElementById("content");

let unsubscribeLatestOrder = null;
let unsubscribeAnnouncements = null;
let unsubscribeEngineerBroadcast = null;

let selectedFilterMonth = ""; 
let lastKnownStatus = null;
let currentBroadcastTimeTag = "";

function formatLocalTime(isoString) {
  if(!isoString) return "未知時間";
  try {
    const d = new Date(isoString);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  } catch(e) {
    return "時間格式錯誤";
  }
}

onAuthStateChanged(auth,async user=>{
  if(!user){location.href="index.html";return}
  const raw=localStorage.getItem("zh_user");
  if(!raw){location.href="index.html";return}

  profile=JSON.parse(raw);
  if(profile.role!=="resident"){alert("沒有權限");location.href="index.html";return}

  await loadAccountInfo();
  checkNotificationPermission();
  listenEngineerBroadcast();
  document.getElementById("loading").style.display="none";
  appDiv.style.display="block";
  await showNotice();
});

function checkNotificationPermission() {
  if ("Notification" in window) {
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
      alert("請開啟通知權限以接收訂單通知");
      Notification.requestPermission();
    }
  }
}

async function loadAccountInfo(){
  const q=query(collection(db,"accounts"),where("username","==",profile.username));
  const snap=await getDocs(q);
  if(!snap.empty){
    accountDocId=snap.docs[0].id;
    if (snap.docs[0].data().is_notification_enabled !== undefined) {
      profile.is_notification_enabled = snap.docs[0].data().is_notification_enabled;
      localStorage.setItem("zh_user", JSON.stringify(profile));
    }
  }
}

function listenEngineerBroadcast() {
  if(unsubscribeEngineerBroadcast) unsubscribeEngineerBroadcast();
  unsubscribeEngineerBroadcast = onSnapshot(doc(db, "settings", "engineer_broadcast"), s => {
    if(!s.exists()) return;
    const data = s.data();
    if(data.enabled !== true) {
      document.getElementById("systemEngineerBroadcastModal").style.display = "none";
      return;
    }
    currentBroadcastTimeTag = data.updated_at || "default";
    const neverShowTag = localStorage.getItem("zh_hide_eng_broadcast");
    if(neverShowTag === currentBroadcastTimeTag) {
      return;
    }
    document.getElementById("engBroadcastContentText").innerText = data.content || "";
    document.getElementById("engBroadcastTimeText").innerText = "發布時間：" + formatLocalTime(data.updated_at);
    const imgArea = document.getElementById("engBroadcastImgArea");
    if(data.image_enabled === true && data.image_url && data.image_url.trim() !== "") {
      imgArea.src = data.image_url.trim();
      imgArea.style.display = "block";
    } else {
      imgArea.src = "";
      imgArea.style.display = "none";
    }
    document.getElementById("systemEngineerBroadcastModal").style.display = "flex";
  });
}

window.closeEngineerBroadcast = function(isNeverShowAgain) {
  document.getElementById("systemEngineerBroadcastModal").style.display = "none";
  if(isNeverShowAgain === true) {
    localStorage.setItem("zh_hide_eng_broadcast", currentBroadcastTimeTag);
  }
};

function setActive(id){
  document.querySelectorAll(".menu-btn").forEach(b=>b.classList.remove("active"));
  if(id) document.getElementById(id).classList.add("active");
}

function stopAllSnapshots() {
  if (unsubscribeLatestOrder) { unsubscribeLatestOrder(); unsubscribeLatestOrder = null; }
  if (unsubscribeAnnouncements) { unsubscribeAnnouncements(); unsubscribeAnnouncements = null; }
}

function statusClass(status){
  if(status === "等待接單") return "wait";
  if(status === "製作中") return "making";
  if(status === "已完成") return "done";
  if(status === "已取消") return "cancel";
  return "";
}

function stepHtml(status){
  return `
    <div class="progress">
      <div class="step ${status === "等待接單"?"active":""}">等待接單</div>
      <div class="step ${status === "製作中"?"active":""}">製作中</div>
      <div class="step ${status === "決完成" || status === "已完成"?"active":""}">已完成</div>
    </div>
  `;
}

async function getMyOrders() {
  const q=query(collection(db,"orders"),where("uid","==",profile.username));
  const snap=await getDocs(q);
  let orders=[];
  snap.forEach(d=>orders.push({id:d.id,...d.data()}));
  orders.sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  return orders;
}

window.showNotice=async function(){
  stopAllSnapshots();
  setActive("tabNotice");

  content.innerHTML=`
    <div class="card">
      <div class="section-title">最新訂單狀態</div>
      <div id="latestOrderBox">讀取中...</div>
    </div>
    <div class="card">
      <div class="section-title">最新公告</div>
      <div class="announcement" id="announcementBox">讀取中...</div>
    </div>
    <div class="card">
      <div class="section-title">重要通知</div>
      <div id="noticeList">讀取中...</div>
    </div>`;

  const latestOrderBox = document.getElementById("latestOrderBox");
  const announcementBox = document.getElementById("announcementBox");
  const noticeList = document.getElementById("noticeList");

  const orderQuery = query(collection(db, "orders"), where("uid", "==", profile.username));

  unsubscribeLatestOrder = onSnapshot(orderQuery, snap => {
    if(snap.empty){
      latestOrderBox.innerHTML='<div class="order-item">目前尚無進行中的訂單</div>';
      lastKnownStatus = null;
    }else{
      let orders = [];
      snap.forEach(docSnap => { orders.push({ id: docSnap.id, ...docSnap.data() }); });
      orders.sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
      
      const o = orders[0];
      const items = (o.items||[]).map(i=>`${i.name} × ${i.qty}`).join("、");
      latestOrderBox.innerHTML=`
        <div class="order-item">
          <div class="order-title">${o.order_id||""} <span class="status ${statusClass(o.status)}">${o.status||""}</span></div>
          <div class="order-time-text">送出時間：${formatLocalTime(o.created_at)}</div>
          <div>${items}</div>
          <div>金額：${o.total||0} 點</div>
          <div>${o.dining_type||""}${o.seat?`｜座位：${o.seat}`:""}</div>
          ${stepHtml(o.status)}
        </div>`;

      if (lastKnownStatus && lastKnownStatus !== "已完成" && o.status === "已完成") {
        if (profile.is_notification_enabled !== false && "Notification" in window && Notification.permission === "granted") {
          const msgBody = "咖啡廳櫃台通知：餐點完成，請至櫃台取餐，謝謝您";
          if (navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(reg => {
              reg.showNotification("昭揚縱橫咖啡廳", { body: msgBody, icon: "logo.png" });
            });
          } else {
            new Notification("昭揚縱橫咖啡廳", { body: msgBody, icon: "logo.png" });
          }
        }
      }
      lastKnownStatus = o.status;
    }
  }, error => {
    console.error("監聽訂單失敗:", error);
    latestOrderBox.innerHTML='<div class="order-item">讀取訂單失敗</div>';
  });

  unsubscribeAnnouncements = onSnapshot(doc(db, "settings", "broadcast"), s => {
    if (s.exists()) {
      const data = s.data();
      if (data.announcement && data.announcement.trim() !== "") {
        announcementBox.innerText = data.announcement;
      } else {
        announcementBox.innerText = "目前尚無公告";
      }

      if (data.notice && data.notice.trim() !== "") {
        noticeList.innerHTML = `<div class="notice-item">${data.notice}</div>`;
      } else {
        noticeList.innerHTML = '<div class="notice-item">目前尚無重要通知</div>';
      }
    } else {
      announcementBox.innerText = "開目前尚無公告";
      noticeList.innerHTML = '<div class="notice-item">目前尚無重要通知</div>';
    }
  }, error => {
    console.error("監聽公告失敗:", error);
    announcementBox.innerText = "讀取公告失敗";
    noticeList.innerHTML = '<div class="notice-item">讀取重要通知失敗</div>';
  });
};

window.showOrders=async function(){
  stopAllSnapshots();
  setActive("tabOrders");
  
  content.innerHTML=`
    <div class="card">
      <div class="section-title">數據紀錄篩選</div>
      <div class="history-filter-row">
        <span>選擇查詢月份：</span>
        <input type="month" id="historyMonthPicker" class="history-select-input" value="${selectedFilterMonth}">
        <button class="action-btn" style="padding:8px 14px; font-size:14px;" onclick="window.triggerMonthFilter()">執行篩選</button>
        <button class="action-btn" style="padding:8px 14px; font-size:14px; background:#9c8e81;" onclick="window.clearMonthFilter()">顯示全部</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">點數異動紀錄明細</div>
      <div id="pointLedgerBox" class="ledger-table-box">讀取點數帳本中...</div>
    </div>

    <div class="card">
      <div class="section-title">點餐歷史紀錄</div>
      <div id="orderList">讀取訂單歷史中...</div>
    </div>`;

  await renderFilteredData();
};

window.triggerMonthFilter = async function() {
  selectedFilterMonth = document.getElementById("historyMonthPicker").value;
  await renderFilteredData();
};

window.clearMonthFilter = async function() {
  selectedFilterMonth = "";
  document.getElementById("historyMonthPicker").value = "";
  await renderFilteredData();
};

async function renderFilteredData() {
  const orderList = document.getElementById("orderList");
  const pointLedgerBox = document.getElementById("pointLedgerBox");

  const orders = await getMyOrders();
  
  let filteredOrders = orders;
  if (selectedFilterMonth) {
    filteredOrders = orders.filter(o => o.created_at && o.created_at.startsWith(selectedFilterMonth));
  }

  if(filteredOrders.length === 0){
    orderList.innerHTML = '<div class="order-item">該月份尚無任何點餐紀錄</div>';
  } else {
    orderList.innerHTML = "";
    filteredOrders.forEach(o => {
      const items = (o.items||[]).map(i => `${i.name} × ${i.qty}`).join("、");
      orderList.innerHTML += `
        <div class="order-item">
          <div class="order-title">${o.order_id||""} <span class="status ${statusClass(o.status)}">${o.status||""}</span></div>
          <div class="order-time-text">送出時間：${formatLocalTime(o.created_at)}</div>
          <div>${items}</div>
          <div>金額：${o.total||0} 點</div>
          <div>${o.dining_type||""}${o.seat?`｜座位：${o.seat}`:""}</div>
          ${stepHtml(o.status)}
        </div>`;
    });
  }

  let ledgerHtml = `
    <table class="ledger-table">
      <thead>
        <tr>
          <th>日期</th>
          <th>類型</th>
          <th>異動點數</th>
          <th>操作管道</th>
          <th>明細</th>
        </tr>
      </thead>
      <tbody>`;

  let ledgerEvents = [];
  
  orders.forEach(o => {
    ledgerEvents.push({
      date: o.created_at ? o.created_at.split("T")[0] : "未知日期",
      timeText: o.created_at ? formatLocalTime(o.created_at) : "",
      type: o.status === "已取消" ? "作廢" : "消費",
      amount: o.status === "已取消" ? `+0 (已退)` : `-${o.total || 0}`,
      granted: o.status === "已取消" ? `+${o.total || 0}` : `-${o.total || 0}`,
      stored: "0",
      via: "點餐系統",
      id: o.id,
      foodDetails: (o.items||[]).map(i => `${i.name} × ${i.qty} (${o.total}點)`).join("<br>")
    });
  });

  const balanceSnap = await getDocs(query(collection(db, "balances"), where("uid", "==", profile.username)));
  if (!balanceSnap.empty) {
    const bData = balanceSnap.docs[0].data();
    if (bData.updated_at && bData.updated_by) {
      const isRecharge = bData.updated_by.includes("counter") || bData.updated_by.includes("recharge");
      ledgerEvents.push({
        date: bData.updated_at.split("T")[0],
        timeText: formatLocalTime(bData.updated_at),
        type: isRecharge ? "儲值" : "配發",
        amount: `+${Number(bData.stored_amount || 0) > 0 ? bData.stored_amount : 500}`,
        granted: `+${bData.granted_amount || 0}`,
        stored: `+${bData.stored_amount || 0}`,
        via: "環境櫃檯",
        foodDetails: isRecharge ? "櫃檯手動增補/現金儲值點數" : "管理費季度配發點數"
      });
    }
  }

  if(profile.created_at && ledgerEvents.filter(x => x.type === "配發").length === 0) {
    ledgerEvents.push({
      date: profile.created_at.split("T")[0],
      timeText: formatLocalTime(profile.created_at),
      type: "配發",
      amount: "+500",
      granted: "+500",
      stored: "0",
      via: "物業櫃檯",
      foodDetails: "管理費季度配發點數"
    });
  }

  ledgerEvents.sort((a,b) => b.timeText.localeCompare(a.timeText));

  if (selectedFilterMonth) {
    ledgerEvents = ledgerEvents.filter(e => e.timeText.replace(/\//g, "-").startsWith(selectedFilterMonth.replace("-", "-")));
  }

  if (ledgerEvents.length === 0) {
    ledgerHtml += `<tr><td colspan="5" style="color:#aaa; padding:20px;">該月份尚無點數異動明細</td></tr>`;
  } else {
    ledgerEvents.forEach((ev) => {
      const stringified = JSON.stringify(ev).replace(/"/g, '&quot;');
      const isPlus = ev.amount.startsWith("+");
      ledgerHtml += `
        <tr>
          <td>${ev.date}</td>
          <td><span class="status ${ev.type==='消費'?'cancel':(ev.type==='配發'||ev.type==='儲值')?'done':ev.type==='作廢'?'wait':'wait'}">${ev.type}</span></td>
          <td style="font-weight:700; color:${isPlus?'#3f7f47':'#c86b62'}">${ev.amount}</td>
          <td>${ev.via}</td>
          <td><span class="info-popup-link" onclick="window.openLedgerPopup('${stringified}')">明細</span></td>
        </tr>`;
    });
  }

  ledgerHtml += `</tbody></table>`;
  pointLedgerBox.innerHTML = ledgerHtml;
}

window.openLedgerPopup = function(jsonStr) {
  const ev = JSON.parse(jsonStr);
  document.getElementById("popDateTitle").innerText = ev.timeText || ev.date;
  document.getElementById("popType").innerText = ev.type;
  document.getElementById("popVia").innerText = ev.via;
  document.getElementById("popGranted").innerText = ev.granted || "0";
  document.getElementById("popStored").innerText = ev.stored || "0";
  document.getElementById("popFoodItems").innerHTML = ev.foodDetails || "基本額度異動";
  document.getElementById("detailPopupModal").style.display = "flex";
};

window.showProfile=async function(){
  stopAllSnapshots();
  setActive("tabProfile");
  content.innerHTML=`<div class="card"><div class="section-title">個人設定</div><div id="profileBox">讀取中...</div></div>`;
  const profileBox = document.getElementById("profileBox");

  const q=query(collection(db, "balances"),where("uid","==",profile.username));
  const snap=await getDocs(q);

  let granted=0,stored=0;
  if(!snap.empty){
    granted=Number(snap.docs[0].data().granted_amount||0);
    stored=Number(snap.docs[0].data().stored_amount||0);
  }

  const currentNotifyStatus = profile.is_notification_enabled !== false ? "true" : "false";

  profileBox.innerHTML=`
    <div class="point-grid">
      <div class="point-box"><div class="point-label">配發點數</div><div class="point-value">${granted}</div></div>
      <div class="point-box"><div class="point-label">儲值點數</div><div class="point-value">${stored}</div></div>
      <div class="point-box"><div class="point-label">總點數</div><div class="point-value">${granted+stored}</div></div>
    </div>
    <div class="notice-item">帳號：${profile.username}</div>
    
    <div class="notice-item">
      <div style="font-weight:700; color:#6d6258; font-size:16px; margin-bottom:4px;">餐點完成通知設定</div>
      <select id="notificationToggleSelect" onchange="window.updateNotificationPreference(this.value)" style="width:100%; border:none; background:transparent; font-size:15px; outline:none; color:#5f574f; padding:0; cursor:pointer;">
        <option value="true" ${currentNotifyStatus==="true"?"selected":""}>是 (接收餐點完成推播)</option>
        <option value="false" ${currentNotifyStatus==="false"?"selected":""}>否 (關閉通知)</option>
      </select>
    </div>

    <button class="action-btn" onclick="togglePasswordBox()">更改密碼</button>
    <div id="passwordBox" style="display:none;margin-top:16px;">
      <input class="input" id="oldPassword" type="password" placeholder="目前密碼">
      <input class="input" id="newPassword" type="password" placeholder="新密碼，至少 6 碼">
      <input class="input" id="confirmPassword" type="password" placeholder="再次輸入新密碼">
      <button class="action-btn" onclick="changeResidentPassword()">更新密碼</button>
    </div>
  `;
};

window.updateNotificationPreference = async function(val) {
  const isEnabled = val === "true";
  profile.is_notification_enabled = isEnabled;
  localStorage.setItem("zh_user", JSON.stringify(profile));
  
  if (accountDocId) {
    await updateDoc(doc(db, "accounts", accountDocId), {
      is_notification_enabled: isEnabled,
      updated_at: new Date().toISOString()
    });
  }
  
  if (isEnabled && "Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }
  alert("通知設定更新成功");
};

window.togglePasswordBox=function(){
  const box=document.getElementById("passwordBox");
  if(!box)return;
  box.style.display = box.style.display === "block" ? "none" : "block";
};

window.changeResidentPassword=async function(){
  const oldPw=document.getElementById("oldPassword").value.trim();
  const newPw=document.getElementById("newPassword").value.trim();
  const confirmPw=document.getElementById("confirmPassword").value.trim();

  if(!oldPw||!newPw||!confirmPw){ alert("請完整填寫"); return; }
  if(newPw.length < 6){ alert("新密碼至少 6 碼"); return; }
  if(newPw !== confirmPw){ alert("新密碼與確認密碼不一致"); return; }

  try{
    const user=auth.currentUser;
    if(!user||!user.email){ alert("找不到登入帳號"); return; }
    const credential=EmailAuthProvider.credential(user.email,oldPw);
    await reauthenticateWithCredential(user,credential);
    await updatePassword(user,newPw);

    if(!accountDocId){ alert("找不到帳號資料"); return; }
    await updateDoc(doc(db,"accounts",accountDocId),{ updated_at:new Date().toISOString() });

    document.getElementById("oldPassword").value="";
    document.getElementById("newPassword").value="";
    document.getElementById("confirmPassword").value="";
    alert("密碼更新成功");
  }catch(e){
    console.error(e);
    alert("密碼更新失敗："+e.message);
  }
};

document.getElementById("logoutBtn").addEventListener("click",async()=>{
  stopAllSnapshots();
  await signOut(auth);
  localStorage.removeItem("zh_user");
  location.href="index.html";
});
</script>
