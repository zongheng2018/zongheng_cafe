<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昭揚縱橫 智慧社區點餐系統</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.78);backdrop-filter:blur(6px);z-index:-1}
.header{height:72px;background:rgba(255,255,255,.85);border-bottom:1px solid #e5ded6;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:72px;opacity:.85}
.title{font-size:20px;letter-spacing:2px;font-weight:700;color:#6d6258}
.user-info{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:800;color:#6d6258}
.logout{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
.container{max-width:1100px;margin:20px auto;padding:0 16px 40px}

.broadcast-card{background:linear-gradient(135deg, #fbf9f6 0%, #f3ede4 100%);border:1px solid #e1d7cb;border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 6px 20px rgba(109,98,88,0.06)}
.broadcast-title{font-size:18px;font-weight:900;color:#7a5a4c;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.broadcast-content{font-size:15px;line-height:1.6;color:#61564d;white-space:pre-wrap;background:rgba(255,255,255,0.6);padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.8)}

.notice-box{background:#fdecee;border:1px solid #f9cbd0;border-radius:16px;padding:16px;margin-bottom:20px;color:#9c3a3c}
.notice-title{font-weight:900;font-size:16px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.notice-content{font-size:14px;line-height:1.5;white-space:pre-wrap}

.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.card{background:rgba(255,255,255,.9);border:1px solid rgba(230,224,218,.7);border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.card-title{font-size:19px;color:#6d6258;font-weight:800;margin-bottom:14px;letter-spacing:1px}
.balance-num{font-size:32px;font-weight:900;color:#7a6e63;margin-top:6px}
.balance-sub{font-size:14px;color:#8a7e73;margin-top:4px}
.btn-gate{background:linear-gradient(to bottom,#bcaea1,#9c8e81);color:white;border:none;border-radius:16px;width:100%;padding:20px;font-size:19px;font-weight:900;letter-spacing:4px;cursor:pointer;box-shadow:0 6px 20px rgba(156,142,129,.3);text-align:center;text-decoration:none;display:block}

.order-list{display:flex;flex-direction:column;gap:12px;max-height:500px;overflow-y:auto;padding-right:4px}
.order-item{background:white;border:1px solid #eedfd3;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.02)}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.order-id{font-weight:800;font-size:14px;color:#8a7e73}
.order-status{font-weight:900;font-size:14px;padding:4px 10px;border-radius:10px}
.status-wait{background:#fff1d9;color:#9b681f}
.status-making{background:#e6f0ff;color:#426f9c}
.status-done{background:#e8f5e9;color:#3f7f47}
.status-cancel{background:#fde8e6;color:#b3514a}
.food-detail{font-size:15px;font-weight:700;color:#555;margin-bottom:4px;padding-left:4px}
.food-opt{font-size:13px;color:#888;margin-bottom:6px;padding-left:4px}
.order-total{border-top:1px dashed #eee;padding-top:8px;margin-top:8px;text-align:right;font-weight:800;font-size:14px}
.empty-msg{text-align:center;color:#999;padding:30px 0;font-size:15px}
</style>
</head>
<body>

<div class="header">
  <div class="brand"><img src="logo.png"><div class="title">大廳首頁</div></div>
  <div class="user-info">
    <span id="userDisplay">讀取中...</span>
    <button class="logout" id="logoutBtn">登出</button>
  </div>
</div>

<div class="container">
  <div id="noticeArea" class="notice-box" style="display:none;">
    <div class="notice-title">⚠️ 重要緊急通知</div>
    <div id="noticeContent" class="notice-content"></div>
  </div>

  <div class="broadcast-card">
    <div class="broadcast-title">📢 咖啡廳最新公告</div>
    <div id="broadcastContent" class="broadcast-content">目前尚無公告訊息。</div>
  </div>

  <div class="dashboard">
    <div class="card">
      <div class="card-title">我的點餐點數</div>
      <div class="balance-num" id="totalBalance">0 <span style="font-size:16px">點</span></div>
      <div class="balance-sub" id="balanceDetail">點數點發：0 點 ｜ 儲值點數：0 點</div>
    </div>
    <div class="card" style="display:flex;align-items:center;justify-content:center;background:none;box-shadow:none;border:none;padding:0">
      <a href="resident_order.html" class="btn-gate">進入線上點餐系統</a>
    </div>
  </div>

  <div class="card">
    <div class="card-title">我的歷史點餐紀錄</div>
    <div id="orderList" class="order-list">
      <div class="empty-msg">正在載入歷史訂單...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, onSnapshot, collection, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain: "zonghengcafe.firebaseapp.com",
  projectId: "zonghengcafe",
  storageBucket: "zonghengcafe.firebasestorage.app",
  messagingSenderId: "207027108121",
  appId: "1:207027108121:web:e7a39e19982ed77f9aed88"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, user => {
  if (!user) { location.href = "index.html"; return; }
  const cached = localStorage.getItem("zh_user");
  if (!cached) { location.href = "index.html"; return; }
  currentUser = JSON.parse(cached);
  userDisplay.innerText = `${currentUser.uid} 戶 (${currentUser.name || '住戶'})`;
  
  listenBalance();
  listenMyOrders();
  listenBroadcast();
});

function listenBroadcast() {
  onSnapshot(doc(db, "settings", "broadcast"), s => {
    if (s.exists()) {
      const data = s.data();
      if (data.announcement && data.announcement.trim() !== "") {
        document.getElementById("broadcastContent").innerText = data.announcement;
      } else {
        document.getElementById("broadcastContent").innerText = "目前尚無公告訊息。";
      }
      if (data.notice && data.notice.trim() !== "") {
        document.getElementById("noticeContent").innerText = data.notice;
        document.getElementById("noticeArea").style.display = "block";
      } else {
        document.getElementById("noticeArea").style.display = "none";
      }
    }
  });
}

function listenBalance() {
  onSnapshot(query(collection(db, "balances"), where("uid", "==", currentUser.uid)), snap => {
    if (!snap.empty) {
      const d = snap.docs[0].data();
      const granted = Number(d.granted_amount || 0);
      const stored = Number(d.stored_amount || 0);
      totalBalance.innerHTML = `${granted + stored} <span style="font-size:16px">點</span>`;
      balanceDetail.innerText = `點數點發：${granted} 點 ｜ 儲值點數：${stored} 點`;
    }
  });
}

function listenMyOrders() {
  const q = query(
    collection(db, "orders"),
    where("uid", "==", currentUser.uid),
    orderBy("created_at", "desc")
  );
  
  onSnapshot(q, snap => {
    const box = document.getElementById("orderList");
    box.innerHTML = "";
    
    if (snap.empty) {
      box.innerHTML = `<div class="empty-msg">目前尚無任何點餐紀錄。</div>`;
      return;
    }
    
    snap.forEach(d => {
      const o = d.data();
      const status = o.status || "等待接單";
      let statusClass = "status-wait";
      if (status === "製作中") statusClass = "status-making";
      if (status === "已完成") statusClass = "status-done";
      if (status === "已取消") statusClass = "status-cancel";
      
      const div = document.createElement("div");
      div.className = "order-item";
      
      let itemsHtml = "";
      (o.items || []).forEach(item => {
        itemsHtml += `<div class="food-detail">${item.name} × ${item.qty}</div>`;
        if (item.options && Object.keys(item.options).length > 0) {
          const opts = Object.entries(item.options).map(([k,v]) => `${k}:${v}`).join(", ");
          itemsHtml += `<div class="food-opt">${opts}</div>`;
        }
        if (item.note && item.note.trim() !== "") {
          itemsHtml += `<div class="food-opt" style="color:#c57c76;">備註：${item.note}</div>`;
        }
      });
      
      const timeStr = o.created_at ? o.created_at.replace("T", " ").substring(0, 16) : "";
      const seatInfo = o.dining_type === "內用" && o.seat ? ` (座位: ${o.seat})` : ` (${o.dining_type || '外帶'})`;
      
      div.innerHTML = `
        <div class="order-header">
          <div class="order-id">單號：${o.order_id || d.id}<br><span style="font-weight:normal; font-size:12px; color:#aaa;">${timeStr}</span></div>
          <div class="order-status ${statusClass}">${status}</div>
        </div>
        <div>${itemsHtml}</div>
        <div class="order-total">消費金額：<span style="color:#7a5a4c; font-size:15px;">${o.total || 0} 點</span>${seatInfo}</div>
      `;
      box.appendChild(div);
    });
  }, error => {
    console.error("載入訂單失敗:", error);
    document.getElementById("orderList").innerHTML = `<div class="empty-msg" style="color:#c86b62;">訂單讀取失敗。</div>`;
  });
}

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  localStorage.removeItem("zh_user");
  location.href = "index.html";
});
</script>
</body>
</html>
