<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住戶首頁｜昭揚縱橫</title>

<style>
*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif
}

body{
  margin:0;
  min-height:100vh;
  background:url("bg.jpg") center center/cover fixed no-repeat;
  color:#5f574f;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(5px);
  z-index:-1;
}

.header{
  height:72px;
  background:rgba(255,255,255,.9);
  border-bottom:1px solid #ddd5cc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:64px;
  opacity:.84;
}

.header-title{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  color:#6d6258;
}

.logout-btn{
  border:none;
  background:#f0e8df;
  color:#6d6258;
  border-radius:14px;
  padding:10px 16px;
  font-weight:900;
}

.container{
  max-width:920px;
  margin:24px auto;
  padding:0 16px 40px;
}

.card{
  background:rgba(255,255,255,.92);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 10px 24px rgba(0,0,0,.07);
  border:1px solid #eee5dd;
}

.section-title{
  font-size:26px;
  font-weight:900;
  color:#6d6258;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.menu-btn{
  border:none;
  background:linear-gradient(to bottom,#bcaea1,#9c8e81);
  color:white;
  border-radius:20px;
  padding:24px;
  font-size:20px;
  font-weight:900;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.info{
  line-height:2;
  font-size:16px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  margin-bottom:8px;
  font-weight:900;
  color:#6d6258;
}

input{
  width:100%;
  border:none;
  background:#f5f1eb;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  outline:none;
  color:#5f574f;
}

.primary-btn{
  border:none;
  background:#6d6258;
  color:white;
  border-radius:16px;
  padding:14px 20px;
  font-size:16px;
  font-weight:900;
}

.notice{
  margin-top:14px;
  background:#f8f5f1;
  border-radius:16px;
  padding:14px;
  line-height:1.8;
}

.password-toggle{
  margin-top:18px;
}

.password-box{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #eee5dd;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="header">

  <div class="brand">

    <img src="logo.png"
      class="logo">

    <div class="header-title">
      住戶首頁
    </div>

  </div>

  <button class="logout-btn"
    id="logoutBtn">

    登出

  </button>

</div>

<div class="container">

  <div class="card">

    <div class="section-title">
      功能選單
    </div>

    <div class="grid">

      <button class="menu-btn"
        onclick="location.href='resident_order.html'">

        咖啡廳點餐

      </button>

      <button class="menu-btn"
        onclick="location.href='resident_order.html'">

        我的訂單

      </button>

    </div>

  </div>

  <div class="card">

    <div class="section-title">
      我的資訊
    </div>

    <div class="info"
      id="profileInfo">

      讀取中...

    </div>

    <div class="password-toggle">

      <button class="primary-btn"
        onclick="togglePasswordBox()">

        更改密碼

      </button>

    </div>

    <div class="password-box"
      id="passwordBox">

      <div class="field">

        <label>
          目前密碼
        </label>

        <input
          type="password"
          id="oldPassword">

      </div>

      <div class="field">

        <label>
          新密碼
        </label>

        <input
          type="password"
          id="newPassword">

      </div>

      <div class="field">

        <label>
          再次輸入新密碼
        </label>

        <input
          type="password"
          id="confirmPassword">

      </div>

      <button class="primary-btn"
        onclick="changePassword()">

        更新密碼

      </button>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut,
  updatePassword,
  EmailAuthProvider,
  reauthenticateWithCredential
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain:"zonghengcafe.firebaseapp.com",
  projectId:"zonghengcafe",
  storageBucket:"zonghengcafe.firebasestorage.app",
  messagingSenderId:"207027108121",
  appId:"1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId:"G-8ZE4SE2T7T"
};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

let profile = null;
let accountDocId = null;
let currentPassword = "";

onAuthStateChanged(auth, async user=>{

  if(!user){

    location.href="index.html";

    return;

  }

  const raw =
  localStorage.getItem("zh_user");

  if(!raw){

    location.href="index.html";

    return;

  }

  profile =
  JSON.parse(raw);

  if(profile.role!=="resident"){

    location.href="index.html";

    return;

  }

  await loadProfile();

});

async function loadProfile(){

  const q =
  query(
    collection(db,"accounts"),
    where("username","==",profile.username)
  );

  const snap =
  await getDocs(q);

  if(snap.empty){

    document.getElementById("profileInfo")
      .innerText = "找不到使用者資料";

    return;

  }

  const d =
  snap.docs[0];

  accountDocId =
  d.id;

  const data =
  d.data();

  currentPassword =
  data.password || "";

  document.getElementById("profileInfo")
    .innerHTML = `
      帳號：${data.username || ""}<br>
      樓層：${data.floor || "-"}<br>
      房號：${data.room || "-"}
    `;

}

window.togglePasswordBox = ()=>{

  const box =
  document.getElementById("passwordBox");

  box.style.display =
  box.style.display==="block"
  ? "none"
  : "block";

};

window.changePassword = async ()=>{

  const oldPw =
  document.getElementById("oldPassword")
    .value
    .trim();

  const newPw =
  document.getElementById("newPassword")
    .value
    .trim();

  const confirmPw =
  document.getElementById("confirmPassword")
    .value
    .trim();

  if(!oldPw || !newPw || !confirmPw){

    alert("請完整填寫");

    return;

  }

  if(oldPw !== currentPassword){

    alert("目前密碼錯誤");

    return;

  }

  if(newPw !== confirmPw){

    alert("新密碼與確認密碼不一致");

    return;

  }

  if(newPw.length < 4){

    alert("密碼至少 4 碼");

    return;

  }

  try{

    const user =
    auth.currentUser;

    if(user && user.email){

      const credential =
      EmailAuthProvider.credential(
        user.email,
        oldPw
      );

      await reauthenticateWithCredential(
        user,
        credential
      );

      await updatePassword(
        user,
        newPw
      );

    }

  }catch(e){

    console.log(e);

  }

  await updateDoc(
    doc(db,"accounts",accountDocId),
    {
      password:newPw
    }
  );

  currentPassword =
  newPw;

  document.getElementById("oldPassword")
    .value = "";

  document.getElementById("newPassword")
    .value = "";

  document.getElementById("confirmPassword")
    .value = "";

  alert("密碼更新成功");

};

document.getElementById("logoutBtn")
.addEventListener("click", async ()=>{

  await signOut(auth);

  localStorage.removeItem("zh_user");

  location.href="index.html";

});
</script>

</body>
</html>
