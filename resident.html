<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>住戶介面</title>
  <style>
    body {font-family: Arial; background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh;}
    .box {background:white; padding:30px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.2); width:400px;}
  </style>
</head>
<body>
  <div class="box">
    <div id="balance">餘額：載入中...</div>
    <h2>公告</h2>
    <ul id="announcements"></ul>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = { /* Firebase 設定 */ };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function loadResident() {
      const balanceDoc = await db.collection("balances").doc("resident01").get();
      if (balanceDoc.exists) document.getElementById("balance").innerText = "餘額：" + balanceDoc.data().amount;

      const ann = await db.collection("announcements").get();
      ann.forEach(doc => {
        const li = document.createElement("li");
        li.textContent = doc.data().text;
        document.getElementById("announcements").appendChild(li);
      });
    }
    loadResident();
  </script>
</body>
</html>
