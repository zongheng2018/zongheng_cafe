<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>住戶首頁｜昭揚縱橫 咖啡廳點餐系統</title>

<style>

*{
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:url("bg.jpg") center center / cover no-repeat fixed;
    color:#5f574f;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(4px);
    z-index:-1;
}

.topbar{
    height:72px;
    background:rgba(255,255,255,.82);
    border-bottom:1px solid #ddd5cc;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.brand{
    display:flex;
    align-items:center;
}

.brand img{
    width:78px;
    opacity:.82;
}

.logout{
    border:1px solid #c9c0b7;
    background:rgba(255,255,255,.88);
    color:#6d6258;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
}

.container{
    max-width:760px;
    margin:24px auto 120px;
    padding:0 16px;
}

.card{
    background:rgba(255,255,255,.88);
    border-radius:14px;
    padding:24px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.section-title{
    font-size:28px;
    color:#6d6258;
    letter-spacing:2px;
    margin-bottom:18px;
    font-weight:600;
}

.announcement{
    background:rgba(248,245,241,.95);
    border-radius:10px;
    min-height:180px;
    padding:20px;
    line-height:1.9;
    font-size:18px;
    color:#6b635b;
}

.bottom-menu{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:rgba(255,255,255,.93);
    border-top:1px solid #ddd5cc;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:10px 8px 18px;
    backdrop-filter:blur(12px);
    box-shadow:0 -4px 18px rgba(0,0,0,.08);
}

.menu-btn{
    border:none;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#7a6b60;
    cursor:pointer;
    gap:8px;
}

.menu-icon{
    width:54px;
    height:54px;
    border-radius:18px;
    background:linear-gradient(to bottom,#bcaea1,#9c8e81);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.12);
}

.menu-icon img{
    width:27px;
    height:27px;
    object-fit:contain;
    filter:brightness(0) invert(1);
}

.menu-text{
    font-size:14px;
    letter-spacing:1px;
}

.loading{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6d6258;
    font-size:18px;
    letter-spacing:2px;
}

@media(max-width:560px){

    .brand img{
        width:64px;
    }

    .section-title{
        font-size:24px;
    }

    .announcement{
        font-size:16px;
    }

}

</style>
</head>

<body>

<div id="loading" class="loading">
    驗證登入狀態中...
</div>

<div id="app" style="display:none;">

    <div class="topbar">

        <div class="brand">
            <img src="logo.png">
        </div>

        <button class="logout" id="logoutBtn">
            登出
        </button>

    </div>

    <div class="container">

        <div class="card">

            <div class="section-title">
                最新公告
            </div>

            <div class="announcement" id="announcementBox">
                目前尚無公告
            </div>

        </div>

    </div>

    <!-- 底部功能列 -->

    <div class="bottom-menu">

        <button class="menu-btn">

            <div class="menu-icon">
                <img src="icons/coffee.png">
            </div>

            <div class="menu-text">
                開始點餐
            </div>

        </button>

        <button class="menu-btn">

            <div class="menu-icon">
                <img src="icons/order.png">
            </div>

            <div class="menu-text">
                訂單紀錄
            </div>

        </button>

        <button class="menu-btn">

            <div class="menu-icon">
                <img src="icons/bell.png">
            </div>

            <div class="menu-text">
                重要通知
            </div>

        </button>

        <button class="menu-btn">

            <div class="menu-icon">
                <img src="icons/setting.png">
            </div>

            <div class="menu-text">
                個人設定
            </div>

        </button>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain: "zonghengcafe.firebaseapp.com",
  projectId: "zonghengcafe",
  storageBucket: "zonghengcafe.firebasestorage.app",
  messagingSenderId: "207027108121",
  appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId: "G-8ZE4SE2T7T"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

    if(!user){

        alert("請先登入");

        location.href = "index.html";

        return;
    }

    const raw =
    localStorage.getItem("zh_user");

    if(!raw){

        alert("登入資訊遺失");

        location.href = "index.html";

        return;
    }

    const profile =
    JSON.parse(raw);

    if(profile.role !== "resident"){

        alert("沒有權限");

        location.href = "index.html";

        return;
    }

    document.getElementById("loading").style.display =
    "none";

    document.getElementById("app").style.display =
    "block";

    loadAnnouncements();

});

async function loadAnnouncements(){

    const snapshot =
    await getDocs(collection(db,"announcements"));

    if(snapshot.empty){

        document.getElementById("announcementBox").innerText =
        "目前尚無公告";

        return;
    }

    let latest = "";

    snapshot.forEach((doc)=>{

        const data = doc.data();

        if(!latest && data.content){

            latest = data.content;

        }

    });

    document.getElementById("announcementBox").innerText =
    latest || "目前尚無公告";

}

document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

    await signOut(auth);

    localStorage.removeItem("zh_user");

    location.href = "index.html";

});

</script>

</body>
</html>
