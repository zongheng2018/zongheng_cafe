<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物業櫃台｜昭揚縱橫 咖啡廳點餐系統</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    }

    body {
      margin: 0;
      background: #f5f1eb;
      color: #5d534a;
    }

    .loading {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #7b7268;
    }

    .topbar {
      height: 60px;
      background: linear-gradient(to right, #9f8f80, #7e6e61);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }

    .title {
      font-size: 22px;
      letter-spacing: 3px;
    }

    .logout-btn {
      border: none;
      background: white;
      color: #7d6e60;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
    }

    .container {
      padding: 20px;
    }

    .welcome-box {
      background: white;
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    .welcome-title {
      font-size: 28px;
      margin-bottom: 14px;
      color: #746659;
    }

    .welcome-text {
      line-height: 1.9;
      color: #7b7269;
    }
  </style>
</head>

<body>

<div id="loading" class="loading">
  驗證登入狀態中...
</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <div class="title">物業櫃台</div>
    <button id="logoutBtn" class="logout-btn">登出</button>
  </div>

  <div class="container">
    <div class="welcome-box">
      <div class="welcome-title">物業管理系統</div>

      <div class="welcome-text">
        下一步我們會開始加入：
        <br><br>
        ・新增住戶帳號
        <br>
        ・修改住戶密碼
        <br>
        ・儲值點數
        <br>
        ・配發點數
        <br>
        ・列印儲值單
        <br>
        ・管理訂單
        <br>
        ・發送通知
      </div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain: "zonghengcafe.firebaseapp.com",
  projectId: "zonghengcafe",
  storageBucket: "zonghengcafe.firebasestorage.app",
  messagingSenderId: "207027108121",
  appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId: "G-8ZE4SE2T7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    alert("請先登入");
    window.location.href = "index.html";
    return;
  }

  const raw = localStorage.getItem("zh_user");

  if (!raw) {
    window.location.href = "index.html";
    return;
  }

  const profile = JSON.parse(raw);

  if (profile.role !== "property") {
    alert("您沒有權限進入此頁面");
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  localStorage.removeItem("zh_user");
  window.location.href = "index.html";
});
</script>

</body>
</html>
