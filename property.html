<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>物業櫃檯 昭揚宗恆 咖啡廳點餐系統</title>
</head>
<body>
  <h2>物業櫃檯管理</h2>

  <!-- 新增公告 -->
  <h3>新增公告</h3>
  <input id="title" placeholder="公告標題">
  <input id="content" placeholder="公告內容">
  <button onclick="addAnnouncement()">新增公告</button>

  <!-- 公告列表 -->
  <h3>公告列表</h3>
  <ul id="announcements"></ul>

  <!-- 新增住戶帳號 -->
  <h3>新增住戶帳號</h3>

  <input id="new_username" placeholder="帳號">
  <input id="new_password" placeholder="密碼">

  <input id="new_floor" placeholder="樓層">
  <input id="new_room" placeholder="房號">

  <button onclick="createResident()">
    建立住戶帳號
  </button>

  <!-- 住戶帳號列表 -->
  <h3>住戶帳號</h3>
  <ul id="accounts"></ul>

  <!-- Firebase SDK -->
  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      addDoc
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    import {
      getFunctions,
      httpsCallable
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
      authDomain: "zonghengcafe.firebaseapp.com",
      projectId: "zonghengcafe",
      storageBucket: "zonghengcafe.firebasestorage.app",
      messagingSenderId: "207027108121",
      appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
      measurementId: "G-8ZE4SE2T7T"
    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const functions =
    getFunctions(app, "asia-east1");

    // 新增公告
    async function addAnnouncement() {

      const title =
      document.getElementById("title").value;

      const content =
      document.getElementById("content").value;

      const date =
      new Date().toLocaleDateString();

      await addDoc(
        collection(db,"announcements"),
        {
          title,
          content,
          date
        }
      );

      alert("公告已新增！");

      loadAnnouncements();

    }

    // 安全建立住戶帳號
    async function createResident() {

      const username =
      document.getElementById("new_username").value.trim();

      const password =
      document.getElementById("new_password").value.trim();

      const floor =
      document.getElementById("new_floor").value.trim();

      const room =
      document.getElementById("new_room").value.trim();

      if(!username || !password){

        alert("請輸入帳號密碼");
        return;

      }

      try{

        const createAccount =
        httpsCallable(functions, "createAccount");

        await createAccount({

          username: username,
          password: password,

          role: "resident",

          floor: floor,
          room: room,

          granted_amount: 0,
          stored_amount: 0

        });

        alert("住戶帳號建立成功！");

        document.getElementById("new_username").value = "";
        document.getElementById("new_password").value = "";
        document.getElementById("new_floor").value = "";
        document.getElementById("new_room").value = "";

        loadAccounts();

      }catch(error){

        console.error(error);

        alert("建立失敗：" + error.message);

      }

    }

    // 載入公告
    async function loadAnnouncements() {

      const snapshot =
      await getDocs(collection(db,"announcements"));

      const list =
      document.getElementById("announcements");

      list.innerHTML = "";

      snapshot.forEach(doc => {

        const ann = doc.data();

        const li =
        document.createElement("li");

        li.innerText =
        ann.date +
        " - " +
        ann.title +
        "：" +
        ann.content;

        list.appendChild(li);

      });

    }

    // 載入住戶帳號
    async function loadAccounts() {

      const snapshot =
      await getDocs(collection(db,"accounts"));

      const list =
      document.getElementById("accounts");

      list.innerHTML = "";

      snapshot.forEach(doc => {

        const acc = doc.data();

        const li =
        document.createElement("li");

        li.innerText =
        acc.username +
        "（角色：" +
        acc.role +
        "）";

        list.appendChild(li);

      });

    }

    loadAnnouncements();

    loadAccounts();

    window.addAnnouncement =
    addAnnouncement;

    window.createResident =
    createResident;

  </script>

</body>
</html>
