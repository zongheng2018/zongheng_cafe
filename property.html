<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>物業管理系統</title>
  <style>
    body {font-family: Arial; background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh;}
    .box {background:white; padding:30px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.2); width:500px;}
    h1 {text-align:center; margin-bottom:20px;}
  </style>
</head>
<body>
  <div class="box">
    <h1>物業管理系統</h1>
    <input id="announcement" placeholder="新增公告">
    <button onclick="addAnnouncement()">發布</button>
    <h2>公告列表</h2>
    <ul id="announcements"></ul>
    <h2>帳號列表</h2>
    <ul id="accounts"></ul>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = { /* Firebase 設定 */ };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function addAnnouncement() {
      const text = document.getElementById("announcement").value;
      if (text) await db.collection("announcements").add({text});
      location.reload();
    }

    async function loadProperty() {
      const ann = await db.collection("announcements").get();
      ann.forEach(doc => {
        const li = document.createElement("li");
        li.textContent = doc.data().text;
        document.getElementById("announcements").appendChild(li);
      });

      const acc = await db.collection("accounts").get();
      acc.forEach(doc => {
        const li = document.createElement("li");
        li.textContent = doc.data().username + " (" + doc.data().role + ")";
        document.getElementById("accounts").appendChild(li);
      });
    }
    loadProperty();
  </script>
</body>
</html>
