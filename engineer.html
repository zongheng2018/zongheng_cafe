<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程師後台｜昭揚縱橫 咖啡廳點餐系統</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.76);backdrop-filter:blur(5px);z-index:-1}
.header{height:72px;background:rgba(255,255,255,.88);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:72px;opacity:.82}
.title{font-size:22px;letter-spacing:2px;font-weight:700;color:#6d6258}
.logout{border:1px solid #c9c0b7;background:rgba(255,255,255,.88);color:#6d6258;border-radius:10px;padding:9px 16px}
.container{max-width:1180px;margin:22px auto;padding:0 16px 40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tab{border:none;background:rgba(255,255,255,.88);color:#7a6b60;border-radius:16px;padding:14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.06);cursor:pointer}
.tab.active{background:linear-gradient(to bottom,#bcaea1,#9c8e81);color:white}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(230,224,218,.8);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.section-title{font-size:26px;color:#6d6258;font-weight:800;margin-bottom:16px;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.stat{background:#f8f5f1;border-radius:18px;padding:20px;text-align:center}
.stat-label{font-size:14px;color:#8b8178}
.stat-value{font-size:34px;font-weight:900;color:#6f4f40;margin-top:8px}
.form-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
input,select,textarea{width:100%;border:none;background:#f5f1eb;border-radius:14px;padding:13px;font-size:15px;outline:none;color:#5f574f}
textarea{height:100px;resize:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:13px;padding:10px 16px;font-weight:800;color:white;background:#9c8e81;cursor:pointer}
.btn.primary{background:#6d6258}
.btn.done{background:#6b8b61}
.btn.danger{background:#c86b62}
.list-card{background:rgba(255,255,255,.96);border-radius:18px;padding:18px;border:1px solid #eee5dd;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.item-title{font-size:20px;font-weight:900;color:#5f574f;margin-bottom:8px}
.meta{font-size:14px;color:#777;line-height:1.7}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#eee3d8;color:#6d6258;font-weight:800;font-size:13px}
.small-form{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:12px}
.eye-btn{border:none;background:#f5f1eb;border-radius:14px;padding:0 10px;cursor:pointer;color:#8b8178;font-weight:bold;display:flex;align-items:center;justify-content:center}
.hidden{display:none}
.empty{text-align:center;color:#999;padding:40px}

@media(max-width:900px){.tabs{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.title{font-size:18px}.brand img{width:60px}}
</style>
</head>

<body>
<div class="header">
  <div class="brand">
    <img src="logo.png">
    <div class="title">工程師後台</div>
  </div>
  <button class="logout" id="logoutBtn">登出</button>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="window.showTab('dashboard',this)">系統總覽</button>
    <button class="tab" onclick="window.showTab('accounts',this)">帳號管理</button>
    <button class="tab" onclick="window.showTab('announcements',this)">公告管理</button>
    <!-- 🚀 修正點：就地取材取代座位管理，改為「系統公告」控制台 -->
    <button class="tab" onclick="window.showTab('seats',this)">系統公告</button>
  </div>

  <section id="dashboardTab">
    <div class="card">
      <div class="section-title">系統總覽</div>
      <div class="grid">
        <div class="stat"><div class="stat-label">帳號數</div><div class="stat-value" id="statAccounts">0</div></div>
        <div class="stat"><div class="stat-label">住戶數</div><div class="stat-value" id="statResidents">0</div></div>
        <div class="stat"><div class="stat-label">菜單品項</div><div class="stat-value" id="statMenu">0</div></div>
        <div class="stat"><div class="stat-label">訂單數</div><div class="stat-value" id="statOrders">0</div></div>
      </div>
    </div>
  </section>

  <section id="accountsTab" class="hidden">
    <div class="card">
      <div class="section-title">新增帳號</div>
      <div class="form-grid">
        <input id="newUsername" placeholder="帳號">
        <input id="newPassword" type="password" placeholder="密碼，至少 6 碼">
        <select id="newRole">
          <option value="resident">住戶 resident</option>
          <option value="cafe">咖啡廳 cafe</option>
          <option value="property">物業 property</option>
          <option value="engineer">工程師 engineer</option>
        </select>
        <input id="newEmail" placeholder="Auth Email，可空白">
        <input id="newUnit" placeholder="戶號，可空白">
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="window.addAccount()">新增帳號</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">所有帳號</div>
      <div id="accountList" class="grid"></div>
    </div>
  </section>

  <section id="announcementsTab" class="hidden">
    <div class="card">
      <div class="section-title">發布公告</div>
      <input id="annTitle" placeholder="公告標題">
      <br><br>
      <textarea id="annContent" placeholder="公告內容"></textarea>
      <div class="btn-row">
        <button class="btn primary" onclick="window.addAnnouncement()">發布公告</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">公告列表</div>
      <div id="announcementList" class="grid"></div>
    </div>
  </section>

  <!-- 🚀 核心改造：精準接軌住戶端 Kiosk 大公告的系統後台控制面板 -->
  <section id="seatsTab" class="hidden">
    <div class="card">
      <div class="section-title">系統緊急公告主控台</div>
      <div style="background:#f8f5f1; padding:14px; border-radius:14px; margin-bottom:14px; font-size:14px; color:#6d6258; font-weight:700;">
        ⚠️ 本公告發布後將以大彈窗形式直接阻斷住戶首頁（支援文字、獨立圖片開關與不再顯示防卡死追蹤功能）。
      </div>
      
      <div style="margin-bottom:12px;">
        <label style="font-weight:800; display:block; margin-bottom:6px;">公告總啟用開關：</label>
        <select id="engBroadcastEnabled">
          <option value="false">關閉公告 (不對住戶跳出)</option>
          <option value="true">開啟公告 (住戶登入立刻彈出)</option>
        </select>
      </div>

      <div style="margin-bottom:12px;">
        <label style="font-weight:800; display:block; margin-bottom:6px;">公告訊息內文：</label>
        <textarea id="engBroadcastContent" placeholder="請輸入欲通知住戶的系統故障或緊急維護內容..."></textarea>
      </div>

      <div style="margin-bottom:12px;">
        <label style="font-weight:800; display:block; margin-bottom:6px;">公告附加圖片開關：</label>
        <select id="engBroadcastImgEnabled" onchange="window.toggleEngImgInput()">
          <option value="false">關閉圖片 (純文字顯示)</option>
          <option value="true">開啟圖片 (同步顯示附加圖片)</option>
        </select>
      </div>

      <div id="engBroadcastImgUrlArea" style="margin-bottom:12px; display:none;">
        <label style="font-weight:800; display:block; margin-bottom:6px;">附加圖片網址 (URL)：</label>
        <input id="engBroadcastImageUrl" placeholder="請輸入完整的網址，例如 https://.../img.jpg">
      </div>

      <div class="btn-row">
        <button class="btn danger" style="background:#6d6258; padding:12px 24px;" onclick="window.saveSystemEngineerBroadcast()">儲存並即時發布系統公告</button>
      </div>
    </div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc,setDoc,onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getFunctions,httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js";

const firebaseConfig={apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",authDomain:"zonghengcafe.firebaseapp.com",projectId:"zonghengcafe",storageBucket:"zonghengcafe.firebasestorage.app",messagingSenderId:"207027108121",appId:"1:207027108121:web:e7a39e19982ed77f9aed88",measurementId:"G-8ZE4SE2T7T"};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const functions=getFunctions(app,"asia-east1");

const createAccountFn=httpsCallable(functions,"createAccount");
const updateAccountPasswordFn=httpsCallable(functions,"updateAccountPassword");

let accounts=[];

onAuthStateChanged(auth,async user=>{
  if(!user){location.href="index.html";return}
  const raw=localStorage.getItem("zh_user");
  if(!raw){location.href="index.html";return}
  const profile=JSON.parse(raw);
  if(profile.role!=="engineer"){alert("沒有權限");location.href="index.html";return}
  await loadAll();
  listenCurrentEngineerBroadcast(); // 監聽當前公告以便回填
});

window.showTab=(tab,btn)=>{
  dashboardTab.classList.add("hidden");
  accountsTab.classList.add("hidden");
  announcementsTab.classList.add("hidden");
  seatsTab.classList.add("hidden");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(tab+"Tab").classList.remove("hidden");
};

async function loadAll(){
  await loadStats();
  await loadAccounts();
  await loadAnnouncements();
}

async function loadStats(){
  const acc=await getDocs(collection(db,"accounts"));
  const menu=await getDocs(collection(db,"menu"));
  const orders=await getDocs(collection(db,"orders"));

  let residents=0;
  acc.forEach(d=>{if(d.data().role==="resident")residents++});

  statAccounts.innerText=acc.size;
  statResidents.innerText=residents;
  statMenu.innerText=menu.size;
  statOrders.innerText=orders.size;
}

async function loadAccounts(){
  const snap=await getDocs(collection(db,"accounts"));
  accounts=[];
  accountList.innerHTML="";

  if(snap.empty){
    accountList.innerHTML='<div class="empty">目前沒有帳號</div>';
    return;
  }

  snap.forEach(d=>{
    const x={docId:d.id,...d.data()};
    accounts.push(x);

    const div=document.createElement("div");
    div.className="list-card";
    
    div.innerHTML=`
      <div class="item-title">${x.username||""}</div>
      <div class="meta">角色：<span class="badge">${x.role||""}</span></div>
      <div class="meta">Auth Email：${x.auth_email||x.email||"未設定"}</div>
      <div class="meta">戶號：${x.unit_number||x.room||""}</div>
      <div class="small-form">
        <input id="pw-${x.docId}" type="password" value="${x.password||""}" placeholder="新密碼，至少 6 碼">
        <button class="eye-btn" onclick="window.togglePasswordVisibility('${x.docId}')">👁️</button>
        <button class="btn primary" onclick="window.savePassword('${x.docId}')">儲存</button>
      </div>
    `;
    accountList.appendChild(div);
  });
}

window.togglePasswordVisibility=(id)=>{
  const input = document.getElementById(`pw-${id}`);
  if(input) {
    if(input.type === "password") input.type = "text";
    else input.type = "password";
  }
};

window.addAccount=async()=>{
  const username=newUsername.value.trim();
  const password=newPassword.value.trim();
  const role=newRole.value;
  const unit_number=newUnit.value.trim();

  if(!username||!password||!role){
    alert("請填帳號、密碼、角色");
    return;
  }

  if(password.length<6){
    alert("密碼至少 6 碼");
    return;
  }

  try {
    await createAccountFn({
      username,
      password,
      role,
      floor:"",
      room:unit_number,
      granted_amount:0,
      stored_amount:0
    });

    alert("帳號已建立，Firebase Auth 與 Firestore 已同步");

    newUsername.value="";
    newPassword.value="";
    newEmail.value="";
    newUnit.value="";

    await loadAll();

  }catch(error){
    console.error(error);
    alert("建立失敗："+(error.message||error));
  }
};

window.savePassword=async(id)=>{
  const acc=accounts.find(x=>x.docId===id);
  if(!acc||!acc.username){
    alert("找不到帳號資料");
    return;
  }

  const value=document.getElementById(`pw-${id}`).value.trim();
  if(!value){
    alert("請輸入密碼");
    return;
  }

  if(value.length<6){
    alert("密碼至少 6 碼");
    return;
  }

  if(!confirm(`確定要同步修改 ${acc.username} 的密碼？`)){
    return;
  }

  try{
    await updateAccountPasswordFn({
      username:acc.username,
      newPassword:value
    });

    alert("密碼已同步更新 Firebase Auth 與 Firestore");
    await loadAccounts();

  }catch(error){
    console.error(error);
    alert("更新失敗："+(error.message||error));
  }
};

async function loadAnnouncements(){
  const snap=await getDocs(collection(db,"announcements"));
  announcementList.innerHTML="";

  if(snap.empty){
    announcementList.innerHTML='<div class="empty">目前沒有公告</div>';
    return;
  }

  snap.forEach(d=>{
    const x=d.data();
    const div=document.createElement("div");
    div.className="list-card";
    div.innerHTML=`
      <div class="item-title">${x.title||"通知"}</div>
      <div class="meta">${x.content||""}</div>
      <div class="btn-row">
        <button class="btn danger" onclick="window.deleteAnnouncement('${d.id}')">刪除</button>
      </div>
    `;
    announcementList.appendChild(div);
  });
}

window.addAnnouncement=async()=>{
  const title=annTitle.value.trim();
  const content=annContent.value.trim();

  if(!content){
    alert("請輸入公告內容");
    return;
  }

  await addDoc(collection(db,"announcements"),{
    title:title||"通知",
    content,
    created_at:new Date().toISOString()
  });

  annTitle.value="";
  annContent.value="";

  await loadAnnouncements();
};

window.deleteAnnouncement=async(id)=>{
  if(!confirm("確定刪除此公告？"))return;
  await deleteDoc(doc(db,"announcements",id));
  await loadAnnouncements();
};

// 🚀 核心新增：圖片輸入框動態顯隱機制
window.toggleEngImgInput = () => {
  const isImgEnabled = document.getElementById("engBroadcastImgEnabled").value === "true";
  document.getElementById("engBroadcastImgUrlArea").style.display = isImgEnabled ? "block" : "none";
};

// 🚀 核心新增：監聽並回填當前公告內容，方便工程師維護
function listenCurrentEngineerBroadcast() {
  onSnapshot(doc(db, "settings", "engineer_broadcast"), s => {
    if(!s.exists()) return;
    const d = s.data();
    document.getElementById("engBroadcastEnabled").value = String(d.enabled || false);
    document.getElementById("engBroadcastContent").value = d.content || "";
    document.getElementById("engBroadcastImgEnabled").value = String(d.image_enabled || false);
    document.getElementById("engBroadcastImageUrl").value = d.image_url || "";
    window.toggleEngImgInput();
  });
}

// 🚀 核心新增：保存公告資料並覆寫發布時間戳記，使住戶端不再顯示標籤就地刷新
window.saveSystemEngineerBroadcast = async () => {
  const isEnabled = document.getElementById("engBroadcastEnabled").value === "true";
  const contentText = document.getElementById("engBroadcastContent").value.trim();
  const isImgEnabled = document.getElementById("engBroadcastImgEnabled").value === "true";
  const imgUrl = document.getElementById("engBroadcastImageUrl").value.trim();

  if(isEnabled && !contentText) {
    alert("開啟公告時，內容不能為空！");
    return;
  }

  await setDoc(doc(db, "settings", "engineer_broadcast"), {
    enabled: isEnabled,
    content: contentText,
    image_enabled: isImgEnabled,
    image_url: imgUrl,
    updated_at: new Date().toISOString() // 自動刷新時間戳，迫使點擊過不再顯示的住戶重新喚醒彈窗
  }, { merge: true });

  alert("系統公告已成功同步保存並發布！");
};

document.getElementById("logoutBtn").addEventListener("click",async()=>{
  await signOut(auth);
  localStorage.removeItem("zh_user");
  location.href="index.html";
});
</script>
</body>
</html>
