<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工程師介面｜昭揚縱橫</title>

  <style>
    *{
      box-sizing:border-box;
      font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    }

    body{
      margin:0;
      background:#f4f1ea;
      color:#4f463d;
    }

    .topbar{
      height:72px;
      background:linear-gradient(90deg,#5c4033,#8b6a55);
      color:white;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 28px;
      box-shadow:0 2px 10px rgba(0,0,0,.12);
    }

    .title{
      font-size:28px;
      letter-spacing:4px;
      font-weight:500;
    }

    .user-info{
      display:flex;
      align-items:center;
      gap:16px;
      font-size:16px;
    }

    .logout-btn{
      border:none;
      background:white;
      color:#6f5646;
      padding:10px 18px;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      font-weight:600;
    }

    .container{
      padding:28px;
    }

    .welcome-card{
      background:white;
      border-radius:16px;
      padding:28px;
      box-shadow:0 4px 16px rgba(0,0,0,.08);
      margin-bottom:24px;
    }

    .welcome-title{
      font-size:28px;
      margin-bottom:12px;
      color:#6f5646;
    }

    .welcome-text{
      color:#7a7066;
      line-height:1.8;
      font-size:17px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:22px;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:26px;
      box-shadow:0 4px 16px rgba(0,0,0,.08);
      transition:.25s;
      cursor:pointer;
    }

    .card:hover{
      transform:translateY(-4px);
    }

    .card-title{
      font-size:22px;
      margin-bottom:12px;
      color:#6f5646;
    }

    .card-text{
      color:#80776e;
      line-height:1.7;
    }

    .loading{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      color:#6f5646;
    }
  </style>
</head>

<body>

<div id="loading" class="loading">
  驗證登入狀態中...
</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <div class="title">
      工程師管理系統
    </div>

    <div class="user-info">
      <span id="welcomeUser"></span>
      <button class="logout-btn" id="logoutBtn">
        登出
      </button>
    </div>
  </div>

  <div class="container">

    <div class="welcome-card">
      <div class="welcome-title">
        昭揚縱橫 咖啡廳點餐系統
      </div>

      <div class="welcome-text">
        歡迎進入工程師管理後台。<br><br>

        此介面可管理：
        <br>
        ・住戶帳號
        <br>
        ・物業櫃檯帳號
        <br>
        ・咖啡廳櫃檯帳號
        <br>
        ・系統公告
        <br>
        ・Firebase 系統設定
      </div>
    </div>

    <div class="grid">

      <div class="card">
        <div class="card-title">
          帳號管理
        </div>

        <div class="card-text">
          新增、修改、刪除住戶與櫃檯帳號。
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          系統檢查
        </div>

        <div class="card-text">
          查看 Firebase 與點餐系統運作狀態。
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          公告管理
        </div>

        <div class="card-text">
          發送全社區公告與重要通知。
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          系統設定
        </div>

        <div class="card-text">
          管理點餐系統全域設定與安全控制。
        </div>
      </div>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain: "zonghengcafe.firebaseapp.com",
  projectId: "zonghengcafe",
  storageBucket: "zonghengcafe.firebasestorage.app",
  messagingSenderId: "207027108121",
  appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId: "G-8ZE4SE2T7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loading = document.getElementById("loading");
const appDiv = document.getElementById("app");
const welcomeUser = document.getElementById("welcomeUser");

onAuthStateChanged(auth, (user) => {

  if(!user){
    alert("請先登入");
    window.location.href = "index.html";
    return;
  }

  const profileRaw = localStorage.getItem("zh_user");

  if(!profileRaw){
    alert("登入資訊遺失");
    window.location.href = "index.html";
    return;
  }

  try{

    const profile = JSON.parse(profileRaw);

    if(profile.role !== "engineer"){
      alert("您沒有權限進入此頁面");
      window.location.href = "index.html";
      return;
    }

    welcomeUser.textContent = `您好，${profile.username}`;

    loading.style.display = "none";
    appDiv.style.display = "block";

  }catch(e){

    localStorage.removeItem("zh_user");

    window.location.href = "index.html";
  }

});

document.getElementById("logoutBtn").addEventListener("click", async () => {

  if(!confirm("確定要登出嗎？")){
    return;
  }

  try{

    await signOut(auth);

    localStorage.removeItem("zh_user");

    window.location.href = "index.html";

  }catch(e){

    alert("登出失敗");

  }

});

</script>

</body>
</html>
