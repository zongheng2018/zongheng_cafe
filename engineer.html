<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>工程師後台</title>
  <style>
    body {font-family:"Microsoft JhengHei"; background:#fdf6e3; display:flex; justify-content:center; align-items:center; height:100vh;}
    .box {background:white; padding:30px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.2); width:500px;}
    h1 {text-align:center; margin-bottom:20px; color:#5c4033;}
    h2 {color:#5c4033;}
    input, select, button {width:90%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc;}
    button {background:#5c4033; color:white; border:none; cursor:pointer;}
    button:hover {background:#3e2a20;}
  </style>
</head>
<body>
  <div class="box">
    <img src="logo.png" class="logo" alt="系統Logo" style="width:80px;">
    <h1>工程師後台</h1>
    <input id="newUser" placeholder="帳號">
    <input id="newPass" type="password" placeholder="密碼">
    <select id="newRole">
      <option value="resident">住戶</option>
      <option value="property">物業</option>
      <option value="cafe">咖啡廳</option>
      <option value="engineer">工程師</option>
    </select>
    <button onclick="addAccount()">新增帳號</button>
    <h2>帳號列表</h2>
    <ul id="accounts"></ul>
  </div>
</body>
</html>
