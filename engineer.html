<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工程師介面｜昭揚縱橫 咖啡廳點餐系統</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft JhengHei", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4efe5;
      color: #5a5148;
    }

    .loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a7067;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .topbar {
      background: #6b4938;
      color: #fff;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      box-shadow: 0 3px 10px rgba(0,0,0,.16);
    }

    .topbar-title {
      font-size: 20px;
      letter-spacing: 4px;
      font-weight: 500;
    }

    .logout-btn {
      border: none;
      border-radius: 5px;
      padding: 8px 14px;
      background: rgba(255,255,255,.92);
      color: #6b4938;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      padding: 18px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .tab-btn {
      border: none;
      border-radius: 5px;
      background: linear-gradient(to bottom, #bcaea1, #9c8e81);
      color: white;
      padding: 13px 8px;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,.13);
    }

    .panel {
      background: rgba(255,255,255,.78);
      border-radius: 8px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.10);
      min-height: 420px;
    }

    .panel-title {
      font-size: 24px;
      color: #6b4938;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .hint {
      color: #7b7269;
      line-height: 1.8;
      font-size: 15px;
    }

    @media (max-width: 700px) {
      .tabs {
        grid-template-columns: repeat(2, 1fr);
      }

      .topbar-title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading">驗證登入狀態中...</div>

  <div id="app" style="display:none;">
    <div class="topbar">
      <div class="topbar-title">工程師介面</div>
      <button id="logoutBtn" class="logout-btn">登出</button>
    </div>

    <div class="container">
      <div class="tabs">
        <button class="tab-btn">帳號管理</button>
        <button class="tab-btn">系統檢查</button>
        <button class="tab-btn">重置系統</button>
        <button class="tab-btn">公告管理</button>
      </div>

      <div class="panel">
        <div class="panel-title">帳號管理</div>
        <div class="hint">
          這一頁已經加入工程師權限保護。<br>
          下一步我們會在這裡加入真正的帳號管理功能：新增住戶、修改住戶密碼、管理咖啡廳櫃台與物業櫃台帳號。
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
      authDomain: "zonghengcafe.firebaseapp.com",
      projectId: "zonghengcafe",
      storageBucket: "zonghengcafe.firebasestorage.app",
      messagingSenderId: "207027108121",
      appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
      measurementId: "G-8ZE4SE2T7T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loading = document.getElementById("loading");
    const appDiv = document.getElementById("app");

    onAuthStateChanged(auth, function(user) {
      if (!user) {
        alert("請先登入");
        window.location.href = "index.html";
        return;
      }

      const raw = localStorage.getItem("zh_user");

      if (!raw) {
        alert("登入資訊遺失，請重新登入");
        window.location.href = "index.html";
        return;
      }

      try {
        const profile = JSON.parse(raw);

        if (!profile || profile.role !== "engineer") {
          alert("您沒有權限進入工程師介面");
          window.location.href = "index.html";
          return;
        }

        loading.style.display = "none";
        appDiv.style.display = "block";

      } catch (e) {
        localStorage.removeItem("zh_user");
        window.location.href = "index.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async function() {
      const ok = confirm("確定要登出嗎？");

      if (!ok) return;

      await signOut(auth);
      localStorage.removeItem("zh_user");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
