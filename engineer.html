<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>工程師介面｜昭揚縱橫 咖啡廳點餐系統</title>

  <style>

    *{
      box-sizing:border-box;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
    }

    body{
      margin:0;
      background:#f5f1eb;
      color:#5d534a;
    }

    .loading{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      color:#7b7268;
    }

    .topbar{
      height:60px;
      background:linear-gradient(to right,#9f8f80,#7e6e61);
      color:white;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      box-shadow:0 3px 10px rgba(0,0,0,.12);
    }

    .title{
      font-size:22px;
      letter-spacing:3px;
    }

    .logout-btn{
      border:none;
      background:white;
      color:#7d6e60;
      padding:8px 14px;
      border-radius:5px;
      cursor:pointer;
    }

    .container{
      padding:20px;
    }

    .card{
      background:white;
      border-radius:10px;
      padding:24px;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
    }

    .card-title{
      font-size:28px;
      color:#746659;
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th{
      background:#f0ebe4;
      color:#6d6156;
      padding:14px;
      text-align:left;
      border-bottom:1px solid #ddd;
    }

    td{
      padding:14px;
      border-bottom:1px solid #eee;
    }

    input{
      width:100%;
      padding:8px 10px;
      border:1px solid #d7d0c9;
      border-radius:5px;
    }

    .save-btn{
      border:none;
      background:#9c8e81;
      color:white;
      padding:8px 14px;
      border-radius:5px;
      cursor:pointer;
    }

    .save-btn:hover{
      opacity:.92;
    }

    .role-badge{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      background:#eee7df;
      color:#6d6156;
      font-size:13px;
    }

    @media(max-width:900px){

      table{
        font-size:14px;
      }

    }

  </style>
</head>

<body>

<div id="loading" class="loading">
驗證登入狀態中...
</div>

<div id="app" style="display:none;">

  <div class="topbar">

    <div class="title">
      工程師介面
    </div>

    <button id="logoutBtn" class="logout-btn">
      登出
    </button>

  </div>

  <div class="container">

    <div class="card">

      <div class="card-title">
        帳號管理系統
      </div>

      <table>

        <thead>
          <tr>
            <th>帳號</th>
            <th>角色</th>
            <th>密碼</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody id="accountTable">
        </tbody>

      </table>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
authDomain: "zonghengcafe.firebaseapp.com",
projectId: "zonghengcafe",
storageBucket: "zonghengcafe.firebasestorage.app",
messagingSenderId: "207027108121",
appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
measurementId: "G-8ZE4SE2T7T"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){

alert("請先登入");
window.location.href="index.html";
return;

}

const raw =
localStorage.getItem("zh_user");

if(!raw){

window.location.href="index.html";
return;

}

const profile =
JSON.parse(raw);

if(profile.role !== "engineer"){

alert("您沒有權限進入此頁面");
window.location.href="index.html";
return;

}

document.getElementById("loading").style.display="none";
document.getElementById("app").style.display="block";

loadAccounts();

});

async function loadAccounts(){

const table =
document.getElementById("accountTable");

table.innerHTML = "";

const snapshot =
await getDocs(collection(db,"accounts"));

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

const tr =
document.createElement("tr");

tr.innerHTML = `

<td>
${data.username || ""}
</td>

<td>
<span class="role-badge">
${data.role || ""}
</span>
</td>

<td style="width:240px;">
<input
type="text"
id="pw-${docSnap.id}"
value="${data.password || ""}">
</td>

<td>
<button
class="save-btn"
onclick="savePassword('${docSnap.id}')">
儲存
</button>
</td>

`;

table.appendChild(tr);

});

}

window.savePassword = async function(docId){

const value =
document.getElementById(`pw-${docId}`).value;

try{

await updateDoc(
doc(db,"accounts",docId),
{
password:value
}
);

alert("已更新");

}catch(error){

console.error(error);

alert("更新失敗");

}

}

document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await signOut(auth);

localStorage.removeItem("zh_user");

window.location.href="index.html";

});

</script>

</body>
</html>
