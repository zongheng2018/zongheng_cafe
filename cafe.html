<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡廳櫃台｜昭揚縱橫 咖啡廳點餐系統</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.76);backdrop-filter:blur(5px);z-index:-1}
.header{height:72px;background:rgba(255,255,255,.88);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:72px;opacity:.82}
.title{font-size:22px;letter-spacing:2px;font-weight:700;color:#6d6258}
.header-actions{display:flex;gap:10px;align-items:center}
.logout,.sound-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:10px;padding:9px 14px;font-weight:800}
.sound-btn.on{background:#6b8b61;color:white;border-color:#6b8b61}
.container{max-width:1180px;margin:22px auto;padding:0 16px 40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tab{border:none;background:white;color:#7a6b60;border-radius:16px;padding:14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.tab.active{background:linear-gradient(to bottom,#bcaea1,#9c8e81);color:white}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(230,224,218,.8);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.section-title{font-size:26px;color:#6d6258;font-weight:800;margin-bottom:16px;letter-spacing:2px}
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.order-card{background:white;border-radius:18px;padding:18px;border:1px solid #eee5dd;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.order-card.new{animation:pulse 1.2s ease-in-out 4;border:2px solid #d8b56d}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.order-id{font-size:20px;font-weight:900}
.meta{font-size:14px;color:#777;line-height:1.7}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;min-width:82px;height:38px;flex-shrink:0}
.wait{background:#fff1d9;color:#9b681f}
.making{background:#e6f0ff;color:#426f9c}
.done{background:#e8f5e9;color:#3f7f47}
.cancel{background:#fde8e6;color:#b3514a}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.order-item{padding:10px 0;border-bottom:1px solid #eee}
.item-name{font-weight:900}
.item-detail{font-size:14px;color:#777;line-height:1.6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:none;border-radius:13px;padding:10px 14px;font-weight:800;color:white;background:#9c8e81;cursor:pointer}
.order-card .btn{min-width:64px}
.btn.primary{background:#6d6258}
.btn.done{background:#6b8b61}
.btn.danger{background:#c86b62}
.btn.light{background:#f0e8df;color:#7a6b60}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea,select{width:100%;border:none;background:#f5f1eb;border-radius:14px;padding:13px;font-size:15px;outline:none;color:#5f574f}
textarea{height:86px;resize:none;grid-column:1/-1}
.menu-row{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee5dd}
.menu-img{width:80px;height:80px;object-fit:cover;border-radius:16px;background:#eee}
.menu-name{font-size:18px;font-weight:900}
.menu-meta{font-size:14px;color:#777;margin-top:4px}
.hidden{display:none}
.empty{text-align:center;color:#999;padding:40px}
.setting-status{background:#f8f5f1;border-radius:16px;padding:16px;line-height:1.8}
.option-editor{margin-top:14px;background:#f8f5f1;border-radius:16px;padding:16px}
.option-title{font-size:18px;font-weight:900;color:#6d6258;margin-bottom:12px}
.option-group-box{background:white;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #eee5dd}
.option-choice-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.small-btn{border:none;border-radius:10px;padding:8px 12px;background:#9c8e81;color:white;font-weight:800}
.small-btn.danger{background:#c86b62}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal{background:white;width:100%;max-width:680px;border-radius:24px;padding:22px;max-height:90vh;overflow:auto}
.counter-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.counter-menu-list{max-height:560px;overflow:auto}
.counter-cart-item{background:#f8f5f1;border-radius:16px;padding:14px;margin-bottom:12px}
.counter-total{font-size:24px;font-weight:900;color:#6d6258;margin-top:14px}
.counter-mini-img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#eee}
.counter-menu-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee5dd}

/* 電子簽名畫布增設樣式 */
.sig-canvas{border:2px dashed #c9c0b7;background:#fdfcfb;border-radius:14px;cursor:crosshair;display:block;margin:14px 0}
@media(max-width:900px){.counter-grid{grid-template-columns:1fr}}
@media(max-width:760px){.tabs{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.menu-row{grid-template-columns:1fr}.counter-menu-row{grid-template-columns:64px 1fr}.counter-menu-row .btn{grid-column:1/-1}.brand img{width:60px}.title{font-size:18px}.header{padding:0 12px}.sound-btn{font-size:13px;padding:8px}}
</style>
</head>

<body>

<audio id="newOrderAudio" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<div class="header">
  <div class="brand">
    <img src="logo.png">
    <div class="title">咖啡廳櫃台</div>
  </div>
  <div class="header-actions">
    <button class="sound-btn on" id="soundBtn" onclick="enableSound()">音效已啟用</button>
    <button class="logout" id="logoutBtn">登出</button>
  </div>
</div>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="showTab('orders',this)">訂單管理</button>
    <button class="tab" onclick="showTab('menu',this)">菜單管理</button>
    <button class="tab" onclick="showTab('counter',this)">代客點餐</button>
    <button class="tab" onclick="showTab('settings',this)">系統設定</button>
  </div>

  <section id="ordersTab">
    <div class="card"><div class="section-title">等待接單</div><div id="waitingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">製作中</div><div id="makingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">已完成 / 已取消</div><div id="doneOrders" class="order-grid"></div></div>
  </section>

  <section id="menuTab" class="hidden">
    <div class="card">
      <div class="section-title">新增菜單</div>
      <div class="form-grid">
        <input id="mName" placeholder="品項名稱">
        <input id="mPrice" type="number" placeholder="價格（點）">
        <select id="mCategorySelect" onchange="syncCategoryInput()">
          <option value="">選擇既有分類</option>
        </select>
        <input id="mCategory" placeholder="分類，例如 咖啡">
        <input id="mImage" placeholder="圖片網址">
        <input id="mSortOrder" type="number" placeholder="品項排序，數字越小越前面">
        <select id="mAfterMeal">
          <option value="false">不顯示餐後上</option>
          <option value="true">顯示餐後上</option>
        </select>
        <textarea id="mNote" placeholder="品項備註，可空白"></textarea>
      </div>

      <div class="option-editor">
        <div class="option-title">自訂選項</div>
        <div id="newOptionList"></div>
        <button class="btn light" type="button" onclick="addNewOptionGroup()">＋新增選項群組</button>
        <div class="meta" style="margin-top:10px;">例如：群組名稱填「冰度」，選項填「去冰、正常冰、微冰」。</div>
      </div>

      <div class="btn-row"><button class="btn primary" onclick="addMenu()">新增品項</button></div>
    </div>

    <div class="card">
      <div class="section-title">菜單列表</div>
      <div id="menuList"></div>
    </div>
  </section>

  <section id="counterTab" class="hidden">
    <div class="card">
      <div class="section-title">代客點餐</div>
      <div class="form-grid">
        <input id="counterResidentInput" placeholder="輸入住戶帳號，例如 A001">
        <button class="btn primary" onclick="loadCounterResident()">載入住戶</button>
      </div>
      <div class="setting-status" id="counterResidentInfo" style="margin-top:16px;">
        尚未選擇住戶
      </div>
    </div>

    <div class="counter-grid">
      <div class="card">
        <div class="section-title">菜單</div>
        <select id="counterCategoryFilter" onchange="changeCounterCategory(this.value)" style="margin-bottom:14px;">
          <option value="全部">全部分類</option>
        </select>
        <div id="counterMenuList" class="counter-menu-list"></div>
      </div>

      <div class="card">
        <div class="section-title">櫃台購物車</div>
        <div id="counterCartList"></div>

        <div class="form-grid" style="margin-top:14px;">
          <select id="counterDining" onchange="toggleCounterSeat()">
            <option value="內用">內用</option>
            <option value="外帶">外帶</option>
          </select>

          <select id="counterSeat">
            <option value="">請選擇座位</option>
          </select>
        </div>

        <div class="counter-total" id="counterTotal">0 點</div>

        <div class="btn-row">
          <button class="btn danger" onclick="clearCounterCart()">清空購物車</button>
          <button class="btn primary" onclick="prepareCounterSign()">送出訂單</button>
        </div>
      </div>
    </div>
  </section>

  <section id="settingsTab" class="hidden">
    <div class="card">
      <div class="section-title">點餐系統設定</div>
      <div class="setting-status" id="systemStatus">讀取中...</div>

      <div class="setting-status" style="margin-top:14px;">
        <div style="font-weight:900;margin-bottom:8px;">每日營業時間</div>
        <div class="form-grid">
          <input id="openTime" type="time" value="08:30">
          <input id="closeTime" type="time" value="19:00">
        </div>

        <div style="font-weight:900;margin-top:14px;margin-bottom:8px;">每月固定公休日</div>
        <input id="closedDays" placeholder="例如：1,8,15,22">

        <div style="font-weight:900;margin-top:14px;margin-bottom:8px;">分類顯示順序</div>
        <input id="categoryOrderInput" placeholder="例如：咖啡,茶類,氣泡飲,甜點,輕食,其他">

        <div class="btn-row">
          <button class="btn done" onclick="saveCafeSchedule()">儲存營業設定</button>
          <button class="btn danger" onclick="clearWaitingOrders()">清除等待接單</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn done" onclick="setCafeOpen(true)">開放點餐</button>
        <button class="btn danger" onclick="setCafeOpen(false)">關閉點餐</button>
      </div>
    </div>
  </section>
</div>

<div class="modal-bg" id="editModalBg">
  <div class="modal">
    <div class="section-title">編輯品項</div>
    <input type="hidden" id="editId">

    <div class="form-grid">
      <input id="editName" placeholder="品項名稱">
      <input id="editPrice" type="number" placeholder="價格（點）">
      <input id="editCategory" placeholder="分類">
      <input id="editImage" placeholder="圖片網址">
      <input id="editSortOrder" type="number" placeholder="品項排序，數字越小越前面">
      <select id="editAfterMeal">
        <option value="false">不顯示餐後上</option>
        <option value="true">顯示餐後上</option>
      </select>
      <textarea id="editNote" placeholder="品項備註"></textarea>
    </div>

    <div class="option-editor">
      <div class="option-title">自訂選項</div>
      <div id="editOptionList"></div>
      <button class="btn light" type="button" onclick="addEditOptionGroup()">＋新增選項群組</button>
    </div>

    <div class="btn-row">
      <button class="btn primary" onclick="saveEditMenu()">儲存修改</button>
      <button class="btn light" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="counterItemModalBg">
  <div class="modal">
    <div class="section-title" id="counterItemTitle">選擇品項</div>
    <div id="counterOptionArea"></div>

    <div style="margin-top:12px;">
      <textarea id="counterItemNote" placeholder="備註，可空白"></textarea>
    </div>

    <div class="form-grid" style="margin-top:12px;">
      <button class="btn light" onclick="counterChangeQty(-1)">−</button>
      <input id="counterItemQty" type="number" value="1" min="1">
      <button class="btn light" onclick="counterChangeQty(1)">＋</button>
      <button class="btn primary" onclick="addCounterItemToCart()">加入購物車</button>
    </div>

    <div class="btn-row">
      <button class="btn light" onclick="closeCounterItemModal()">取消</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="cafeSignModalBg">
  <div class="modal" style="max-width: 500px;">
    <div class="section-title">住戶點餐明細確認</div>
    <div id="cafeSignSummary" class="setting-status" style="margin-bottom: 12px; max-height: 180px; overflow: auto; line-height: 1.6;"></div>
    
    <label style="font-weight:900;color:#6d6258;">請住戶在下方框格內簽名確認：</label>
    <canvas id="cafeSigCanvas" class="sig-canvas" width="450" height="180"></canvas>
    
    <div class="btn-row">
      <button class="btn primary done" onclick="confirmCounterOrderWithSignature()">確認送出訂單</button>
      <button class="btn light" onclick="clearCafeSignature()">清除重簽</button>
      <button class="btn danger" onclick="closeCafeSignModal()">返回修改</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  query,
  orderBy,
  setDoc,
  getDoc,
  where,
  writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain:"zonghengcafe.firebaseapp.com",
  projectId:"zonghengcafe",
  storageBucket:"zonghengcafe.firebasestorage.app",
  messagingSenderId:"207027108121",
  appId:"1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId:"G-8ZE4SE2T7T"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let menuCache=[];
let categoryCache=[];
let categoryOrder=[];
let newOptionGroups=[];
let editOptionGroups=[];
let knownOrderIds=new Set();
let firstSnapshot=true;
let soundEnabled=true;
let cafeProfile=null;

let counterResident=null;
let counterBalanceDocId=null;
let counterGranted=0;
let counterStored=0;
let counterCart=[];
let counterCurrentItem=null;
let currentCounterCategory="全部";
let ordersUnsubscribe=null;

// 簽名專用畫布變數
let cafeCanvas, cafeCtx, cafeIsDrawing = false;

function getTaipeiNow(){
  return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
}

function timeToMinutes(t){
  const p=String(t||"").split(":");
  return Number(p[0]||0)*60+Number(p[1]||0);
}

function isCafeOpenBySetting(setting){
  const manualMode=setting.manual_mode||"auto";

  if(manualMode==="force_open"){
    return true;
  }

  if(manualMode==="force_closed"){
    return false;
  }

  const now=getTaipeiNow();
  const day=now.getDate();
  const minutes=now.getHours()*60+now.getMinutes();
  const openTime=setting.open_time||"08:30";
  const closeTime=setting.close_time||"19:00";
  const closedDays=Array.isArray(setting.closed_days)?setting.closed_days:[];

  if(setting.open===false)return false;
  if(closedDays.includes(day))return false;

  return minutes>=timeToMinutes(openTime)&&minutes<timeToMinutes(closeTime);
}

function formatOrderTime(value){
  if(!value)return "-";
  const d=new Date(value);
  if(isNaN(d.getTime()))return value;

  return d.toLocaleString("zh-TW",{
    timeZone:"Asia/Taipei",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function getCategoryRank(category){
  const idx=categoryOrder.indexOf(category);
  if(idx>=0)return idx+1;

  const fallback={
    "咖啡":1,
    "茶類":2,
    "氣泡飲":3,
    "甜點":4,
    "輕食":5,
    "其他":99
  };

  return fallback[category]||999;
}

function sortMenuAndCategories(){
  categoryCache.sort((a,b)=>{
    const ra=getCategoryRank(a);
    const rb=getCategoryRank(b);
    if(ra!==rb)return ra-rb;
    return String(a).localeCompare(String(b),"zh-Hant");
  });

  menuCache.sort((a,b)=>{
    const ca=getCategoryRank(a.category||"未分類");
    const cb=getCategoryRank(b.category||"未分類");
    if(ca!==cb)return ca-cb;

    const sa=Number(a.sort_order||999);
    const sb=Number(b.sort_order||999);
    if(sa!==sb)return sa-sb;

    return String(a.name||"").localeCompare(String(b.name||""),"zh-Hant");
  });
}

window.enableSound=async()=>{
  const audio=document.getElementById("newOrderAudio");

  try{
    audio.volume=1;
    await audio.play();
    audio.pause();
    audio.currentTime=0;
    soundEnabled=true;
    localStorage.setItem("cafe_sound","on");
    soundBtn.classList.add("on");
    soundBtn.innerText="音效已啟用";
  }catch(e){
    soundEnabled=true;
    localStorage.setItem("cafe_sound","on");
    soundBtn.classList.add("on");
    soundBtn.innerText="音效已啟用";
  }
};

function playNewOrderSound(){
  if(!soundEnabled)return;
  const audio=document.getElementById("newOrderAudio");
  try{
    audio.currentTime=0;
    audio.play().catch(()=>{});
  }catch(e){}
}

onAuthStateChanged(auth,async user=>{
  if(!user){location.href="index.html";return}

  const raw=localStorage.getItem("zh_user");
  if(!raw){location.href="index.html";return}

  cafeProfile=JSON.parse(raw);

  if(cafeProfile.role!=="cafe" && cafeProfile.role!=="engineer"){
    alert("沒有權限");
    location.href="index.html";
    return;
  }

  const savedSound=localStorage.getItem("cafe_sound");

  if(savedSound==="off"){
    soundEnabled=false;
    soundBtn.classList.remove("on");
    soundBtn.innerText="啟用音效";
  }else{
    soundEnabled=true;
    soundBtn.classList.add("on");
    soundBtn.innerText="音效已啟用";
  }

  await loadSettings();
  listenOrders();
  await loadMenu();
  await loadSeatsForCounter();
  initCafeSignatureCanvas(); // 初始化代客點餐畫布
});

window.showTab=(tab,btn)=>{
  ordersTab.classList.add("hidden");
  menuTab.classList.add("hidden");
  counterTab.classList.add("hidden");
  settingsTab.classList.add("hidden");

  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(tab+"Tab").classList.remove("hidden");

  if(tab==="counter"){
    renderCounterMenu();
    renderCounterCart();
  }
};

function statusClass(status){
  if(status==="等待接單")return"wait";
  if(status==="製作中")return"making";
  if(status==="已完成")return"done";
  if(status==="已取消")return"cancel";
  return"";
}

function formatItems(items){
  if(!items.length)return`<div class="meta">無品項</div>`;

  return items.map(x=>{
    const optionHtml=x.options
      ? Object.entries(x.options).map(([k,v])=>`<div class="item-detail">${k}：${v}</div>`).join("")
      : `<div class="item-detail">冰度：${x.ice||"無"}｜糖度：${x.sugar||"無"}</div>`;

    return `
      <div class="order-item">
        <div class="item-name">${x.name} × ${x.qty}</div>
        ${optionHtml}
        <div class="item-detail">備註：${x.note||"無"}</div>
      </div>
    `;
  }).join("");
}

function listenOrders(){
  if(ordersUnsubscribe){
    ordersUnsubscribe();
  }

  const q=query(collection(db,"orders"),orderBy("created_at","desc"));

  ordersUnsubscribe=onSnapshot(q,snap=>{
    waitingOrders.innerHTML="";
    makingOrders.innerHTML="";
    doneOrders.innerHTML="";

    if(snap.empty){
      waitingOrders.innerHTML=`<div class="empty">目前沒有訂單</div>`;
      firstSnapshot=false;
      return;
    }

    let waitingCount=0;
    let makingCount=0;
    let doneCount=0;

    snap.forEach(d=>{
      const o=d.data();
      const status=o.status||"等待接單";
      const isNew=!knownOrderIds.has(d.id);
      knownOrderIds.add(d.id);

      if(!firstSnapshot && isNew && status==="等待接單"){
        playNewOrderSound();
      }

      // 優化呈現：如果是櫃檯代客點餐，管理員點開卡片能直接看到當時住戶的簽名圖檔存證
      const sigHtml = o.counter_signature 
        ? `<div class="meta" style="margin-top:6px;">住戶簽名：<br><img src="${o.counter_signature}" style="width:120px; background:white; border:1px solid #eee; border-radius:6px; margin-top:2px;"></div>`
        : "";

      const div=document.createElement("div");
      div.className="order-card "+(!firstSnapshot && isNew ? "new" : "");
      div.innerHTML=`
        <div class="order-head">
          <div>
            <div class="order-id">${o.order_id||d.id}</div>
            <div class="meta">住戶：${o.uid||""}</div>
            <div class="meta">${o.dining_type||""}${o.seat?`｜座位：${o.seat}`:""}</div>
            <div class="meta">金額：${o.total||0} 點</div>
            <div class="meta">下單時間：${formatOrderTime(o.created_at)}</div>
            ${o.created_by?`<div class="meta">建立來源：${o.created_by}</div>`:""}
            ${sigHtml}
          </div>
          <div class="badge ${statusClass(status)}">${status}</div>
        </div>
        ${formatItems(o.items||[])}
        <div class="btn-row">
          <button class="btn primary" onclick="updateOrder('${d.id}','製作中')">接單</button>
          <button class="btn done" onclick="updateOrder('${d.id}','已完成')">完成</button>
          <button class="btn danger" onclick="updateOrder('${d.id}','已取消')">取消</button>
        </div>
      `;

      if(status==="等待接單"){
        waitingCount++;
        waitingOrders.appendChild(div);
      }else if(status==="製作中"){
        makingCount++;
        makingOrders.appendChild(div);
      }else{
        doneCount++;
        doneOrders.appendChild(div);
      }
    });

    if(waitingCount===0)waitingOrders.innerHTML=`<div class="empty">目前沒有等待接單</div>`;
    if(makingCount===0)makingOrders.innerHTML=`<div class="empty">目前沒有製作中訂單</div>`;
    if(doneCount===0)doneOrders.innerHTML=`<div class="empty">目前沒有已完成 / 已取消訂單</div>`;

    firstSnapshot=false;
  },error=>{
    console.error(error);
    alert("訂單讀取失敗："+error.message);
  });
}

async function loadMenu(){

  if(snap.empty){
    menuList.innerHTML=`<div class="empty">目前沒有菜單</div>`;

    return;
  }

  snap.forEach(d=>{
    const m={id:d.id,...d.data()};
    menuCache.push(m);

    if(m.category&&!categoryCache.includes(m.category)){
      categoryCache.push(m.category);
    }
  });

  sortMenuAndCategories();

  menuCache.forEach(m=>{
    const optionsText=(m.custom_options||[])
      .map(o=>`${o.title}：${(o.choices||[]).join("、")}`)
      .join("<br>");

    const row=document.createElement("div");

      <div>
        <div class="menu-name">${m.name||""}</div>
        <div class="menu-meta">

        <button class="btn ${m.enabled===false?"done":"danger"}" onclick="toggleMenu('${m.id}',${m.enabled!==false})">${m.enabled===false?"恢復":"暫停"}</button>

async function loadSettings(){
  const ref=doc(db,"settings","cafe");
  const s=await getDoc(ref);

  if(!s.exists()){
    await setDoc(ref,{
      open:true,
      manual_mode:"auto",
      open_time:"08:30",
      close_time:"19:00",
      closed_days:[],
      category_order:["咖啡","茶類","氣泡飲","甜點","輕食","其他"]
    },{merge:true});

    categoryOrder=["咖啡","茶類","氣泡飲","甜點","輕食","其他"];
    systemStatus.innerText="目前狀態：自動模式｜開放點餐｜自動營業 08:30–19:00";
    openTime.value="08:30";
    closeTime.value="19:00";
    closedDays.value="";
    categoryOrderInput.value=categoryOrder.join(",");
    return;
  }

  const data=s.data();
  const effectiveOpen=isCafeOpenBySetting(data);

  categoryOrder=Array.isArray(data.category_order)&&data.category_order.length
    ? data.category_order
    : ["咖啡","茶類","氣泡飲","甜點","輕食","其他"];

  const modeText=
    data.manual_mode==="force_open"
    ? "手動開放"
    : data.manual_mode==="force_closed"
    ? "手動關閉"
    : "自動模式";

  systemStatus.innerText=
    "目前狀態："+modeText+"｜"+(effectiveOpen?"開放點餐":"關閉點餐")+
    "｜自動營業 "+(data.open_time||"08:30")+"–"+(data.close_time||"19:00")+
    "｜公休日："+((data.closed_days||[]).join(",")||"無")+
    "｜分類順序："+categoryOrder.join("、");

  openTime.value=data.open_time||"08:30";
  closeTime.value=data.close_time||"19:00";
  closedDays.value=Array.isArray(data.closed_days)?data.closed_days.join(","):"";
  categoryOrderInput.value=categoryOrder.join(",");
}

    div.innerHTML=`
      <div class="item-name">${item.name} × ${item.qty}</div>
      <div class="item-detail">
        ${optionsText||"無自訂選項"}<br>
        備註：${item.note||"無"}<br>
        小計：${item.price*item.qty} 點
      </div>
      <button class="small-btn danger" onclick="removeCounterCartItem(${index})">刪除</button>
    `;
    box.appendChild(div);
  });

  counterTotal.innerText=`${total} 點`;
}

window.removeCounterCartItem=(index)=>{
  counterCart.splice(index,1);
  renderCounterCart();
};

window.clearCounterCart=()=>{
  if(!confirm("確定清空代客點餐購物車？"))return;
  counterCart=[];
  renderCounterCart();
};

// ==========================================
//      新增：咖啡廳代客點餐電子簽名核心邏輯
// ==========================================

function initCafeSignatureCanvas() {
  cafeCanvas = document.getElementById("cafeSigCanvas");
  if (!cafeCanvas) return;
  cafeCtx = cafeCanvas.getContext("2d");
  
  cafeCtx.strokeStyle = "#5f574f";
  cafeCtx.lineWidth = 3;
  cafeCtx.lineCap = "round";

  // 繪圖板與滑鼠事件
  cafeCanvas.addEventListener("mousedown", (e) => {
    cafeIsDrawing = true;
    cafeCtx.beginPath();
    const rect = cafeCanvas.getBoundingClientRect();
    cafeCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  });
  
  cafeCanvas.addEventListener("mousemove", (e) => {
    if (!cafeIsDrawing) return;
    const rect = cafeCanvas.getBoundingClientRect();
    cafeCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    cafeCtx.stroke();
  });
  
  cafeCanvas.addEventListener("mouseup", () => cafeIsDrawing = false);
  cafeCanvas.addEventListener("mouseout", () => cafeIsDrawing = false);

  // 觸控事件相容
  cafeCanvas.addEventListener("touchstart", (e) => {
    const touch = e.touches[0];
    const mouseEvent = new MouseEvent("mousedown", { clientX: touch.clientX, clientY: touch.clientY });
    cafeCanvas.dispatchEvent(mouseEvent);
  }, { passive: true });

  cafeCanvas.addEventListener("touchmove", (e) => {
    const touch = e.touches[0];
    const mouseEvent = new MouseEvent("mousemove", { clientX: touch.clientX, clientY: touch.clientY });
    cafeCanvas.dispatchEvent(mouseEvent);
  }, { passive: true });
}

window.clearCafeSignature = () => {
  cafeCtx.clearRect(0, 0, cafeCanvas.width, cafeCanvas.height);
};

window.closeCafeSignModal = () => {
  document.getElementById("cafeSignModalBg").style.display = "none";
};

// 按下送出訂單按鈕，先攔截並跳出電子簽名核對框
window.prepareCounterSign = () => {
  if(!counterResident){ alert("請先載入住戶"); return; }
  if(!counterBalanceDocId){ alert("找不到住戶點資料"); return; }
  if(!counterCart.length){ alert("購物車是空的"); return; }

  const dining = counterDining.value;
  const seat = counterSeat.value;
  if(dining === "內用" && !seat){ alert("請選擇座位"); return; }

  const summaryBox = document.getElementById("cafeSignSummary");
  const total = counterCart.reduce((s,x)=>s+x.price*x.qty,0);
  
  // 組合精確的購物車餐點摘要供住戶核對
  let itemsHtml = counterCart.map(x => `· ${x.name} × ${x.qty}`).join("<br>");
  summaryBox.innerHTML = `住戶帳號：${counterResident.username}<br>取餐方式：${dining}${seat?` (${seat}桌)`:""}<br>餐點明細：<br>${itemsHtml}<br><b>應扣總點數：${total} 點</b>`;

  clearCafeSignature();
  document.getElementById("cafeSignModalBg").style.display = "flex";
};

// 簽名完確認送出訂單，正式上傳
window.confirmCounterOrderWithSignature = async () => {
  const sigImgData = cafeCanvas.toDataURL("image/png");
  
  // 空白簽名防呆檢查
  const blankCanvas = document.createElement('canvas');
  blankCanvas.width = cafeCanvas.width;
  blankCanvas.height = cafeCanvas.height;
  if (sigImgData === blankCanvas.toDataURL("image/png")) {
    alert("請住戶完成簽名後再確認送出訂單。");
    return;
  }

  closeCafeSignModal();

  const dining=counterDining.value;
  const seat=counterSeat.value;
  const total=counterCart.reduce((s,x)=>s+x.price*x.qty,0);

  if(counterGranted+counterStored<total){
    alert("住戶點不足");
    return;
  }

  let newGranted=counterGranted;
  let newStored=counterStored;

  if(newGranted>=total){
    newGranted-=total;
  }else{
    const rest=total-newGranted;
    newGranted=0;
    newStored-=rest;
  }

  // 正式寫入訂單，同時附帶 counter_signature 電子簽名圖檔
  await addDoc(collection(db,"orders"),{
    order_id:"ZH"+Date.now(),
    uid:counterResident.username,
    created_by:cafeProfile?.username||"cafe",
    items:counterCart,
    total,
    dining_type:dining,
    seat:dining==="內用"?seat:"",
    status:"等待接單",
    counter_signature: sigImgData, // 電子簽名封裝存證
    created_at:new Date().toISOString()
  });

  await updateDoc(doc(db,"balances",counterBalanceDocId),{
    granted_amount:newGranted,
    stored_amount:newStored
  });

  alert("代客訂單已成功送出，住戶簽名檔已留存！");

  counterCart=[];
  counterGranted=newGranted;
  counterStored=newStored;

  counterResidentInfo.innerHTML=`
    帳號：${counterResident.username}<br>
    配發點：${counterGranted}<br>
    儲值點：${counterStored}<br>
    總點：${counterGranted+counterStored}
  `;

  renderCounterCart();
};
