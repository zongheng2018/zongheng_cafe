<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡廳櫃台｜昭揚縱橫</title>

<style>
*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif
}

body{
  margin:0;
  min-height:100vh;
  background:url("bg.jpg") center center/cover fixed no-repeat;
  color:#5f574f;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.76);
  backdrop-filter:blur(5px);
  z-index:-1;
}

.header{
  height:72px;
  background:rgba(255,255,255,.88);
  border-bottom:1px solid #ddd5cc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:72px;
  opacity:.82;
}

.title{
  font-size:22px;
  letter-spacing:2px;
  font-weight:700;
  color:#6d6258;
}

.logout{
  border:1px solid #c9c0b7;
  background:rgba(255,255,255,.88);
  color:#6d6258;
  border-radius:10px;
  padding:9px 16px;
  cursor:pointer;
}

.container{
  max-width:1180px;
  margin:22px auto;
  padding:0 16px 40px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.tab{
  border:none;
  background:rgba(255,255,255,.88);
  color:#7a6b60;
  border-radius:16px;
  padding:14px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  cursor:pointer;
}

.tab.active{
  background:linear-gradient(to bottom,#bcaea1,#9c8e81);
  color:white;
}

.card{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(230,224,218,.8);
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.07);
}

.section-title{
  font-size:26px;
  color:#6d6258;
  font-weight:800;
  margin-bottom:16px;
  letter-spacing:2px;
}

.order-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:16px;
}

.order-card{
  background:rgba(255,255,255,.96);
  border-radius:18px;
  padding:18px;
  border:1px solid #eee5dd;
  box-shadow:0 8px 22px rgba(0,0,0,.06);
  transition:.2s;
}

.new-order{
  animation:pulse 1.2s infinite;
  border:2px solid #d9b98c !important;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.02)}
  100%{transform:scale(1)}
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.order-id{
  font-size:20px;
  font-weight:900;
  color:#5f574f;
}

.meta{
  font-size:14px;
  color:#777;
  line-height:1.7;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  height:fit-content;
}

.badge.wait{
  background:#fff1d9;
  color:#9b681f;
}

.badge.making{
  background:#e6f0ff;
  color:#426f9c;
}

.badge.done{
  background:#e8f5e9;
  color:#3f7f47;
}

.badge.cancel{
  background:#fde8e6;
  color:#b3514a;
}

.order-item{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.item-name{
  font-weight:900;
  color:#5f574f;
}

.item-detail{
  font-size:14px;
  color:#777;
  line-height:1.6;
}

.btn-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.btn{
  border:none;
  border-radius:13px;
  padding:10px 14px;
  font-weight:800;
  color:white;
  cursor:pointer;
}

.btn.primary{
  background:#6d6258;
}

.btn.done{
  background:#6b8b61;
}

.btn.danger{
  background:#c86b62;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

input,textarea{
  width:100%;
  border:none;
  background:#f5f1eb;
  border-radius:14px;
  padding:13px;
  font-size:15px;
  outline:none;
  color:#5f574f;
}

textarea{
  height:90px;
  resize:none;
  grid-column:1/-1;
}

.menu-row{
  display:grid;
  grid-template-columns:80px 1fr auto;
  gap:12px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #eee5dd;
}

.menu-img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:16px;
  background:#eee;
}

.menu-name{
  font-size:18px;
  font-weight:900;
}

.menu-meta{
  font-size:14px;
  color:#777;
  margin-top:4px;
}

.hidden{
  display:none;
}

.empty{
  text-align:center;
  color:#999;
  padding:40px;
}

.setting-status{
  background:#f8f5f1;
  border-radius:16px;
  padding:16px;
  line-height:1.8;
  color:#6d6258;
}

@media(max-width:760px){

  .tabs{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .menu-row{
    grid-template-columns:1fr;
  }

  .brand img{
    width:60px;
  }

  .title{
    font-size:18px;
  }

}
</style>
</head>

<body>

<audio id="newOrderSound" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=notification-2-269292.mp3" type="audio/mpeg">
</audio>

<div class="header">
  <div class="brand">
    <img src="logo.png">
    <div class="title">咖啡廳櫃台</div>
  </div>

  <button class="logout" id="logoutBtn">
    登出
  </button>
</div>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="showTab('orders',this)">
      訂單管理
    </button>

    <button class="tab" onclick="showTab('menu',this)">
      菜單管理
    </button>

    <button class="tab" onclick="showTab('settings',this)">
      系統設定
    </button>
  </div>

  <!-- 訂單 -->
  <section id="ordersTab">

    <div class="card">
      <div class="section-title">等待接單</div>
      <div id="waitingOrders" class="order-grid"></div>
    </div>

    <div class="card">
      <div class="section-title">製作中</div>
      <div id="makingOrders" class="order-grid"></div>
    </div>

    <div class="card">
      <div class="section-title">已完成 / 已取消</div>
      <div id="doneOrders" class="order-grid"></div>
    </div>

  </section>

  <!-- 菜單 -->
  <section id="menuTab" class="hidden">

    <div class="card">

      <div class="section-title">新增菜單</div>

      <div class="form-grid">
        <input id="mName" placeholder="品項名稱">
        <input id="mPrice" type="number" placeholder="價格">
        <input id="mCategory" placeholder="分類">
        <input id="mImage" placeholder="圖片網址">
        <textarea id="mNote" placeholder="備註"></textarea>
      </div>

      <div class="btn-row">
        <button class="btn primary" onclick="addMenu()">
          新增品項
        </button>
      </div>

    </div>

    <div class="card">

      <div class="section-title">菜單列表</div>

      <div id="menuList"></div>

    </div>

  </section>

  <!-- 系統 -->
  <section id="settingsTab" class="hidden">

    <div class="card">

      <div class="section-title">系統設定</div>

      <div class="setting-status" id="systemStatus">
        讀取中...
      </div>

      <div class="btn-row">
        <button class="btn done" onclick="setCafeOpen(true)">
          開放點餐
        </button>

        <button class="btn danger" onclick="setCafeOpen(false)">
          關閉點餐
        </button>
      </div>

    </div>

  </section>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  updateDoc,
  onSnapshot,
  query,
  orderBy,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain:"zonghengcafe.firebaseapp.com",
  projectId:"zonghengcafe",
  storageBucket:"zonghengcafe.firebasestorage.app",
  messagingSenderId:"207027108121",
  appId:"1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId:"G-8ZE4SE2T7T"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let knownOrderIds=[];

onAuthStateChanged(auth,user=>{

  if(!user){
    location.href="index.html";
    return;
  }

  const raw=localStorage.getItem("zh_user");

  if(!raw){
    location.href="index.html";
    return;
  }

  const profile=JSON.parse(raw);

  if(profile.role!=="cafe"){
    alert("沒有權限");
    location.href="index.html";
    return;
  }

  listenOrders();
  loadMenu();
  loadSettings();

});

window.showTab=(tab,btn)=>{

  ordersTab.classList.add("hidden");
  menuTab.classList.add("hidden");
  settingsTab.classList.add("hidden");

  document
  .querySelectorAll(".tab")
  .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  document
  .getElementById(tab+"Tab")
  .classList.remove("hidden");

};

function statusClass(status){

  if(status==="等待接單") return "wait";
  if(status==="製作中") return "making";
  if(status==="已完成") return "done";
  if(status==="已取消") return "cancel";

  return "";

}

function formatItems(items){

  if(!items.length){

    return `
      <div class="meta">
        無品項
      </div>
    `;

  }

  return items.map(x=>`

    <div class="order-item">

      <div class="item-name">
        ${x.name} × ${x.qty}
      </div>

      <div class="item-detail">
        冰度：${x.ice || "無"}
        ｜糖度：${x.sugar || "無"}
      </div>

      <div class="item-detail">
        備註：${x.note || "無"}
      </div>

    </div>

  `).join("");

}

function listenOrders(){

  const q=query(
    collection(db,"orders"),
    orderBy("created_at","desc")
  );

  onSnapshot(q,snap=>{

    waitingOrders.innerHTML="";
    makingOrders.innerHTML="";
    doneOrders.innerHTML="";

    if(snap.empty){

      waitingOrders.innerHTML=`
        <div class="empty">
          目前沒有訂單
        </div>
      `;

      return;
    }

    snap.forEach(d=>{

      const o=d.data();

      const isNew=
      !knownOrderIds.includes(d.id);

      if(isNew){

        knownOrderIds.push(d.id);

        if(o.status==="等待接單"){

          try{
            newOrderSound.play();
          }catch(e){}

        }

      }

      const div=document.createElement("div");

      div.className=
      "order-card " +
      (
        isNew &&
        o.status==="等待接單"
        ? "new-order"
        : ""
      );

      div.innerHTML=`

        <div class="order-head">

          <div>

            <div class="order-id">
              ${o.order_id || d.id}
            </div>

            <div class="meta">
              住戶：${o.uid || ""}
            </div>

            <div class="meta">
              ${o.dining_type || ""}
              ${o.seat ? `｜座位：${o.seat}` : ""}
            </div>

            <div class="meta">
              金額：NT$ ${o.total || 0}
            </div>

          </div>

          <div class="badge ${statusClass(o.status)}">
            ${o.status || "等待接單"}
          </div>

        </div>

        <div>
          ${formatItems(o.items || [])}
        </div>

        <div class="btn-row">

          <button
            class="btn primary"
            onclick="updateOrder('${d.id}','製作中')">

            接單

          </button>

          <button
            class="btn done"
            onclick="updateOrder('${d.id}','已完成')">

            完成

          </button>

          <button
            class="btn danger"
            onclick="updateOrder('${d.id}','已取消')">

            取消

          </button>

        </div>

      `;

      if(o.status==="等待接單"){

        waitingOrders.appendChild(div);

      }else if(o.status==="製作中"){

        makingOrders.appendChild(div);

      }else{

        doneOrders.appendChild(div);

      }

    });

  });

}

window.updateOrder=async(id,status)=>{

  await updateDoc(
    doc(db,"orders",id),
    {
      status,
      updated_at:new Date().toISOString()
    }
  );

};

window.addMenu=async()=>{

  const name=mName.value.trim();
  const price=Number(mPrice.value);
  const category=mCategory.value.trim();
  const image=mImage.value.trim();
  const note=mNote.value.trim();

  if(!name || !price || !category){

    alert("請填名稱、價格、分類");

    return;
  }

  await addDoc(collection(db,"menu"),{
    name,
    price,
    category,
    image,
    note,
    enabled:true,
    created_at:new Date().toISOString()
  });

  mName.value="";
  mPrice.value="";
  mCategory.value="";
  mImage.value="";
  mNote.value="";

  alert("菜單已新增");

  loadMenu();

};

async function loadMenu(){

  const snap=await getDocs(collection(db,"menu"));

  menuList.innerHTML="";

  if(snap.empty){

    menuList.innerHTML=`
      <div class="empty">
        目前沒有菜單
      </div>
    `;

    return;
  }

  snap.forEach(d=>{

    const m=d.data();

    const row=document.createElement("div");

    row.className="menu-row";

    row.innerHTML=`

      <img class="menu-img" src="${m.image || ""}">

      <div>

        <div class="menu-name">
          ${m.name || ""}
        </div>

        <div class="menu-meta">
          ${m.category || ""}
          ｜NT$ ${m.price || 0}
          ｜${m.enabled===false ? "暫停供應" : "供應中"}
        </div>

      </div>

      <button
        class="btn ${m.enabled===false ? "done" : "danger"}"
        onclick="toggleMenu('${d.id}',${m.enabled!==false})">

        ${m.enabled===false ? "恢復供應" : "暫停供應"}

      </button>

    `;

    menuList.appendChild(row);

  });

}

window.toggleMenu=async(id,enabled)=>{

  await updateDoc(
    doc(db,"menu",id),
    {
      enabled:!enabled
    }
  );

  loadMenu();

};

async function loadSettings(){

  const ref=doc(db,"settings","cafe");

  const s=await getDoc(ref);

  if(!s.exists()){

    await setDoc(ref,{open:true});

    systemStatus.innerText=
    "目前狀態：開放點餐";

  }else{

    systemStatus.innerText=
    "目前狀態：" +
    (
      s.data().open===false
      ? "關閉點餐"
      : "開放點餐"
    );

  }

}

window.setCafeOpen=async(open)=>{

  await setDoc(
    doc(db,"settings","cafe"),
    {open},
    {merge:true}
  );

  systemStatus.innerText=
  "目前狀態：" +
  (
    open
    ? "開放點餐"
    : "關閉點餐"
  );

};

logoutBtn.addEventListener("click",async()=>{

  await signOut(auth);

  localStorage.removeItem("zh_user");

  location.href="index.html";

});

</script>

</body>
</html>
