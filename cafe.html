<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡廳櫃台｜昭揚縱橫 咖啡廳點餐系統</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.76);backdrop-filter:blur(5px);z-index:-1}
.header{height:72px;background:rgba(255,255,255,.88);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:72px;opacity:.82}
.title{font-size:22px;letter-spacing:2px;font-weight:700;color:#6d6258}
.header-actions{display:flex;gap:10px;align-items:center}
.logout,.sound-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:10px;padding:9px 14px;font-weight:800}
.sound-btn.on{background:#6b8b61;color:white;border-color:#6b8b61}
.container{max-width:1180px;margin:22px auto;padding:0 16px 40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tab{border:none;background:white;color:#7a6b60;border-radius:16px;padding:14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.06);cursor:pointer}
.tab.active{background:linear-gradient(to bottom,#bcaea1,#9c8e81);color:white}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(230,224,218,.8);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.07)}

.section-title{font-size:24px;color:#6d6258;font-weight:800;margin-bottom:16px;letter-spacing:2px}
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.order-card{background:white;border-radius:18px;padding:18px;border:1px solid #eee5dd;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.order-item{padding:10px 0;border-bottom:1px solid #eee}
.item-name{font-weight:900}
.item-detail{font-size:14px;color:#777;line-height:1.6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:none;border-radius:13px;padding:10px 14px;font-weight:800;color:white;background:#9c8e81;cursor:pointer}
.order-card .btn{min-width:64px}
.btn.primary{background:#6d6258}
.btn.done{background:#6b8b61}
.btn.danger{background:#c86b62}
.btn.light{background:#f0e8df;color:#7a6b60}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea,select{width:100%;border:none;background:#f5f1eb;border-radius:14px;padding:13px;font-size:15px;outline:none;color:#5f574f}
textarea{height:86px;resize:none;grid-column:1/-1}

.menu-row{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #eee5dd}
.menu-img{width:80px;height:80px;object-fit:cover;border-radius:16px;background:#eee}
.menu-name{font-size:18px;font-weight:900}
.menu-meta{font-size:14px;color:#777;margin-top:4px;line-height:1.5}

.hidden{display:none}
.setting-status{background:#f8f5f1;border-radius:16px;padding:16px;line-height:1.8}
.option-editor{margin-top:14px;background:#f8f5f1;border-radius:16px;padding:16px}
.option-title{font-size:18px;font-weight:900;color:#6d6258;margin-bottom:12px}

.option-group-box{background:white;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #ddd5cc;box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.time-lock-box{background:#f5f1eb;border:1px solid #ddd5cc;border-radius:14px;padding:16px;margin:4px 0;grid-column:1/-1;display:flex;flex-direction:column;gap:12px}
.time-lock-trigger{display:flex;align-items:center;gap:10px;font-weight:800;color:#5f574f;cursor:pointer}
.time-lock-trigger input[type="checkbox"]{width:18px;height:18px;margin:0}

.beautiful-del-group-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:8px;padding:6px 14px;font-weight:800;font-size:13px;cursor:pointer}
.beautiful-del-group-btn:hover{background:#f5f1eb}
.add-choice-btn{border:1px solid #bcaea1;background:white;color:#7a6b60;border-radius:8px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer;margin-top:8px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal{background:white;width:100%;max-width:680px;border-radius:24px;padding:22px;max-height:90vh;overflow:auto}
.counter-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.counter-menu-list{max-height:560px;overflow:auto}
.counter-cart-item{background:#f8f5f1;border-radius:16px;padding:14px;margin-bottom:12px}
.counter-total{font-size:24px;font-weight:900;color:#6d6258;margin-top:14px}
.counter-mini-img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#eee}
.counter-menu-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee5dd}
.sig-canvas{border:2px dashed #c9c0b7;background:#fdfcfb;border-radius:14px;cursor:crosshair;display:block;margin:14px 0}

.giant-submit-btn{border:none;border-radius:14px;padding:18px 24px;font-size:18px;font-weight:900;color:white;background:#6d6258;cursor:pointer;width:100%;box-shadow:0 6px 16px rgba(109,98,88,0.3)}
.btn-row-giant{margin-top:20px;display:flex;flex-direction:column;gap:10px}

.badge{display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;min-width:82px;height:34px}
.badge.wait{background:#fff1d9;color:#9b681f;border:1px solid #ffe3be}
.badge.making{background:#e6f0ff;color:#426f9c;border:1px solid #bcd8ff}
.badge.done{background:#e8f5e9;color:#3f7f47;border:1px solid #c8e6c9}
.badge.cancel{background:#fde8e6;color:#b3514a;border:1px solid #f9cbd7}
</style>
</head>

<body>

<div class="header">
  <div class="brand"><img src="logo.png"><div class="title">咖啡廳櫃台</div></div>
  <div class="header-actions">
    <button class="sound-btn on" id="soundBtn" onclick="toggleSound()">音效已啟用</button>
    <button class="logout" id="logoutBtn">登出</button>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('orders',this)">訂單管理</button>
    <button class="tab" onclick="showTab('menu',this)">菜單管理</button>
    <button class="tab" onclick="showTab('counter',this)">代客點餐</button>
    <button class="tab" onclick="showTab('settings',this)">系統設定</button>
  </div>

  <section id="ordersTab">
    <div class="card"><div class="section-title">等待接單</div><div id="waitingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">製作中</div><div id="makingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">已完成 / 已取消</div><div id="doneOrders" class="order-grid"></div></div>
  </section>

  <section id="menuTab" class="hidden">
    <div class="card">
      <div class="section-title">新增菜單</div>
      <div class="form-grid">
        <input id="mName" placeholder="品項名稱"><input id="mPrice" type="number" placeholder="價格（點）">
        <select id="mCategorySelect" onchange="document.getElementById('mCategory').value=this.value"><option value="">選擇既有分類</option></select>
        <input id="mCategory" placeholder="分類，例如 咖啡">
        <input id="mImage" placeholder="圖片網址">
        <input id="mSortOrder" type="number" placeholder="品項排序">
        <select id="mAfterMeal"><option value="false">不顯示餐後上</option><option value="true">顯示餐後上</option></select>
        
        <div class="time-lock-box">
          <label class="time-lock-trigger">
            <input type="checkbox" id="mTimeRestricted" onchange="toggleTimeInputs('m')">
            <span>啟用特定時間限制供應</span>
          </label>
          <div id="mTimeInputs" style="display:none; grid-template-columns:1fr 1fr; gap:12px;">
            <div>開始供應：<input id="mStartTime" type="time" value="09:00"></div>
            <div>結束供應：<input id="mEndTime" type="time" value="17:00"></div>
          </div>
        </div>
        <textarea id="mNote" placeholder="品項備註，可空白"></textarea>
      </div>
      
      <div class="option-editor">
        <div class="option-title">自訂選項</div>
        <div id="newOptionList"></div>
        <button class="btn light" type="button" onclick="addNewOptionGroup()">新增選項群組</button>
      </div>
      <div class="btn-row"><button class="btn primary" onclick="addMenu()">新增品項</button></div>
    </div>
    <div class="card"><div class="section-title">菜單列表</div><div id="menuList"></div></div>
  </section>

  <section id="counterTab" class="hidden">
    <div class="card">
      <div class="section-title">代客點餐</div>
      <div class="form-grid">
        <input id="counterResidentInput" placeholder="輸入住戶帳號，例如 A001">
        <button class="btn primary" onclick="loadCounterResident()">載入住戶</button>
      </div>
      <div class="setting-status" id="counterResidentInfo" style="margin-top:16px;">尚未選擇住戶</div>
    </div>
    <div class="counter-grid">
      <div class="card">
        <div class="section-title">菜單</div>
        <select id="counterCategoryFilter" onchange="changeCounterCategory(this.value)" style="margin-bottom:14px;"></select>
        <div id="counterMenuList" class="counter-menu-list"></div>
      </div>
      <div class="card">
        <div class="section-title">櫃台購物車</div>
        <div id="counterCartList"></div>
        <div class="form-grid" style="margin-top:14px;">
          <select id="counterDining" onchange="toggleCounterSeat()"><option value="內用">內用</option><option value="外帶">外帶</option></select>
          <div id="counterSeatArea"><select id="counterSeat"></select></div>
        </div>
        <div class="counter-total" id="counterTotal">0 點</div>
        
        <div class="btn-row-giant">
          <button class="giant-submit-btn" onclick="prepareCounterSign()">確認送出訂單並簽名</button>
          <button class="btn danger" style="padding:12px; border-radius:12px;" onclick="clearCounterCart()">清空購物車</button>
        </div>
      </div>
    </div>
  </section>

  <section id="settingsTab" class="hidden">
    <div class="card">
      <div class="section-title">點餐系統控制面板</div>
      <div class="setting-status" id="systemStatus">讀取系統設定中...</div>
      <div class="setting-status" style="margin-top:16px;">
        <div style="font-weight:900; margin-bottom:8px;">每日自動營業時間</div>
        <div class="form-grid">
          <div>開始點餐時間：<input id="openTime" type="time"></div>
          <div>截止點餐時間：<input id="closeTime" type="time"></div>
        </div>
        <div style="font-weight:900; margin-top:16px; margin-bottom:8px;">特定國定假日 / 系統公休日設定</div>
        <input id="closedDays" placeholder="例如：2026-07-05,2026-07-06">
        <div class="btn-row" style="margin-top: 14px;"><button class="btn done" onclick="saveSystemSchedule()">儲存時間與公休設定</button></div>
      </div>
      
      <div class="btn-row" style="margin-top: 18px;">
        <button class="btn done" style="background:#43a047;" onclick="setSystemManualMode('force_open')">手動強制開放點餐</button>
        <button class="btn danger" style="background:#e53935;" onclick="setSystemManualMode('force_closed')">手動強制關閉點餐</button>
        <button class="btn light" onclick="setSystemManualMode('auto')">恢復自動模式</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">住戶首頁大廳公告管理 (對接大廳首頁)</div>
      <div class="form-grid">
        <div>
          <label style="font-weight:800; display:block; margin-bottom:6px;">最新公告訊息內容：</label>
          <textarea id="announcementText" placeholder="輸入公告內容，例如：今日手沖單品豆新上架..."></textarea>
        </div>
        <div>
          <label style="font-weight:800; display:block; margin-bottom:6px;">重要通知訊息內容：</label>
          <textarea id="noticeText" placeholder="輸入重要通知，例如：下週二咖啡機定期保養清潔..."></textarea>
        </div>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn primary" onclick="publishBroadcastMessages()">儲存並發布公告內容</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">月度營業額與訂單統計</div>
      <div class="form-grid" style="grid-template-columns: 1fr auto; align-items: center;">
        <div>
          <label style="font-weight: 800; display: block; margin-bottom: 6px;">請選擇統計月份：</label>
          <input type="month" id="statMonthInput" value="2026-06">
        </div>
        <button class="btn primary" style="height: 48px; margin-top: 22px;" onclick="calculateMonthlyRevenue()">開始統計月營收</button>
      </div>
      <div class="setting-status" id="monthlyStatReport" style="margin-top: 16px; background: #fdfaf7; border: 1px solid #eedfd3; font-size: 16px;">
        請選擇月份並點擊上方按鈕生成報表。
      </div>
    </div>
  </section>
</div>

<div class="modal-bg" id="editModalBg">
  <div class="modal">
    <div class="section-title">編輯品項</div>
    <input type="hidden" id="editId">
    <div class="form-grid">
      <input id="editName" placeholder="品項名稱"><input id="editPrice" type="number" placeholder="價格">
      <input id="editCategory" placeholder="分類"><input id="editImage" placeholder="圖片">
      <input id="editSortOrder" type="number" placeholder="排序">
      <select id="editAfterMeal"><option value="false">不顯示餐後上</option><option value="true">顯示餐後上</option></select>
      
      <div class="time-lock-box">
        <label class="time-lock-trigger">
          <input type="checkbox" id="editTimeRestricted" onchange="toggleTimeInputs('edit')">
          <span>啟用特定時間限制供應</span>
        </label>
        <div id="editTimeInputs" style="display:none; grid-template-columns:1fr 1fr; gap:12px;">
          <div>開始供應：<input id="editStartTime" type="time"></div>
          <div>結束供應：<input id="editEndTime" type="time"></div>
        </div>
      </div>
      <textarea id="editNote" placeholder="品項備註"></textarea>
    </div>
    <div class="option-editor">
      <div class="option-title">自訂選項</div>
      <div id="editOptionList"></div>
      <button class="btn light" type="button" onclick="addEditOptionGroup()">新增選項群組</button>
    </div>
    <div class="btn-row"><button class="btn primary" onclick="saveEditMenu()">儲存修改</button><button class="btn light" onclick="closeEditModal()">取消</button></div>
  </div>
</div>

<div class="modal-bg" id="counterItemModalBg">
  <div class="modal">
    <div class="section-title">選擇品項</div>
    <div id="counterOptionArea"></div>
    <div style="margin-top:10px;"><textarea id="counterItemNote" placeholder="規格備註說明，可空白"></textarea></div>
    <div class="form-grid" style="margin-top:12px;">
      <button class="btn light" onclick="counterChangeQty(-1)">−</button>
      <input id="counterItemQty" type="number" value="1" min="1">
      <button class="btn light" onclick="counterChangeQty(1)">＋</button>
      <button class="btn primary" onclick="addCounterItemToCart()">加入購物車</button>
    </div>
    <div class="btn-row"><button class="btn light" onclick="document.getElementById('counterItemModalBg').style.display='none'">取消</button></div>
  </div>
</div>

<div class="modal-bg" id="cafeSignModalBg">
  <div class="modal" style="max-width: 500px;">
    <div class="section-title">住戶點餐明細確認</div>
    <div id="cafeSignSummary" class="setting-status" style="margin-bottom: 12px; line-height:1.6;"></div>
    <canvas id="cafeSigCanvas" class="sig-canvas" width="450" height="180"></canvas>
    <div class="btn-row">
      <button class="giant-submit-btn" onclick="confirmCounterOrderWithSignature()">確認送出訂單</button>
      <button class="btn light" style="margin-top:6px; padding:10px; border-radius:10px;" onclick="cafeCtx.clearRect(0,0,450,180)">清除重簽</button>
      <button class="btn danger" style="padding:10px; border-radius:10px;" onclick="closeCafeSignModal()">返回修改</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, onSnapshot, query, orderBy, setDoc, where } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"
import { getFirestore as fetchDb } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",authDomain:"zonghengcafe.firebaseapp.com",projectId:"zonghengcafe",storageBucket:"zonghengcafe.firebasestorage.app",messagingSenderId:"207027108121",appId:"1:207027108121:web:e7a39e19982ed77f9aed88"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=fetchDb(app);

let menuCache=[]; let categoryCache=[]; let newOptionGroups=[]; let editOptionGroups=[]; let knownOrderIds=new Set();
let cafeProfile=null; let counterResident=null; let counterBalanceDocId=null; let counterGranted=0, counterStored=0;
let counterCart=[]; let counterCurrentItem=null; let currentCounterCategory="全部"; let ordersUnsubscribe=null;
let cafeCanvas, cafeCtx, cafeIsDrawing = false; let soundEnabled = true; let isInitialLoad = true;

const staticSeats = ["A1", "A2", "A3", "A4", "B1", "B2", "B3", "B4", "B5", "B6", "C1", "C2", "C3", "C4", "C5", "C6"];

function playPremiumCrystalSound() {
  if (!soundEnabled) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return; const ctx = new AudioContext();
    const frequencies = [523.25, 659.25]; const now = ctx.currentTime;
    frequencies.forEach(freq => {
      const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 1.2);
    });
  } catch (e) { console.error(e); }
}

function getBadgeStatusClass(status) {
  if (status === "等待接單") return "wait";
  if (status === "製作中") return "making";
  if (status === "已完成") return "done";
  if (status === "已取消") return "cancel";
  return "";
}

window.toggleTimeInputs = (prefix) => {
  const checkbox = document.getElementById(`${prefix}TimeRestricted`); const div = document.getElementById(`${prefix}TimeInputs`);
  if (checkbox && div) { div.style.display = checkbox.checked ? "grid" : "none"; }
};

onAuthStateChanged(auth,async user=>{
  if(!user){location.href="index.html";return}
  const raw=localStorage.getItem("zh_user"); if(!raw){location.href="index.html";return}
  cafeProfile=JSON.parse(raw); listenSettings(); listenOrders(); listenBroadcastSettings(); await loadMenu(); loadStaticSeatsForCounter(); initCafeSignatureCanvas();
});

window.showTab=(tab,btn)=>{
  ordersTab.classList.add("hidden"); menuTab.classList.add("hidden"); counterTab.classList.add("hidden"); settingsTab.classList.add("hidden");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); btn.classList.add("active");
  document.getElementById(tab+"Tab").classList.remove("hidden"); if(tab === "counter"){ renderCounterMenu(); renderCounterCart(); }
};

function formatItems(items){
  return items.map(x=>{
    const optHtml = x.options ? Object.entries(x.options).map(([k,v])=>`<div class="item-detail">${k}：${v}</div>`).join("") : "";
    const noteHtml = x.note ? `<div class="item-detail">備註：${x.note}</div>` : "";
    return `<div class="order-item"><div class="item-name">${x.name} × ${x.qty}</div>${optHtml}${noteHtml}</div>`;
  }).join("");
}

function listenOrders(){
  if(ordersUnsubscribe) ordersUnsubscribe();
  ordersUnsubscribe=onSnapshot(query(collection(db,"orders"),orderBy("created_at","desc")),snap=>{
    waitingOrders.innerHTML=""; makingOrders.innerHTML=""; doneOrders.innerHTML=""; if(snap.empty) { isInitialLoad = false; return; }
    let hasNewIncomingOrder = false;
    snap.forEach(d=>{
      const o=d.data(); const status=o.status||"等待接單";
      if(status === "等待接單" && !knownOrderIds.has(d.id)){ if(!isInitialLoad){ hasNewIncomingOrder = true; } knownOrderIds.add(d.id); } else { knownOrderIds.add(d.id); }
      const sigHtml = o.counter_signature ? `<div class="meta" style="margin-top:6px;">住戶簽名：<br><img src="${o.counter_signature}" style="width:120px; background:white; border:1px solid #eee; border-radius:6px; margin-top:2px;"></div>` : "";
      let btnHtml = "";
      if (status === "等待接單") {
        btnHtml = `<div class="btn-row"><button class="btn primary" onclick="updateOrder('${d.id}','製作中')">接單</button><button class="btn danger" onclick="updateOrder('${d.id}','已取消')">取消</button></div>`;
      } else if (status === "製作中") {
        btnHtml = `<div class="btn-row"><button class="btn done" onclick="updateOrder('${d.id}','已完成')">完成</button><button class="btn danger" onclick="updateOrder('${d.id}','已取消')">取消</button></div>`;
      }
      
      const div=document.createElement("div"); div.className="order-card";
      div.innerHTML=`<div class="order-head"><div><div class="order-id">${o.order_id||d.id}</div><div class="meta">住戶：${o.uid||""}</div><div class="meta">${o.dining_type||""}${o.seat?`｜座位：${o.seat}`:""}</div><div class="meta">金額：${o.total||0} 點</div>${sigHtml}</div><div class="badge ${getBadgeStatusClass(status)}">${status}</div></div>${formatItems(o.items||[])}${btnHtml}`;
      if(status === "等待接單") waitingOrders.appendChild(div); else if(status === "製作中") makingOrders.appendChild(div); else doneOrders.appendChild(div);
    });
    if(hasNewIncomingOrder){ playPremiumCrystalSound(); } isInitialLoad = false;
  });
}

window.updateOrder=async(id,status)=>{ await updateDoc(doc(db,"orders",id),{status,updated_at:new Date().toISOString()}); };

function listenSettings() {

    if (!s.exists()) return; const data = s.data(); let modeText = "智慧自動控管中";
    if (data.manual_mode === "force_open") modeText = "強制手動開放中";
    if (data.manual_mode === "force_closed") modeText = "強制手動關閉中";
    if (data.manual_mode === "auto") modeText = "智慧自動控管中";

function getCleanOptions(groups) {
  return groups.map(g => ({ title: g.title.trim(), choices: g.choices.map(c => c.trim()).filter(c => c !== "") })).filter(g => g.title !== "");
}

window.addMenu=async()=>{
  const name=mName.value.trim(); const price=Number(mPrice.value); const category=(mCategory.value||mCategorySelect.value).trim(); const isTimeRestricted = document.getElementById("mTimeRestricted").checked;
  await addDoc(collection(db,"menu"),{ name, price, category, enabled:true, custom_options:getCleanOptions(newOptionGroups), is_time_restricted: isTimeRestricted, start_time: isTimeRestricted ? mStartTime.value : "09:00", end_time: isTimeRestricted ? mEndTime.value : "17:00", created_at:new Date().toISOString() });
  mName.value=""; mPrice.value=""; mCategory.value=""; mImage.value=""; mSortOrder.value=""; newOptionGroups=[]; renderNewOptionGroups(); alert("新增成功"); await loadMenu();
};

async function loadMenu(){
  const snap=await getDocs(collection(db,"menu")); menuCache=[]; categoryCache=[]; menuList.innerHTML="";
  snap.forEach(d => { const m = {id:d.id,...d.data()}; menuCache.push(m); if(m.category && !categoryCache.includes(m.category)) categoryCache.push(m.category); });
  
  const mSelect = document.getElementById("mCategorySelect");
  if(mSelect) {
    mSelect.innerHTML = '<option value="">選擇既有分類</option>';
    categoryCache.forEach(c => { mSelect.innerHTML += `<option value="${c}">${c}</option>`; });
  }

  menuCache.forEach(m=>{
    const row=document.createElement("div"); row.className="menu-row";
    row.innerHTML=`<img class="menu-img" src="${m.image || 'logo.png'}"><div><div class="menu-name">${m.name||""}</div><div class="menu-meta">${m.price||0} 點｜${m.enabled===false?"暫停供應":"供應中"}</div></div><div class="btn-row"><button class="btn light" onclick="window.openEditMenu('${m.id}')">編輯</button><button class="btn danger" onclick="toggleMenu('${m.id}',${m.enabled!==false})">${m.enabled===false?"恢復":"暫停"}</button></div>`;
    menuList.appendChild(row);
  });
  renderCategorySelects();
}

window.openEditMenu = (id) => {
  const m = menuCache.find(x => x.id === id); if (!m) return;
  editId.value = m.id; editName.value = m.name || ""; editPrice.value = m.price || 0; editCategory.value = m.category || ""; editImage.value = m.image || ""; editSortOrder.value = m.sort_order || 999; editAfterMeal.value = String(m.is_after_meal || false);
  const isRestricted = m.is_time_restricted || false;
  document.getElementById("editTimeRestricted").checked = isRestricted;
  document.getElementById("editStartTime").value = m.start_time || "09:00";
  document.getElementById("editEndTime").value = m.end_time || "17:00";
  toggleTimeInputs('edit');
  editOptionGroups = JSON.parse(JSON.stringify(m.custom_options || []));
  renderEditOptionGroups(); editModalBg.style.display = "flex";
};

window.closeEditModal=()=>editModalBg.style.display="none";

window.saveEditMenu=async()=>{
  const isTimeRestricted = document.getElementById("editTimeRestricted").checked;
  await updateDoc(doc(db,"menu",editId.value),{ 
    name:editName.value.trim(), price:Number(editPrice.value), category:editCategory.value.trim(), image:editImage.value.trim(), sort_order:Number(editSortOrder.value||999), is_after_meal:(editAfterMeal.value==="true"), is_time_restricted:isTimeRestricted, start_time:isTimeRestricted?editStartTime.value:"", end_time:isTimeRestricted?editEndTime.value:"", custom_options:getCleanOptions(editOptionGroups)
  });

};

window.toggleMenu=async(id,enabled)=>{ await updateDoc(doc(db,"menu",id),{enabled:!enabled}); await loadMenu(); };

window.addNewOptionGroup=function(){ newOptionGroups.push({title:"",choices:[""]}); renderNewOptionGroups(); };
window.deleteNewOptionGroup=function(idx){ newOptionGroups.splice(idx,1); renderNewOptionGroups(); };
window.addNewChoice=function(idx){ newOptionGroups[idx].choices.push(''); renderNewOptionGroups(); };
window.deleteNewChoice=function(gIdx, cIdx){ newOptionGroups[gIdx].choices.splice(cIdx,1); renderNewOptionGroups(); };

function renderNewOptionGroups(){
  newOptionList.innerHTML="";
  newOptionGroups.forEach((group,gIndex)=>{
    const div=document.createElement("div"); div.className="option-group-box";
    let choicesHtml = (group.choices || []).map((c, cIndex) => `
      <div style="display:flex; align-items:center; gap:8px; margin-top:8px;">
        <input placeholder="細項，如：去冰" value="${c}" oninput="newOptionGroups[${gIndex}].choices[${cIndex}]=this.value" style="padding:8px 12px; font-size:14px;">
        <button type="button" style="border:none; background:none; color:#c86b62; font-weight:bold; font-size:16px; cursor:pointer;" onclick="window.deleteNewChoice(${gIndex},${cIndex})">✕</button>
      </div>
    `).join("");

    div.innerHTML=`
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <input placeholder="群組名稱，如：冰度" value="${group.title}" oninput="newOptionGroups[gIndex].title=this.value">
        <button class="beautiful-del-group-btn" type="button" onclick="window.deleteNewOptionGroup(${gIndex})">刪除群組</button>
      </div>
      <div style="padding-left:14px; margin-top:6px; border-left:2px solid #eaddd3;">
        ${choicesHtml}
        <button type="button" class="add-choice-btn" onclick="window.addNewChoice(${gIndex})">＋ 新增細項</button>
      </div>
    `;
    newOptionList.appendChild(div);
  });
}

window.deleteEditOptionGroup=function(idx){ editOptionGroups.splice(idx,1); renderEditOptionGroups(); };
window.addEditChoice=function(idx){ editOptionGroups[idx].choices.push(''); renderEditOptionGroups(); };
window.deleteEditChoice=function(gIdx, cIdx){ editOptionGroups[gIdx].choices.splice(cIdx,1); renderEditOptionGroups(); };

function renderCategorySelects(){ const f = document.getElementById("counterCategoryFilter"); if(f) { f.innerHTML = `<option value="全部">全部分類</option>`; categoryCache.forEach(c=>{ f.innerHTML += `<option value="${c}">${c}</option>`; }); } }

window.openCounterItemModal=(id)=>{

function renderCounterCart(){
  const box=document.getElementById("counterCartList"); box.innerHTML=""; let total=0;
  counterCart.forEach((item,idx)=>{ 
    total+=item.price*item.qty; const optText = Object.entries(item.options).map(([k,v])=>`${k}:${v}`).join(", ");
    box.innerHTML+=`<div class="counter-cart-item"><div><b>${item.name} × ${item.qty}</b></div><div style="font-size:13px;color:#777;">${optText} ${item.note?`[${item.note}]`:''}</div><div>小計：${item.price*item.qty} 點</div><button class="btn danger" style="padding:4px 8px; font-size:12px; min-width:auto; margin-top:4px;" onclick="counterCart.splice(${idx},1);renderCounterCart();">刪除</button></div>`; 
  });
  counterTotal.innerText=`${total} 點`;
}

window.toggleCounterSeat=()=>{ const selectArea = document.getElementById("counterSeatArea"); if(selectArea) { selectArea.style.display = counterDining.value === "內用" ? "block" : "none"; } };

window.calculateMonthlyRevenue = async () => {
  const targetMonth = document.getElementById("statMonthInput").value; if(!targetMonth) { alert("請先選擇要統計的月份！"); return; }
  document.getElementById("monthlyStatReport").innerHTML = "正在從資料庫撈取數據，請稍後...";
  try {
    const snap = await getDocs(collection(db, "orders")); let totalOrders = 0; let totalRevenue = 0; let itemSummary = {};
    snap.forEach(d => {
      const o = d.data(); if(o.status === "已完成" && o.created_at && o.created_at.startsWith(targetMonth)) {
        totalOrders++; totalRevenue += Number(o.total || 0); (o.items || []).forEach(item => { itemSummary[item.name] = (itemSummary[item.name] || 0) + Number(item.qty || 1); });
      }
    });
    const sortedSummary = Object.entries(itemSummary).sort((a, b) => b[1] - a[1]);
    let itemsHtml = sortedSummary.map(([name, qty]) => `<li>${name}：共賣出 <b>${qty}</b> 份</li>`).join(""); if(!itemsHtml) itemsHtml = "<li>該月份無任何餐點銷售紀錄</li>";
    document.getElementById("monthlyStatReport").innerHTML = `<div style="font-size: 18px; font-weight: 900; color: #7a594c; margin-bottom: 10px;">月度營收結算報告</div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;"><div style="background: white; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">總成交訂單數：<br><span style="font-size: 22px; font-weight: 900; color: #6d6258;">${totalOrders} 筆</span></div><div style="background: white; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">總營業額點數：<br><span style="font-size: 22px; font-weight: 900; color: #6b8b61;">${totalRevenue} 點</span></div></div><div style="font-weight: 800; margin-bottom: 6px;">品項數量排行榜（依販售數由高至低）：</div><ul style="margin: 0; padding-left: 20px; line-height: 1.6; color: #6d6258;">${itemsHtml}</ul>`;
  } catch (error) { document.getElementById("monthlyStatReport").innerHTML = "讀取資料庫失敗，請確認 Firebase 權限。"; }
};

initCafeSignatureCanvas();
function initCafeSignatureCanvas(){
  cafeCanvas=document.getElementById("cafeSigCanvas"); if(!cafeCanvas)return; cafeCtx=cafeCanvas.getContext("2d"); cafeCtx.strokeStyle="#5f574f"; cafeCtx.lineWidth=3; cafeCtx.lineCap="round";
  cafeCanvas.addEventListener("mousedown",(e)=>{ cafeIsDrawing=true; cafeCtx.beginPath(); const rect=cafeCanvas.getBoundingClientRect(); cafeCtx.moveTo(e.clientX-rect.left,e.clientY-rect.top); });
  cafeCanvas.addEventListener("mousemove",(e)=>{ if(!cafeIsDrawing)return; const rect=cafeCanvas.getBoundingClientRect(); cafeCtx.lineTo(e.clientX-rect.left,e.clientY-rect.top); cafeCtx.stroke(); });
  cafeCanvas.addEventListener("mouseup",()=>cafeIsDrawing=false);
}

window.closeCafeSignModal = () => { document.getElementById("cafeSignModalBg").style.display = "none"; };

window.prepareCounterSign=()=>{ 
  if(!counterResident) { alert("請先輸入住戶帳號並點擊載入住戶"); return; } if(!counterCart.length) { alert("購物車內尚未加入任何餐點"); return; }
  const total=counterCart.reduce((s,x)=>s+x.price*x.qty,0); cafeSignSummary.innerHTML = `住戶帳號：${counterResident.username}<br>取餐方式：${counterDining.value} ${counterDining.value==="內用"?`（座位：${counterSeat.value}）`:""}<br>總計扣除點數：<b>${total} 點</b>`; cafeCtx.clearRect(0,0,450,180); document.getElementById("cafeSignModalBg").style.display="flex"; 
};

// 🚀 核心修正：代客結帳送出後流暢重置關閉，絕不重複卡死
window.confirmCounterOrderWithSignature=async()=>{
  const total=counterCart.reduce((s,x)=>s+x.price*x.qty,0); if(counterGranted + counterStored < total) { alert("該住戶點數不足以支付此筆訂單！"); return; }
  
  await addDoc(collection(db,"orders"),{ 
    order_id:"ZH"+Date.now(), uid:counterResident.username, items:counterCart, total, 
    dining_type:counterDining.value, seat:counterDining.value==="內用"?counterSeat.value:"", 
    status:"等待接單", counter_signature:cafeCanvas.toDataURL("image/png"), created_at:new Date().toISOString() 
  });
  
  await updateDoc(doc(db,"balances",counterBalanceDocId),{ 
    granted_amount: counterGranted>=total?counterGranted-total:0, 
    stored_amount: counterGranted>=total?currentStored:currentStored-(total-counterGranted), 
    updated_by:"cafe_counter" 
  }); 
  
  // 🚀 執行防賴：重置並隱藏
  alert("代客訂單與簽名已成功送出！"); 
  counterCart=[]; 
  renderCounterCart(); 
  closeCafeSignModal();
};

window.counterChangeQty=(n)=>{ let q=Number(counterItemQty.value||1); q=Math.max(1,q+n); counterItemQty.value=q; }; window.clearCounterCart=()=>{ counterCart=[]; renderCounterCart(); };
