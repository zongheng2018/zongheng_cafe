<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡廳櫃台｜昭揚縱橫 咖啡廳點餐系統</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.76);backdrop-filter:blur(5px);z-index:-1}
.header{height:72px;background:rgba(255,255,255,.88);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:72px;opacity:.82}
.title{font-size:22px;letter-spacing:2px;font-weight:700;color:#6d6258}
.header-actions{display:flex;gap:10px;align-items:center}
.logout,.sound-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:10px;padding:9px 14px;font-weight:800}
.sound-btn.on{background:#6b8b61;color:white;border-color:#6b8b61}
.container{max-width:1180px;margin:22px auto;padding:0 16px 40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tab{border:none;background:white;color:#7a6b60;border-radius:16px;padding:14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.tab.active{background:linear-gradient(to bottom,#bcaea1,#9c8e81);color:white}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(230,224,218,.8);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.section-title{font-size:26px;color:#6d6258;font-weight:800;margin-bottom:16px;letter-spacing:2px}
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.order-card{background:white;border-radius:18px;padding:18px;border:1px solid #eee5dd;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.order-card.new{animation:pulse 1.2s ease-in-out 4;border:2px solid #d8b56d}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.order-id{font-size:20px;font-weight:900}
.meta{font-size:14px;color:#777;line-height:1.7}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;min-width:82px;height:38px;flex-shrink:0}
.wait{background:#fff1d9;color:#9b681f}
.making{background:#e6f0ff;color:#426f9c}
.done{background:#e8f5e9;color:#3f7f47}
.cancel{background:#fde8e6;color:#b3514a}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.order-item{padding:10px 0;border-bottom:1px solid #eee}
.item-name{font-weight:900}
.item-detail{font-size:14px;color:#777;line-height:1.6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:none;border-radius:13px;padding:10px 14px;font-weight:800;color:white;background:#9c8e81;cursor:pointer}
.order-card .btn{min-width:64px}
.btn.primary{background:#6d6258}
.btn.done{background:#6b8b61}
.btn.danger{background:#c86b62}
.btn.light{background:#f0e8df;color:#7a6b60}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea,select{width:100%;border:none;background:#f5f1eb;border-radius:14px;padding:13px;font-size:15px;outline:none;color:#5f574f}
textarea{height:86px;resize:none;grid-column:1/-1}
.menu-row{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee5dd}
.menu-img{width:80px;height:80px;object-fit:cover;border-radius:16px;background:#eee}
.menu-name{font-size:18px;font-weight:900}
.menu-meta{font-size:14px;color:#777;margin-top:4px}
.hidden{display:none}
.empty{text-align:center;color:#999;padding:40px}
.setting-status{background:#f8f5f1;border-radius:16px;padding:16px;line-height:1.8}
.option-editor{margin-top:14px;background:#f8f5f1;border-radius:16px;padding:16px}
.option-title{font-size:18px;font-weight:900;color:#6d6258;margin-bottom:12px}
.option-group-box{background:white;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #eee5dd}
.option-choice-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.small-btn{border:none;border-radius:10px;padding:8px 12px;background:#9c8e81;color:white;font-weight:800}
.small-btn.danger{background:#c86b62}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal{background:white;width:100%;max-width:680px;border-radius:24px;padding:22px;max-height:90vh;overflow:auto}
.counter-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.counter-menu-list{max-height:560px;overflow:auto}
.counter-cart-item{background:#f8f5f1;border-radius:16px;padding:14px;margin-bottom:12px}
.counter-total{font-size:24px;font-weight:900;color:#6d6258;margin-top:14px}
.counter-mini-img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#eee}
.counter-menu-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee5dd}
.sig-canvas{border:2px dashed #c9c0b7;background:#fdfcfb;border-radius:14px;cursor:crosshair;display:block;margin:14px 0}
.time-lock-box{background:#fff5e6;border:1px solid #ffe0b2;border-radius:12px;padding:12px;margin:8px 0;grid-column:1/-1}
@media(max-width:900px){.counter-grid{grid-template-columns:1fr}}
@media(max-width:760px){.tabs{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.menu-row{grid-template-columns:1fr}.counter-menu-row{grid-template-columns:64px 1fr}.counter-menu-row .btn{grid-column:1/-1}.brand img{width:60px}.title{font-size:18px}.header{padding:0 12px}.sound-btn{font-size:13px;padding:8px}}
</style>
</head>

<body>

<audio id="newOrderAudio" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<div class="header">
  <div class="brand">
    <img src="logo.png">
    <div class="title">咖啡廳櫃台</div>
  </div>
  <div class="header-actions">
    <button class="sound-btn on" id="soundBtn" onclick="enableSound()">音效已啟用</button>
    <button class="logout" id="logoutBtn">登出</button>
  </div>
</div>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="showTab('orders',this)">訂單管理</button>
    <button class="tab" onclick="showTab('menu',this)">菜單管理</button>
    <button class="tab" onclick="showTab('counter',this)">代客點餐</button>
    <button class="tab" onclick="showTab('settings',this)">系統設定</button>
  </div>

  <section id="ordersTab">
    <div class="card"><div class="section-title">等待接單</div><div id="waitingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">製作中</div><div id="makingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">已完成 / 已取消</div><div id="doneOrders" class="order-grid"></div></div>
  </section>

  <section id="menuTab" class="hidden">
    <div class="card">
      <div class="section-title">新增菜單</div>
      <div class="form-grid">
        <input id="mName" placeholder="品項名稱">
        <input id="mPrice" type="number" placeholder="價格（點）">
        <select id="mCategorySelect" onchange="syncCategoryInput()">
          <option value="">選擇既有分類</option>
        </select>
        <input id="mCategory" placeholder="分類，例如 咖啡">
        <input id="mImage" placeholder="圖片網址">
        <input id="mSortOrder" type="number" placeholder="品項排序，數字越小越前面">
        <select id="mAfterMeal">
          <option value="false">不顯示餐後上</option>
          <option value="true">顯示餐後上</option>
        </select>
        
        <div class="time-lock-box">
          <label style="font-weight:800; color:#c67113; display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" id="mTimeRestricted" onchange="toggleTimeInputs('m')" style="width:18px; height:18px; margin:0;"> 啟用特定時間限制供應
          </label>
          <div id="mTimeInputs" style="display:none; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
            <div><span style="font-size:13px; color:#6d6258;">開始供應：</span><input id="mStartTime" type="time" value="09:00"></div>
            <div><span style="font-size:13px; color:#6d6258;">結束供應：</span><input id="mEndTime" type="time" value="17:00"></div>
          </div>
        </div>

        <textarea id="mNote" placeholder="品項備註，可空白"></textarea>
      </div>

      <div class="option-editor">
        <div class="option-title">自訂選項</div>
        <div id="newOptionList"></div>
        <button class="btn light" type="button" onclick="addNewOptionGroup()">＋新增選項群組</button>
      </div>

      <div class="btn-row"><button class="btn primary" onclick="addMenu()">新增品項</button></div>
    </div>

    <div class="card">
      <div class="section-title">菜單列表</div>
      <div id="menuList"></div>
    </div>
  </section>

  <section id="counterTab" class="hidden">
    <div class="card">
      <div class="section-title">代客點餐</div>
      <div class="form-grid">
        <input id="counterResidentInput" placeholder="輸入住戶帳號，例如 A001">
        <button class="btn primary" onclick="loadCounterResident()">載入住戶</button>
      </div>
      <div class="setting-status" id="counterResidentInfo" style="margin-top:16px;">
        尚未選擇住戶
      </div>
    </div>

    <div class="counter-grid">
      <div class="card">
        <div class="section-title">菜單</div>
        <select id="counterCategoryFilter" onchange="changeCounterCategory(this.value)" style="margin-bottom:14px;">
          <option value="全部">全部分類</option>
        </select>
        <div id="counterMenuList" class="counter-menu-list"></div>
      </div>

      <div class="card">
        <div class="section-title">櫃台購物車</div>
        <div id="counterCartList"></div>

        <div class="form-grid" style="margin-top:14px;">
          <select id="counterDining" onchange="toggleCounterSeat()">
            <option value="內用">內用</option>
            <option value="外帶">外帶</option>
          </select>
          <select id="counterSeat">
            <option value="">請選擇座位</option>
          </select>
        </div>

        <div class="counter-total" id="counterTotal">0 點</div>

        <div class="btn-row">
          <button class="btn danger" onclick="clearCounterCart()">清空購物車</button>
          <button class="btn primary" onclick="prepareCounterSign()">送出訂單</button>
        </div>
      </div>
    </div>
  </section>

  <section id="settingsTab" class="hidden">
    <div class="card">
      <div class="section-title">點餐系統設定</div>
      <div class="setting-status" id="systemStatus">讀取中...</div>
      <div class="setting-status" style="margin-top:14px;">
        <div style="font-weight:900;margin-bottom:8px;">每日營業時間</div>
        <div class="form-grid">
          <input id="openTime" type="time" value="08:30">
          <input id="closeTime" type="time" value="19:00">
        </div>
        <div style="font-weight:900;margin-top:14px;margin-bottom:8px;">每月固定公休日</div>
        <input id="closedDays" placeholder="例如：1,8,15,22">
        <div style="font-weight:900;margin-top:14px;margin-bottom:8px;">分類顯示順序</div>
        <input id="categoryOrderInput" placeholder="例如：咖啡,茶類,氣泡飲,甜點,輕食,其他">
        <div class="btn-row">
          <button class="btn done" onclick="saveCafeSchedule()">儲存營業設定</button>
          <button class="btn danger" onclick="clearWaitingOrders()">清除等待接單</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn done" onclick="setCafeOpen(true)">開放點餐</button>
        <button class="btn danger" onclick="setCafeOpen(false)">關閉點餐</button>
      </div>
    </div>
  </section>
</div>

<div class="modal-bg" id="editModalBg">
  <div class="modal">
    <div class="section-title">編輯品項</div>
    <input type="hidden" id="editId">

    <div class="form-grid">
      <input id="editName" placeholder="品項名稱">
      <input id="editPrice" type="number" placeholder="價格（點）">
      <input id="editCategory" placeholder="分類">
      <input id="editImage" placeholder="圖片網址">
      <input id="editSortOrder" type="number" placeholder="品項排序，數字越小越前面">
      <select id="editAfterMeal">
        <option value="false">不顯示餐後上</option>
        <option value="true">顯示餐後上</option>
      </select>
      
      <div class="time-lock-box">
        <label style="font-weight:800; color:#c67113; display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="editTimeRestricted" onchange="toggleTimeInputs('edit')" style="width:18px; height:18px; margin:0;"> 啟用特定時間限制供應
        </label>
        <div id="editTimeInputs" style="display:none; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
          <div><span style="font-size:13px; color:#6d6258;">開始供應：</span><input id="editStartTime" type="time"></div>
          <div><span style="font-size:13px; color:#6d6258;">結束供應：</span><input id="editEndTime" type="time"></div>
        </div>
      </div>

      <textarea id="editNote" placeholder="品項備註"></textarea>
    </div>

    <div class="option-editor">
      <div class="option-title">自訂選項</div>
      <div id="editOptionList"></div>
      <button class="btn light" type="button" onclick="addEditOptionGroup()">＋新增選項群組</button>
    </div>

    <div class="btn-row">
      <button class="btn primary" onclick="saveEditMenu()">儲存修改</button>
      <button class="btn light" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="counterItemModalBg">
  <div class="modal">
    <div class="section-title" id="counterItemTitle">選擇品項</div>
    <div id="counterOptionArea"></div>
    <div style="margin-top:12px;"><textarea id="counterItemNote" placeholder="備註，可空白"></textarea></div>
    <div class="form-grid" style="margin-top:12px;">
      <button class="btn light" onclick="counterChangeQty(-1)">−</button>
      <input id="counterItemQty" type="number" value="1" min="1">
      <button class="btn light" onclick="counterChangeQty(1)">＋</button>
      <button class="btn primary" onclick="addCounterItemToCart()">加入購物車</button>
    </div>
    <div class="btn-row"><button class="btn light" onclick="closeCounterItemModal()">取消</button></div>
  </div>
</div>

<div class="modal-bg" id="cafeSignModalBg">
  <div class="modal" style="max-width: 500px;">
    <div class="section-title">住戶點餐明細確認</div>
    <div id="cafeSignSummary" class="setting-status" style="margin-bottom: 12px; max-height: 180px; overflow: auto; line-height: 1.6;"></div>
    <label style="font-weight:900;color:#6d6258;">請住戶在下方框格內簽名確認：</label>
    <canvas id="cafeSigCanvas" class="sig-canvas" width="450" height="180"></canvas>
    <div class="btn-row">
      <button class="btn primary done" onclick="confirmCounterOrderWithSignature()">確認送出訂單</button>
      <button class="btn light" onclick="clearCafeSignature()">清除重簽</button>
      <button class="btn danger" onclick="closeCafeSignModal()">返回修改</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc,onSnapshot,query,orderBy,setDoc,getDoc,where,writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",authDomain:"zonghengcafe.firebaseapp.com",projectId:"zonghengcafe",storageBucket:"zonghengcafe.firebasestorage.app",messagingSenderId:"207027108121",appId:"1:207027108121:web:e7a39e19982ed77f9aed88",measurementId:"G-8ZE4SE2T7T"};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let menuCache=[];
let categoryCache=[];
let categoryOrder=[];
let newOptionGroups=[];
let editOptionGroups=[];
let knownOrderIds=new Set();
let firstSnapshot=true;
let soundEnabled=true;
let cafeProfile=null;

let counterResident=null;
let counterBalanceDocId=null;
let counterGranted=0;
let counterStored=0;
let counterCart=[];
let counterCurrentItem=null;
let currentCounterCategory="全部";
let ordersUnsubscribe=null;
let cafeCanvas, cafeCtx, cafeIsDrawing = false;

window.toggleTimeInputs = (prefix) => {
  const checkbox = document.getElementById(`${prefix}TimeRestricted`);
  const div = document.getElementById(`${prefix}TimeInputs`);
  if (checkbox && div) {
    div.style.display = checkbox.checked ? "grid" : "none";
  }
};

onAuthStateChanged(auth,async user=>{
  if(!user){location.href="index.html";return}
  const raw=localStorage.getItem("zh_user");
  if(!raw){location.href="index.html";return}
  cafeProfile=JSON.parse(raw);
  if(cafeProfile.role!=="cafe" && cafeProfile.role!=="engineer"){alert("沒有權限");location.href="index.html";return}
  const savedSound=localStorage.getItem("cafe_sound");
  if(savedSound==="off"){
    soundEnabled=false; soundBtn.classList.remove("on"); soundBtn.innerText="啟用音效";
  }else{
    soundEnabled=true; soundBtn.classList.add("on"); soundBtn.innerText="音效已啟用";
  }
  await loadSettings();
  listenOrders();
  await loadMenu();
  await loadSeatsForCounter();
  initCafeSignatureCanvas();
});

window.showTab=(tab,btn)=>{
  ordersTab.classList.add("hidden"); menuTab.classList.add("hidden"); counterTab.classList.add("hidden"); settingsTab.classList.add("hidden");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(tab+"Tab").classList.remove("hidden");
  if(tab==="counter"){ renderCounterMenu(); renderCounterCart(); }
};

function statusClass(status){
  if(status==="等待接單")return"wait"; if(status==="製作中")return"making"; if(status==="已完成")return"done"; if(status==="已取消")return"cancel"; return"";
}

function formatItems(items){
  if(!items.length)return`<div class="meta">無品項</div>`;
  return items.map(x=>{
    const optionHtml=x.options ? Object.entries(x.options).map(([k,v])=>`<div class="item-detail">${k}：${v}</div>`).join("") : "";
    return `<div class="order-item"><div class="item-name">${x.name} × ${x.qty}</div>${optionHtml}<div class="item-detail">備註：${x.note||"無"}</div></div>`;
  }).join("");
}

function listenOrders(){
  if(ordersUnsubscribe) ordersUnsubscribe();
  ordersUnsubscribe=onSnapshot(query(collection(db,"orders"),orderBy("created_at","desc")),snap=>{
    waitingOrders.innerHTML=""; makingOrders.innerHTML=""; doneOrders.innerHTML="";
    if(snap.empty){ waitingOrders.innerHTML=`<div class="empty">目前沒有訂單</div>`; firstSnapshot=false; return; }
    let waitingCount=0, makingCount=0, doneCount=0;
    snap.forEach(d=>{
      const o=d.data(); const status=o.status||"等待接單"; const isNew=!knownOrderIds.has(d.id); knownOrderIds.add(d.id);
      if(!firstSnapshot && isNew && status==="等待接單") playNewOrderSound();
      const sigHtml = o.counter_signature ? `<div class="meta" style="margin-top:6px;">住戶簽名：<br><img src="${o.counter_signature}" style="width:120px; background:white; border:1px solid #eee; border-radius:6px; margin-top:2px;"></div>` : "";
      const div=document.createElement("div"); div.className="order-card "+(!firstSnapshot && isNew ? "new" : "");
      div.innerHTML=`<div class="order-head"><div><div class="order-id">${o.order_id||d.id}</div><div class="meta">住戶：${o.uid||""}</div><div class="meta">${o.dining_type||""}${o.seat?`｜座位：${o.seat}`:""}</div><div class="meta">金額：${o.total||0} 點</div><div class="meta">下單時間：${d.id.substring(2) ? new Date(Number(d.id.substring(2))).toLocaleString() : formatOrderTime(o.created_at)}</div>${sigHtml}</div><div class="badge ${statusClass(status)}">${status}</div></div>${formatItems(o.items||[])}<div class="btn-row"><button class="btn primary" onclick="updateOrder('${d.id}','製作中')">接單</button><button class="btn done" onclick="updateOrder('${d.id}','已完成')">完成</button><button class="btn danger" onclick="updateOrder('${d.id}','已取消')">取消</button></div>`;
      if(status==="等待接單"){ waitingCount++; waitingOrders.appendChild(div); }else if(status==="製作中"){ makingCount++; makingOrders.appendChild(div); }else{ doneCount++; doneOrders.appendChild(div); }
    });
    if(waitingCount===0)waitingOrders.innerHTML=`<div class="empty">目前沒有等待接單</div>`;
    if(makingCount===0)makingOrders.innerHTML=`<div class="empty">目前沒有製作中訂單</div>`;
    if(doneCount===0)doneOrders.innerHTML=`<div class="empty">目前沒有已完成 / 已取消訂單</div>`;
    firstSnapshot=false;
  });
}

window.updateOrder=async(id,status)=>{
  try{ await updateDoc(doc(db,"orders",id),{status,updated_at:new Date().toISOString()}); }catch(error){ alert("更新失敗："+error.message); }
};

window.addNewOptionGroup=function(){ newOptionGroups.push({title:"",choices:[""]}); renderNewOptionGroups(); };
function renderNewOptionGroups(){
  newOptionList.innerHTML="";
  newOptionGroups.forEach((group,gIndex)=>{
    const div=document.createElement("div"); div.className="option-group-box";
    div.innerHTML=`<input placeholder="群組名稱，例如：冰度" value="${group.title}" oninput="updateNewOptionTitle(${gIndex},this.value)"><div id="newChoices-${gIndex}"></div><div class="btn-row"><button class="small-btn" type="button" onclick="addNewChoice(${gIndex})">＋新增選項</button><button class="small-btn danger" type="button" onclick="removeNewOptionGroup(${gIndex})">刪除此群組</button></div>`;
    newOptionList.appendChild(div); renderNewChoices(gIndex);
  });
}
function renderNewChoices(gIndex){
  const group=newOptionGroups[gIndex]; const box=document.getElementById(`newChoices-${gIndex}`); box.innerHTML="";
  group.choices.forEach((choice,cIndex)=>{
    const row=document.createElement("div"); row.className="option-choice-row";
    row.innerHTML=`<input placeholder="選項，例如：去冰" value="${choice}" oninput="updateNewChoice(${gIndex},${cIndex},this.value)"><button class="small-btn danger" type="button" onclick="removeNewChoice(${gIndex},${cIndex})">刪除</button>`;
    box.appendChild(row);
  });
}
window.updateNewOptionTitle=(gIndex,value)=>{newOptionGroups[gIndex].title=value};
window.addNewChoice=(gIndex)=>{newOptionGroups[gIndex].choices.push("");renderNewOptionGroups()};
window.updateNewChoice=(gIndex,cIndex,value)=>{newOptionGroups[gIndex].choices[cIndex]=value};
window.removeNewChoice=(gIndex,cIndex)=>{newOptionGroups[gIndex].choices.splice(cIndex,1);renderNewOptionGroups()};
window.removeNewOptionGroup=(gIndex)=>{newOptionGroups.splice(gIndex,1);renderNewOptionGroups()};

function getCleanOptions(groups){
  return groups.map(group=>({title:String(group.title||"").trim(),choices:(group.choices||[]).map(x=>String(x||"").trim()).filter(x=>x)})).filter(group=>group.title&&group.choices.length>0);
}
window.syncCategoryInput=()=>{ if(mCategorySelect.value) mCategory.value=mCategorySelect.value; };

window.addMenu=async()=>{
  const name=mName.value.trim(); const price=Number(mPrice.value); const category=(mCategory.value||mCategorySelect.value).trim(); const image=mImage.value.trim(); const note=mNote.value.trim(); const sort_order=Number(mSortOrder.value||999);
  const isTimeRestricted = document.getElementById("mTimeRestricted").checked;
  const startTime = document.getElementById("mStartTime").value;
  const endTime = document.getElementById("mEndTime").value;

  if(!name||!price||!category){ alert("請填名稱、價格、分類"); return; }

  await addDoc(collection(db,"menu"),{
    name, price, category, image, note, sort_order,
    after_meal_enabled:mAfterMeal.value==="true",
    enabled:true,
    custom_options:getCleanOptions(newOptionGroups),
    is_time_restricted: isTimeRestricted,
    start_time: isTimeRestricted ? startTime : "",
    end_time: isTimeRestricted ? endTime : "",
    created_at:new Date().toISOString()
  });

  mName.value=""; mPrice.value=""; mCategory.value=""; mCategorySelect.value=""; mImage.value=""; mSortOrder.value=""; mAfterMeal.value="false"; mNote.value="";
  document.getElementById("mTimeRestricted").checked = false; toggleTimeInputs('m');
  newOptionGroups=[]; renderNewOptionGroups(); alert("品項已新增"); await loadMenu();
};

async function loadMenu(){
  const snap=await getDocs(collection(db,"menu")); menuCache=[]; categoryCache=[]; menuList.innerHTML="";
  if(snap.empty){ renderCategorySelects(); return; }
  snap.forEach(d=>{ const m={id:d.id,...d.data()}; menuCache.push(m); if(m.category&&!categoryCache.includes(m.category)) categoryCache.push(m.category); });
  
  categoryCache.sort();
  menuCache.sort((a,b)=>Number(a.sort_order||999)-Number(b.sort_order||999));

  menuCache.forEach(m=>{
    const optionsText=(m.custom_options||[]).map(o=>`${o.title}：${(o.choices||[]).join("、")}`).join("<br>");
    const timeText = m.is_time_restricted ? `<br><span style="color:#c67113; font-weight:bold;">限時供應：${m.start_time} – ${m.end_time}</span>` : "";

    const row=document.createElement("div"); row.className="menu-row";
    row.innerHTML=`<img class="menu-img" src="${m.image||""}"><div><div class="menu-name">${m.name||""}</div><div class="menu-meta">${m.category||""}｜${m.price||0} 點｜排序：${m.sort_order||999}｜${m.enabled===false?"暫停供應":"供應中"}${timeText}<br>${optionsText}</div></div><div class="btn-row"><button class="btn light" onclick="openEditMenu('${m.id}')">編輯</button><button class="btn ${m.enabled===false?"done":"danger"}" onclick="toggleMenu('${m.id}',${m.enabled!==false})">${m.enabled===false?"恢復":"暫停"}</button><button class="btn danger" onclick="deleteMenu('${m.id}')">刪除</button></div>`;
    menuList.appendChild(row);
  });
  renderCategorySelects();
}

window.openEditMenu=(id)=>{
  const m=menuCache.find(x=>x.id===id); if(!m)return;
  editId.value=m.id; editName.value=m.name||""; editPrice.value=m.price||0; editCategory.value=m.category||""; editImage.value=m.image||""; editSortOrder.value=m.sort_order||""; editAfterMeal.value=m.after_meal_enabled===true?"true":"false"; editNote.value=m.note||"";
  
  const isRestricted = m.is_time_restricted || false;
  document.getElementById("editTimeRestricted").checked = isRestricted;
  document.getElementById("editStartTime").value = m.start_time || "09:00";
  document.getElementById("editEndTime").value = m.end_time || "17:00";
  toggleTimeInputs('edit');

  editOptionGroups=JSON.parse(JSON.stringify(m.custom_options||[]));
  renderEditOptionGroups(); editModalBg.style.display="flex";
};
window.closeEditModal=()=>{ editModalBg.style.display="none"; };

window.saveEditMenu=async()=>{
  const id=editId.value;
  const isTimeRestricted = document.getElementById("editTimeRestricted").checked;
  const startTime = document.getElementById("editStartTime").value;
  const endTime = document.getElementById("editEndTime").value;

  await updateDoc(doc(db,"menu",id),{
    name:editName.value.trim(), price:Number(editPrice.value), category:editCategory.value.trim(), image:editImage.value.trim(), note:editNote.value.trim(), sort_order:Number(editSortOrder.value||999), after_meal_enabled:editAfterMeal.value==="true", custom_options:getCleanOptions(editOptionGroups),
    is_time_restricted: isTimeRestricted,
    start_time: isTimeRestricted ? startTime : "",
    end_time: isTimeRestricted ? endTime : "",
    updated_at:new Date().toISOString()
  });
  editModalBg.style.display="none"; alert("品項已更新"); await loadMenu();
};

window.toggleMenu=async(id,enabled)=>{ await updateDoc(doc(db,"menu",id),{enabled:!enabled}); await loadMenu(); };
window.deleteMenu=async(id)=>{ if(!confirm("確定刪除此品項？"))return; await deleteDoc(doc(db,"menu",id)); await loadMenu(); };

async function loadSettings(){
  const s=await getDoc(doc(db,"settings","cafe")); if(!s.exists()) return;
  const data=s.data();
  systemStatus.innerText=`目前狀態：${data.open===false?"關閉點餐":"開放點餐"}｜自動營業 ${data.open_time||"08:30"}–${data.close_time||"19:00"}`;
}
window.setCafeOpen=async(open)=>{ await setDoc(doc(db,"settings","cafe"),{open,manual_mode:open?"force_open":"force_closed"},{merge:true}); await loadSettings(); };

window.loadCounterResident=async()=>{
  const username=counterResidentInput.value.trim(); if(!username) return;
  const snap=await getDocs(query(collection(db,"balances"),where("uid","==",username)));
  if(snap.empty){ alert("找不到點數資料"); return; }
  const bdoc=snap.docs[0]; const b=bdoc.data();
  counterResident={username}; counterBalanceDocId=bdoc.id; counterGranted=Number(b.granted_amount||0); counterStored=Number(b.stored_amount||0);
  counterResidentInfo.innerHTML=`帳號：${username}<br>配發點：${counterGranted}｜儲值點：${counterStored}｜總點：${counterGranted+counterStored}`;

function renderCounterMenu(){
  const box=document.getElementById("counterMenuList"); if(!box)return; box.innerHTML="";
  let list=menuCache.filter(x=>x.enabled!==false);
  list.forEach(m=>{
    box.innerHTML+=`<div class="counter-menu-row"><img class="counter-mini-img" src="${m.image||""}"><div><div class="menu-name">${m.name||""}</div><div class="menu-meta">${m.price||0} 點</div></div><button class="btn primary" onclick="openCounterItemModal('${m.id}')">加入</button></div>`;
  });
}
window.openCounterItemModal=(id)=>{
  counterCurrentItem=menuCache.find(x=>x.id===id); if(!counterCurrentItem)return;
  counterItemTitle.innerText=counterCurrentItem.name; counterItemQty.value=1; counterItemNote.value=""; counterItemModalBg.style.display="flex";
};
window.closeCounterItemModal=()=>{ counterItemModalBg.style.display="none"; };

window.addCounterItemToCart=()=>{
  counterCart.push({id:counterCurrentItem.id,name:counterCurrentItem.name,price:Number(counterCurrentItem.price||0),qty:Number(counterItemQty.value||1),options:{},note:counterItemNote.value.trim()});
  closeCounterItemModal(); renderCounterCart();
};
function renderCounterCart(){
  const box=document.getElementById("counterCartList"); box.innerHTML=""; let total=0;
  counterCart.forEach((item,idx)=>{
    total+=item.price*item.qty;
    box.innerHTML+=`<div class="counter-cart-item"><div class="item-name">${item.name} × ${item.qty}</div><div>小計：${item.price*item.qty} 點</div><button class="small-btn danger" onclick="counterCart.splice(${idx},1);renderCounterCart();">刪除</button></div>`;
  });
  counterTotal.innerText=`${total} 點`;
}

function initCafeSignatureCanvas(){
  cafeCanvas=document.getElementById("cafeSigCanvas"); if(!cafeCanvas)return; cafeCtx=cafeCanvas.getContext("2d");
  cafeCtx.strokeStyle="#5f574f"; cafeCtx.lineWidth=3; cafeCtx.lineCap="round";
  cafeCanvas.addEventListener("mousedown",(e)=>{ cafeIsDrawing=true; cafeCtx.beginPath(); const rect=cafeCanvas.getBoundingClientRect(); cafeCtx.moveTo(e.clientX-rect.left,e.clientY-rect.top); });
  cafeCanvas.addEventListener("mousemove",(e)=>{ if(!cafeIsDrawing)return; const rect=cafeCanvas.getBoundingClientRect(); cafeCtx.lineTo(e.clientX-rect.left,e.clientY-rect.top); cafeCtx.stroke(); });
  cafeCanvas.addEventListener("mouseup",()=>cafeIsDrawing=false);
}
window.clearCafeSignature=()=>cafeCtx.clearRect(0,0,cafeCanvas.width,cafeCanvas.height);
window.closeCafeSignModal=()=>document.getElementById("cafeSignModalBg").style.display="none";

window.prepareCounterSign=()=>{
  if(!counterResident) { alert("請先載入住戶"); return; }
  const total=counterCart.reduce((s,x)=>s+x.price*x.qty,0);
  document.getElementById("cafeSignSummary").innerHTML=`住戶：${counterResident.username}<br>總計金額：<b>${total} 點</b>`;
  clearCafeSignature(); document.getElementById("cafeSignModalBg").style.display="flex";
};

window.confirmCounterOrderWithSignature=async()=>{
  const sigImgData=cafeCanvas.toDataURL("image/png"); closeCafeSignModal();
  const total=counterCart.reduce((s,x)=>s+x.price*x.qty,0);
  await addDoc(collection(db,"orders"),{
    order_id:"ZH"+Date.now(), uid:counterResident.username, items:counterCart, total, status:"等待接單", counter_signature:sigImgData, created_at:new Date().toISOString()
  });
  await updateDoc(doc(db,"balances",counterBalanceDocId),{granted_amount:counterGranted-total, updated_by:"cafe"});
  alert("訂單送出成功"); counterCart=[]; renderCounterCart();
};
