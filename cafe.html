<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡廳櫃台｜昭揚縱橫</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;background:#f5f1eb;color:#5c4033}
.header{height:68px;background:#6b4637;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:22px;font-weight:700}
.logout{border:0;background:white;color:#6b4637;border-radius:10px;padding:9px 15px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;background:white;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tab{border:0;background:#e9dfd4;color:#6b4637;border-radius:14px;padding:12px;font-weight:700}
.tab.active{background:#6b4637;color:white}
.container{padding:16px}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.order-id{font-size:20px;font-weight:800}
.status{padding:6px 12px;border-radius:999px;background:#eee3d8;font-weight:700}
.detail{margin-top:8px;color:#666;line-height:1.7}
.item{padding:10px 0;border-bottom:1px solid #eee}
.item-name{font-weight:800;font-size:18px}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;background:#6b4637;color:white;border-radius:12px;padding:10px 16px;font-weight:700}
.btn.secondary{background:#9c8e81}
.btn.danger{background:#d65b55}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:15px}
textarea{grid-column:1/-1;height:80px}
.menu-img{width:72px;height:72px;object-fit:cover;border-radius:12px}
.menu-row{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.hidden{display:none}
.empty{text-align:center;color:#999;padding:40px}
@media(max-width:700px){.form{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>

<body>
<div class="header">
  <div>咖啡廳櫃台</div>
  <button class="logout" id="logoutBtn">登出</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('orders',this)">訂單管理</button>
  <button class="tab" onclick="showTab('menu',this)">菜單管理</button>
  <button class="tab" onclick="showTab('settings',this)">系統設定</button>
</div>

<div class="container">

  <section id="ordersTab">
    <div id="ordersList"></div>
  </section>

  <section id="menuTab" class="hidden">
    <div class="card">
      <h2>新增菜單品項</h2>
      <div class="form">
        <input id="mName" placeholder="品項名稱">
        <input id="mPrice" type="number" placeholder="價格">
        <input id="mCategory" placeholder="分類，例如 咖啡">
        <input id="mImage" placeholder="圖片網址">
        <textarea id="mNote" placeholder="備註，可空白"></textarea>
      </div>
      <div class="btns">
        <button class="btn" onclick="addMenu()">新增品項</button>
      </div>
    </div>

    <div class="card">
      <h2>現有菜單</h2>
      <div id="menuList"></div>
    </div>
  </section>

  <section id="settingsTab" class="hidden">
    <div class="card">
      <h2>點餐系統設定</h2>
      <div class="detail">目前先提供基本開關。下一版會加入公休日設定與營業時間。</div>
      <div class="btns">
        <button class="btn secondary" onclick="setCafeOpen(true)">開放點餐</button>
        <button class="btn danger" onclick="setCafeOpen(false)">關閉點餐</button>
      </div>
      <div class="detail" id="systemStatus">讀取中...</div>
    </div>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore,collection,getDocs,addDoc,doc,updateDoc,onSnapshot,query,orderBy,setDoc,getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",authDomain:"zonghengcafe.firebaseapp.com",projectId:"zonghengcafe",storageBucket:"zonghengcafe.firebasestorage.app",messagingSenderId:"207027108121",appId:"1:207027108121:web:e7a39e19982ed77f9aed88",measurementId:"G-8ZE4SE2T7T"};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth,user=>{
  if(!user){location.href="index.html";return}
  const raw=localStorage.getItem("zh_user");
  if(!raw){location.href="index.html";return}
  const profile=JSON.parse(raw);
  if(profile.role!=="cafe"){alert("沒有權限");location.href="index.html";return}
  listenOrders();
  loadMenu();
  loadSettings();
});

window.showTab=(tab,btn)=>{
  ordersTab.classList.add("hidden");
  menuTab.classList.add("hidden");
  settingsTab.classList.add("hidden");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(tab+"Tab").classList.remove("hidden");
};

function listenOrders(){
  const q=query(collection(db,"orders"),orderBy("created_at","desc"));
  onSnapshot(q,snap=>{
    ordersList.innerHTML="";
    if(snap.empty){ordersList.innerHTML='<div class="empty">目前沒有訂單</div>';return}
    snap.forEach(d=>{
      const o=d.data();
      const div=document.createElement("div");
      div.className="card";
      div.innerHTML=`
        <div class="order-top">
          <div>
            <div class="order-id">${o.order_id||d.id}</div>
            <div class="detail">住戶：${o.uid||""}｜${o.dining_type||""}${o.seat?`｜座位：${o.seat}`:""}</div>
            <div class="detail">金額：NT$ ${o.total||0}</div>
          </div>
          <div class="status">${o.status||"等待接單"}</div>
        </div>
        <div class="detail">${formatItems(o.items||[])}</div>
        <div class="btns">
          <button class="btn" onclick="updateOrder('${d.id}','製作中')">接單 / 製作中</button>
          <button class="btn secondary" onclick="updateOrder('${d.id}','已完成')">完成訂單</button>
          <button class="btn danger" onclick="updateOrder('${d.id}','已取消')">取消</button>
        </div>
      `;
      ordersList.appendChild(div);
    });
  });
}

function formatItems(items){
  if(!items.length)return "無品項";
  return items.map(x=>`
    <div class="item">
      <div class="item-name">${x.name} × ${x.qty}</div>
      <div>冰度：${x.ice||"無"}｜糖度：${x.sugar||"無"}</div>
      <div>備註：${x.note||"無"}</div>
    </div>
  `).join("");
}

window.updateOrder=async(id,status)=>{
  await updateDoc(doc(db,"orders",id),{
    status,
    updated_at:new Date().toISOString()
  });
  alert("訂單狀態已更新");
};

window.addMenu=async()=>{
  const name=mName.value.trim();
  const price=Number(mPrice.value);
  const category=mCategory.value.trim();
  const image=mImage.value.trim();
  const note=mNote.value.trim();
  if(!name||!price||!category){alert("請填名稱、價格、分類");return}
  await addDoc(collection(db,"menu"),{
    name,price,category,image,note,enabled:true,created_at:new Date().toISOString()
  });
  mName.value="";mPrice.value="";mCategory.value="";mImage.value="";mNote.value="";
  alert("菜單已新增");
  loadMenu();
};

async function loadMenu(){
  const snap=await getDocs(collection(db,"menu"));
  menuList.innerHTML="";
  if(snap.empty){menuList.innerHTML='<div class="empty">目前沒有菜單</div>';return}
  snap.forEach(d=>{
    const m=d.data();
    const row=document.createElement("div");
    row.className="menu-row";
    row.innerHTML=`
      <img class="menu-img" src="${m.image||""}">
      <div>
        <b>${m.name||""}</b>
        <div class="detail">${m.category||""}｜NT$ ${m.price||0}｜${m.enabled===false?"暫停供應":"供應中"}</div>
      </div>
      <button class="btn ${m.enabled===false?"secondary":"danger"}" onclick="toggleMenu('${d.id}',${m.enabled!==false})">
        ${m.enabled===false?"恢復":"暫停"}
      </button>
    `;
    menuList.appendChild(row);
  });
}

window.toggleMenu=async(id,enabled)=>{
  await updateDoc(doc(db,"menu",id),{enabled:!enabled});
  loadMenu();
};

async function loadSettings(){
  const ref=doc(db,"settings","cafe");
  const s=await getDoc(ref);
  if(!s.exists()){
    await setDoc(ref,{open:true});
    systemStatus.innerText="目前狀態：開放點餐";
  }else{
    systemStatus.innerText="目前狀態："+(s.data().open===false?"關閉點餐":"開放點餐");
  }
}

window.setCafeOpen=async(open)=>{
  await setDoc(doc(db,"settings","cafe"),{open},{merge:true});
  systemStatus.innerText="目前狀態："+(open?"開放點餐":"關閉點餐");
  alert(open?"已開放點餐":"已關閉點餐");
};

logoutBtn.addEventListener("click",async()=>{
  await signOut(auth);
  localStorage.removeItem("zh_user");
  location.href="index.html";
});
</script>
</body>
</html>
