<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡廳櫃台｜昭揚縱橫 咖啡廳點餐系統</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.76);backdrop-filter:blur(5px);z-index:-1}
.header{height:72px;background:rgba(255,255,255,.88);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:72px;opacity:.82}
.title{font-size:22px;letter-spacing:2px;font-weight:700;color:#6d6258}
.header-actions{display:flex;gap:10px;align-items:center}
.logout,.sound-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:10px;padding:9px 14px;font-weight:800}
.sound-btn.on{background:#6b8b61;color:white;border-color:#6b8b61}
.container{max-width:1180px;margin:22px auto;padding:0 16px 40px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tab{border:none;background:white;color:#7a6b60;border-radius:16px;padding:14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.tab.active{background:linear-gradient(to bottom,#bcaea1,#9c8e81);color:white}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(230,224,218,.8);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.section-title{font-size:26px;color:#6d6258;font-weight:800;margin-bottom:16px;letter-spacing:2px}
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.order-card{background:white;border-radius:18px;padding:18px;border:1px solid #eee5dd;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.order-card.new{animation:pulse 1.2s ease-in-out 4;border:2px solid #d8b56d}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.order-id{font-size:20px;font-weight:900}.meta{font-size:14px;color:#777;line-height:1.7}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800}
.wait{background:#fff1d9;color:#9b681f}.making{background:#e6f0ff;color:#426f9c}.done{background:#e8f5e9;color:#3f7f47}.cancel{background:#fde8e6;color:#b3514a}
.order-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}
.order-item{padding:10px 0;border-bottom:1px solid #eee}.item-name{font-weight:900}.item-detail{font-size:14px;color:#777;line-height:1.6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:13px;padding:10px 14px;font-weight:800;color:white;background:#9c8e81}
.btn.primary{background:#6d6258}.btn.done{background:#6b8b61}.btn.danger{background:#c86b62}.btn.light{background:#f0e8df;color:#7a6b60}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea,select{width:100%;border:none;background:#f5f1eb;border-radius:14px;padding:13px;font-size:15px;outline:none;color:#5f574f}
textarea{height:86px;resize:none;grid-column:1/-1}
.menu-row{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee5dd}
.menu-img{width:80px;height:80px;object-fit:cover;border-radius:16px;background:#eee}
.menu-name{font-size:18px;font-weight:900}.menu-meta{font-size:14px;color:#777;margin-top:4px}
.hidden{display:none}.empty{text-align:center;color:#999;padding:40px}.setting-status{background:#f8f5f1;border-radius:16px;padding:16px;line-height:1.8}
.option-editor{margin-top:14px;background:#f8f5f1;border-radius:16px;padding:16px}
.option-title{font-size:18px;font-weight:900;color:#6d6258;margin-bottom:12px}
.option-group-box{background:white;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #eee5dd}
.option-choice-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.small-btn{border:none;border-radius:10px;padding:8px 12px;background:#9c8e81;color:white;font-weight:800}.small-btn.danger{background:#c86b62}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal{background:white;width:100%;max-width:680px;border-radius:24px;padding:22px;max-height:90vh;overflow:auto}
@media(max-width:760px){.tabs{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.menu-row{grid-template-columns:1fr}.brand img{width:60px}.title{font-size:18px}.header{padding:0 12px}.sound-btn{font-size:13px;padding:8px}}
</style>
</head>

<body>

<audio id="newOrderAudio" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<div class="header">
  <div class="brand">
    <img src="logo.png">
    <div class="title">咖啡廳櫃台</div>
  </div>
  <div class="header-actions">
    <button class="sound-btn" id="soundBtn" onclick="enableSound()">啟用音效</button>
    <button class="logout" id="logoutBtn">登出</button>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('orders',this)">訂單管理</button>
    <button class="tab" onclick="showTab('menu',this)">菜單管理</button>
    <button class="tab" onclick="showTab('settings',this)">系統設定</button>
  </div>

  <section id="ordersTab">
    <div class="card"><div class="section-title">等待接單</div><div id="waitingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">製作中</div><div id="makingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">已完成 / 已取消</div><div id="doneOrders" class="order-grid"></div></div>
  </section>

  <section id="menuTab" class="hidden">
    <div class="card">
      <div class="section-title">新增菜單</div>
      <div class="form-grid">
        <input id="mName" placeholder="品項名稱">
        <input id="mPrice" type="number" placeholder="價格">
        <input id="mCategory" placeholder="分類，例如 咖啡">
        <input id="mImage" placeholder="圖片網址">
        <textarea id="mNote" placeholder="品項備註，可空白"></textarea>
      </div>

      <div class="option-editor">
        <div class="option-title">自訂選項</div>
        <div id="newOptionList"></div>
        <button class="btn light" type="button" onclick="addNewOptionGroup()">＋新增選項群組</button>
        <div class="meta" style="margin-top:10px;">例如：群組名稱填「冰度」，選項填「去冰、正常冰、微冰」。</div>
      </div>

      <div class="btn-row"><button class="btn primary" onclick="addMenu()">新增品項</button></div>
    </div>

    <div class="card">
      <div class="section-title">菜單列表</div>
      <div id="menuList"></div>
    </div>
  </section>

  <section id="settingsTab" class="hidden">
    <div class="card">
      <div class="section-title">點餐系統設定</div>
      <div class="setting-status" id="systemStatus">讀取中...</div>
      <div class="btn-row">
        <button class="btn done" onclick="setCafeOpen(true)">開放點餐</button>
        <button class="btn danger" onclick="setCafeOpen(false)">關閉點餐</button>
      </div>
    </div>
  </section>
</div>

<div class="modal-bg" id="editModalBg">
  <div class="modal">
    <div class="section-title">編輯品項</div>
    <input type="hidden" id="editId">

    <div class="form-grid">
      <input id="editName" placeholder="品項名稱">
      <input id="editPrice" type="number" placeholder="價格">
      <input id="editCategory" placeholder="分類">
      <input id="editImage" placeholder="圖片網址">
      <textarea id="editNote" placeholder="品項備註"></textarea>
    </div>

    <div class="option-editor">
      <div class="option-title">自訂選項</div>
      <div id="editOptionList"></div>
      <button class="btn light" type="button" onclick="addEditOptionGroup()">＋新增選項群組</button>
    </div>

    <div class="btn-row">
      <button class="btn primary" onclick="saveEditMenu()">儲存修改</button>
      <button class="btn light" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc,onSnapshot,query,orderBy,setDoc,getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain:"zonghengcafe.firebaseapp.com",
  projectId:"zonghengcafe",
  storageBucket:"zonghengcafe.firebasestorage.app",
  messagingSenderId:"207027108121",
  appId:"1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId:"G-8ZE4SE2T7T"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let menuCache=[];
let newOptionGroups=[];
let editOptionGroups=[];
let knownOrderIds=new Set();
let firstSnapshot=true;
let soundEnabled=false;

window.enableSound=async()=>{
  const audio=document.getElementById("newOrderAudio");
  try{
    audio.volume=1;
    await audio.play();
    audio.pause();
    audio.currentTime=0;
    soundEnabled=true;
    soundBtn.classList.add("on");
    soundBtn.innerText="音效已啟用";
    alert("新訂單音效已啟用");
  }catch(e){
    alert("瀏覽器阻擋音效，請再按一次啟用音效");
  }
};

function playNewOrderSound(){
  if(!soundEnabled)return;
  const audio=document.getElementById("newOrderAudio");
  try{
    audio.currentTime=0;
    audio.play();
  }catch(e){}
}

onAuthStateChanged(auth,user=>{
  if(!user){location.href="index.html";return}
  const raw=localStorage.getItem("zh_user");
  if(!raw){location.href="index.html";return}
  const profile=JSON.parse(raw);
  if(profile.role!=="cafe"){alert("沒有權限");location.href="index.html";return}
  listenOrders();
  loadMenu();
  loadSettings();
});

window.showTab=(tab,btn)=>{
  ordersTab.classList.add("hidden");
  menuTab.classList.add("hidden");
  settingsTab.classList.add("hidden");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(tab+"Tab").classList.remove("hidden");
};

function statusClass(status){
  if(status==="等待接單")return"wait";
  if(status==="製作中")return"making";
  if(status==="已完成")return"done";
  if(status==="已取消")return"cancel";
  return"";
}

function formatItems(items){
  if(!items.length)return`<div class="meta">無品項</div>`;
  return items.map(x=>`
    <div class="order-item">
      <div class="item-name">${x.name} × ${x.qty}</div>
      ${
        x.options
        ? Object.entries(x.options).map(([k,v])=>`<div class="item-detail">${k}：${v}</div>`).join("")
        : `<div class="item-detail">冰度：${x.ice||"無"}｜糖度：${x.sugar||"無"}</div>`
      }
      <div class="item-detail">備註：${x.note||"無"}</div>
    </div>
  `).join("");
}

function listenOrders(){
  const q=query(collection(db,"orders"),orderBy("created_at","desc"));
  onSnapshot(q,snap=>{
    waitingOrders.innerHTML="";
    makingOrders.innerHTML="";
    doneOrders.innerHTML="";

    if(snap.empty){
      waitingOrders.innerHTML=`<div class="empty">目前沒有訂單</div>`;
      firstSnapshot=false;
      return;
    }

    snap.forEach(d=>{
      const o=d.data();
      const isNew=!knownOrderIds.has(d.id);
      knownOrderIds.add(d.id);

      if(!firstSnapshot && isNew && (o.status||"等待接單")==="等待接單"){
        playNewOrderSound();
      }

      const div=document.createElement("div");
      div.className="order-card "+(!firstSnapshot && isNew ? "new" : "");
      div.innerHTML=`
        <div class="order-head">
          <div>
            <div class="order-id">${o.order_id||d.id}</div>
            <div class="meta">住戶：${o.uid||""}</div>
            <div class="meta">${o.dining_type||""}${o.seat?`｜座位：${o.seat}`:""}</div>
            <div class="meta">金額：NT$ ${o.total||0}</div>
          </div>
          <div class="badge ${statusClass(o.status)}">${o.status||"等待接單"}</div>
        </div>
        ${formatItems(o.items||[])}
        <div class="btn-row">
          <button class="btn primary" onclick="updateOrder('${d.id}','製作中')">接單</button>
          <button class="btn done" onclick="updateOrder('${d.id}','已完成')">完成</button>
          <button class="btn danger" onclick="updateOrder('${d.id}','已取消')">取消</button>
        </div>
      `;

      if(o.status==="等待接單"||!o.status) waitingOrders.appendChild(div);
      else if(o.status==="製作中") makingOrders.appendChild(div);
      else doneOrders.appendChild(div);
    });

    firstSnapshot=false;
  });
}

window.updateOrder=async(id,status)=>{
  await updateDoc(doc(db,"orders",id),{status,updated_at:new Date().toISOString()});
};

window.addNewOptionGroup=function(){newOptionGroups.push({title:"",choices:[""]});renderNewOptionGroups();};

function renderNewOptionGroups(){
  newOptionList.innerHTML="";
  newOptionGroups.forEach((group,gIndex)=>{
    const div=document.createElement("div");
    div.className="option-group-box";
    div.innerHTML=`
      <input placeholder="群組名稱，例如：冰度" value="${group.title}" oninput="updateNewOptionTitle(${gIndex},this.value)">
      <div id="newChoices-${gIndex}"></div>
      <div class="btn-row">
        <button class="small-btn" type="button" onclick="addNewChoice(${gIndex})">＋新增選項</button>
        <button class="small-btn danger" type="button" onclick="removeNewOptionGroup(${gIndex})">刪除此群組</button>
      </div>
    `;
    newOptionList.appendChild(div);
    renderNewChoices(gIndex);
  });
}

function renderNewChoices(gIndex){
  const group=newOptionGroups[gIndex];
  const box=document.getElementById(`newChoices-${gIndex}`);
  box.innerHTML="";
  group.choices.forEach((choice,cIndex)=>{
    const row=document.createElement("div");
    row.className="option-choice-row";
    row.innerHTML=`
      <input placeholder="選項，例如：去冰" value="${choice}" oninput="updateNewChoice(${gIndex},${cIndex},this.value)">
      <button class="small-btn danger" type="button" onclick="removeNewChoice(${gIndex},${cIndex})">刪除</button>
    `;
    box.appendChild(row);
  });
}

window.updateNewOptionTitle=(gIndex,value)=>{newOptionGroups[gIndex].title=value};
window.addNewChoice=(gIndex)=>{newOptionGroups[gIndex].choices.push("");renderNewOptionGroups()};
window.updateNewChoice=(gIndex,cIndex,value)=>{newOptionGroups[gIndex].choices[cIndex]=value};
window.removeNewChoice=(gIndex,cIndex)=>{newOptionGroups[gIndex].choices.splice(cIndex,1);renderNewOptionGroups()};
window.removeNewOptionGroup=(gIndex)=>{newOptionGroups.splice(gIndex,1);renderNewOptionGroups()};

function getCleanOptions(groups){
  return groups.map(group=>({
    title:String(group.title||"").trim(),
    choices:group.choices.map(x=>String(x||"").trim()).filter(x=>x)
  })).filter(group=>group.title&&group.choices.length>0);
}

window.addMenu=async()=>{
  const name=mName.value.trim();
  const price=Number(mPrice.value);
  const category=mCategory.value.trim();
  const image=mImage.value.trim();
  const note=mNote.value.trim();

  if(!name||!price||!category){alert("請填名稱、價格、分類");return}

  await addDoc(collection(db,"menu"),{
    name,price,category,image,note,
    enabled:true,
    custom_options:getCleanOptions(newOptionGroups),
    note_enabled:true,
    created_at:new Date().toISOString()
  });

  mName.value="";mPrice.value="";mCategory.value="";mImage.value="";mNote.value="";
  newOptionGroups=[];
  renderNewOptionGroups();
  alert("菜單已新增");
  loadMenu();
};

async function loadMenu(){
  const snap=await getDocs(collection(db,"menu"));
  menuCache=[];
  menuList.innerHTML="";

  if(snap.empty){
    menuList.innerHTML=`<div class="empty">目前沒有菜單</div>`;
    return;
  }

  snap.forEach(d=>{
    const m={id:d.id,...d.data()};
    menuCache.push(m);

    const optionsText=(m.custom_options||[]).map(o=>`${o.title}：${(o.choices||[]).join("、")}`).join("<br>");

    const row=document.createElement("div");
    row.className="menu-row";
    row.innerHTML=`
      <img class="menu-img" src="${m.image||""}">
      <div>
        <div class="menu-name">${m.name||""}</div>
        <div class="menu-meta">
          ${m.category||""}｜NT$ ${m.price||0}｜${m.enabled===false?"暫停供應":"供應中"}<br>
          ${optionsText || "未設定自訂選項"}
        </div>
      </div>
      <div class="btn-row">
        <button class="btn light" onclick="openEditMenu('${m.id}')">編輯</button>
        <button class="btn ${m.enabled===false?"done":"danger"}" onclick="toggleMenu('${m.id}',${m.enabled!==false})">${m.enabled===false?"恢復":"暫停"}</button>
        <button class="btn danger" onclick="deleteMenu('${m.id}')">刪除</button>
      </div>
    `;
    menuList.appendChild(row);
  });
}

window.openEditMenu=(id)=>{
  const m=menuCache.find(x=>x.id===id);
  if(!m)return;
  editId.value=m.id;
  editName.value=m.name||"";
  editPrice.value=m.price||0;
  editCategory.value=m.category||"";
  editImage.value=m.image||"";
  editNote.value=m.note||"";
  editOptionGroups=JSON.parse(JSON.stringify(m.custom_options||[]));
  renderEditOptionGroups();
  editModalBg.style.display="flex";
};

window.closeEditModal=()=>{editModalBg.style.display="none";};

window.addEditOptionGroup=function(){editOptionGroups.push({title:"",choices:[""]});renderEditOptionGroups();};

function renderEditOptionGroups(){
  editOptionList.innerHTML="";
  editOptionGroups.forEach((group,gIndex)=>{
    const div=document.createElement("div");
    div.className="option-group-box";
    div.innerHTML=`
      <input placeholder="群組名稱，例如：冰度" value="${group.title}" oninput="updateEditOptionTitle(${gIndex},this.value)">
      <div id="editChoices-${gIndex}"></div>
      <div class="btn-row">
        <button class="small-btn" type="button" onclick="addEditChoice(${gIndex})">＋新增選項</button>
        <button class="small-btn danger" type="button" onclick="removeEditOptionGroup(${gIndex})">刪除此群組</button>
      </div>
    `;
    editOptionList.appendChild(div);
    renderEditChoices(gIndex);
  });
}

function renderEditChoices(gIndex){
  const group=editOptionGroups[gIndex];
  const box=document.getElementById(`editChoices-${gIndex}`);
  box.innerHTML="";
  group.choices.forEach((choice,cIndex)=>{
    const row=document.createElement("div");
    row.className="option-choice-row";
    row.innerHTML=`
      <input placeholder="選項，例如：去冰" value="${choice}" oninput="updateEditChoice(${gIndex},${cIndex},this.value)">
      <button class="small-btn danger" type="button" onclick="removeEditChoice(${gIndex},${cIndex})">刪除</button>
    `;
    box.appendChild(row);
  });
}

window.updateEditOptionTitle=(gIndex,value)=>{editOptionGroups[gIndex].title=value};
window.addEditChoice=(gIndex)=>{editOptionGroups[gIndex].choices.push("");renderEditOptionGroups()};
window.updateEditChoice=(gIndex,cIndex,value)=>{editOptionGroups[gIndex].choices[cIndex]=value};
window.removeEditChoice=(gIndex,cIndex)=>{editOptionGroups[gIndex].choices.splice(cIndex,1);renderEditOptionGroups()};
window.removeEditOptionGroup=(gIndex)=>{editOptionGroups.splice(gIndex,1);renderEditOptionGroups()};

window.saveEditMenu=async()=>{
  const id=editId.value;
  await updateDoc(doc(db,"menu",id),{
    name:editName.value.trim(),
    price:Number(editPrice.value),
    category:editCategory.value.trim(),
    image:editImage.value.trim(),
    note:editNote.value.trim(),
    custom_options:getCleanOptions(editOptionGroups),
    note_enabled:true,
    updated_at:new Date().toISOString()
  });
  editModalBg.style.display="none";
  alert("品項已更新");
  loadMenu();
};

window.toggleMenu=async(id,enabled)=>{
  await updateDoc(doc(db,"menu",id),{enabled:!enabled});
  loadMenu();
};

window.deleteMenu=async(id)=>{
  if(!confirm("確定刪除此品項？"))return;
  await deleteDoc(doc(db,"menu",id));
  loadMenu();
};

async function loadSettings(){
  const ref=doc(db,"settings","cafe");
  const s=await getDoc(ref);
  if(!s.exists()){
    await setDoc(ref,{open:true});
    systemStatus.innerText="目前狀態：開放點餐";
  }else{
    systemStatus.innerText="目前狀態："+(s.data().open===false?"關閉點餐":"開放點餐");
  }
}

window.setCafeOpen=async(open)=>{
  await setDoc(doc(db,"settings","cafe"),{open},{merge:true});
  systemStatus.innerText="目前狀態："+(open?"開放點餐":"關閉點餐");
};

editModalBg.addEventListener("click",e=>{
  if(e.target===editModalBg)closeEditModal();
});

logoutBtn.addEventListener("click",async()=>{
  await signOut(auth);
  localStorage.removeItem("zh_user");
  location.href="index.html";
});
</script>

</body>
</html>
