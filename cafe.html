<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡廳櫃台｜昭揚縱橫 咖啡廳點餐系統</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.76);backdrop-filter:blur(5px);z-index:-1}
.header{height:72px;background:rgba(255,255,255,.88);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:72px;opacity:.82}
.title{font-size:22px;letter-spacing:2px;font-weight:700;color:#6d6258}
.header-actions{display:flex;gap:10px;align-items:center}
.logout,.sound-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:10px;padding:9px 14px;font-weight:800}
.sound-btn.on{background:#6b8b61;color:white;border-color:#6b8b61}
.container{max-width:1180px;margin:22px auto;padding:0 16px 40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tab{border:none;background:white;color:#7a6b60;border-radius:16px;padding:14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.tab.active{background:linear-gradient(to bottom,#bcaea1,#9c8e81);color:white}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(230,224,218,.8);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.07)}

.section-title{font-size:24px;color:#6d6258;font-weight:800;margin-bottom:16px;letter-spacing:2px}
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.order-card{background:white;border-radius:18px;padding:18px;border:1px solid #eee5dd;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.order-item{padding:10px 0;border-bottom:1px solid #eee}
.item-name{font-weight:900}
.item-detail{font-size:14px;color:#777;line-height:1.6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:none;border-radius:13px;padding:10px 14px;font-weight:800;color:white;background:#9c8e81;cursor:pointer}
.order-card .btn{min-width:64px}
.btn.primary{background:#6d6258}
.btn.done{background:#6b8b61}
.btn.danger{background:#c86b62}
.btn.light{background:#f0e8df;color:#7a6b60}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea,select{width:100%;border:none;background:#f5f1eb;border-radius:14px;padding:13px;font-size:15px;outline:none;color:#5f574f}
textarea{height:86px;resize:none;grid-column:1/-1}

/* 🚀 修正：為卡片右上角狀態圓角標籤（.badge）換上亮眼繽紛的外框與粉襯底 */
.badge{display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;min-width:82px;height:34px;flex-shrink:0}
.badge.wait{background:#fff1d9;color:#9b681f;border:1px solid #ffe3be}
.badge.making{background:#e6f0ff;color:#426f9c;border:1px solid #bcd8ff}
.badge.done{background:#e8f5e9;color:#3f7f47;border:1px solid #c8e6c9}
.badge.cancel{background:#fde8e6;color:#b3514a;border:1px solid #f9cbd7}

.menu-row{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #eee5dd}
.menu-img{width:80px;height:80px;object-fit:cover;border-radius:16px;background:#eee}
.menu-name{font-size:18px;font-weight:900}
.menu-meta{font-size:14px;color:#777;margin-top:4px;line-height:1.5}

.hidden{display:none}
.setting-status{background:#f8f5f1;border-radius:16px;padding:16px;line-height:1.8}
.option-editor{margin-top:14px;background:#f8f5f1;border-radius:16px;padding:16px}
.option-title{font-size:18px;font-weight:900;color:#6d6258;margin-bottom:12px}
.option-group-box{background:white;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #eee5dd}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal{background:white;width:100%;max-width:680px;border-radius:24px;padding:22px;max-height:90vh;overflow:auto}
.counter-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.counter-menu-list{max-height:560px;overflow:auto}
.counter-cart-item{background:#f8f5f1;border-radius:16px;padding:14px;margin-bottom:12px}
.counter-total{font-size:24px;font-weight:900;color:#6d6258;margin-top:14px}
.counter-mini-img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#eee}
.counter-menu-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee5dd}
.sig-canvas{border:2px dashed #c9c0b7;background:#fdfcfb;border-radius:14px;cursor:crosshair;display:block;margin:14px 0}
.time-lock-box{background:#f5f1eb;border:1px solid #eee5dd;border-radius:14px;padding:14px;margin:4px 0;grid-column:1/-1}
@media(max-width:900px){.counter-grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="header">
  <div class="brand">
    <img src="logo.png">
    <div class="title">咖啡廳櫃台</div>
  </div>
  <div class="header-actions">
    <button class="sound-btn on" id="soundBtn" onclick="toggleSound()">音效已啟用</button>
    <button class="logout" id="logoutBtn">登出</button>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('orders',this)">訂單管理</button>
    <button class="tab" onclick="showTab('menu',this)">菜單管理</button>
    <button class="tab" onclick="showTab('counter',this)">代客點餐</button>
    <button class="tab" onclick="showTab('settings',this)">系統設定</button>
  </div>

  <section id="ordersTab">
    <div class="card"><div class="section-title">等待接單</div><div id="waitingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">製作中</div><div id="makingOrders" class="order-grid"></div></div>
    <div class="card"><div class="section-title">已完成 / 已取消</div><div id="doneOrders" class="order-grid"></div></div>
  </section>

  <section id="menuTab" class="hidden">
    <div class="card">
      <div class="section-title">新增菜單</div>
      <div class="form-grid">
        <input id="mName" placeholder="品項名稱">
        <input id="mPrice" type="number" placeholder="價格（點）">
        <select id="mCategorySelect" onchange="syncCategoryInput()">
          <option value="">選擇既有分類</option>
        </select>
        <input id="mCategory" placeholder="分類，例如 咖啡">
        <input id="mImage" placeholder="圖片網址">
        <input id="mSortOrder" type="number" placeholder="品項排序，數字越小越前面">
        <select id="mAfterMeal">
          <option value="false">不顯示餐後上</option>
          <option value="true">顯示餐後上</option>
        </select>
        <div class="time-lock-box">
          <label style="font-weight:800; display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="mTimeRestricted" onchange="toggleTimeInputs('m')" style="width:18px; height:18px; margin:0;"> 啟用特定時間限制供應
          </label>
          <div id="mTimeInputs" style="display:none; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;">
            <div>開始供應：<input id="mStartTime" type="time" value="09:00"></div>
            <div>結束供應：<input id="mEndTime" type="time" value="17:00"></div>
          </div>
        </div>
        <textarea id="mNote" placeholder="品項備註，可空白"></textarea>
      </div>
      <div class="btn-row"><button class="btn primary" onclick="addMenu()">新增品項</button></div>
    </div>
    <div class="card">
      <div class="section-title">菜單列表</div>
      <div id="menuList"></div>
    </div>
  </section>

  <section id="counterTab" class="hidden">
    <div class="card">
      <div class="section-title">代客點餐</div>
      <div class="form-grid">
        <input id="counterResidentInput" placeholder="輸入住戶帳號，例如 A001">
        <button class="btn primary" onclick="loadCounterResident()">載入住戶</button>
      </div>
      <div class="setting-status" id="counterResidentInfo" style="margin-top:16px;">尚未選擇住戶</div>
    </div>
    <div class="counter-grid">
      <div class="card">
        <div class="section-title">菜單</div>
        <select id="counterCategoryFilter" onchange="changeCounterCategory(this.value)" style="margin-bottom:14px;"></select>
        <div id="counterMenuList" class="counter-menu-list"></div>
      </div>
      <div class="card">
        <div class="section-title">櫃台購物車</div>
        <div id="counterCartList"></div>
        <div class="form-grid" style="margin-top:14px;">
          <select id="counterDining" onchange="toggleCounterSeat()">
            <option value="內用">內用</option>
            <option value="外帶">外帶</option>
          </select>
          <select id="counterSeat"><option value="">請選擇座位</option></select>
        </div>
        <div class="counter-total" id="counterTotal">0 點</div>
        <div class="btn-row">
          <button class="btn danger" onclick="clearCounterCart()">清空購物車</button>
          <button class="btn primary" onclick="prepareCounterSign()">送出訂單</button>
        </div>
      </div>
    </div>
  </section>

  <section id="settingsTab" class="hidden">
    <div class="card">
      <div class="section-title">點餐系統控制面板</div>
      <div class="setting-status" id="systemStatus">讀取系統設定中...</div>
      <div class="setting-status" style="margin-top: 16px;">
        <div style="font-weight:900; margin-bottom:8px;">每日自動營業時間</div>
        <div class="form-grid">
          <div>開始點餐時間：<input id="openTime" type="time"></div>
          <div>截止點餐時間：<input id="closeTime" type="time"></div>
        </div>
        <div style="font-weight:900; margin-top:16px; margin-bottom:8px;">特定國定假日 / 系統公休日設定</div>
        <input id="closedDays" placeholder="例如：2026-07-05,2026-07-06">
        <div class="btn-row" style="margin-top: 14px;"><button class="btn done" onclick="saveSystemSchedule()">儲存時間與公休設定</button></div>
      </div>
      <div class="btn-row" style="margin-top: 18px;">
        <button class="btn done" style="background:#43a047;" onclick="setSystemManualMode('force_open')">手動強制開放點餐</button>
        <button class="btn danger" style="background:#e53935;" onclick="setSystemManualMode('force_closed')">手動強制關閉點餐（可填原因）</button>
        <button class="btn light" style="background:#0288d1; color:white;" onclick="setSystemManualMode('auto')">恢復自動模式</button>
      </div>
    </div>
  </section>
</div>

<div class="modal-bg" id="editModalBg">
  <div class="modal">
    <div class="section-title">編輯品項</div>
    <input type="hidden" id="editId">
    <div class="form-grid">
      <input id="editName" placeholder="品項名稱"><input id="editPrice" type="number" placeholder="價格">
      <input id="editCategory" placeholder="分類"><input id="editImage" placeholder="圖片">
      <input id="editSortOrder" type="number" placeholder="排序">
      <select id="editAfterMeal"><option value="false">不顯示餐後上</option><option value="true">顯示餐後上</option></select>
      <div class="time-lock-box">
        <label style="font-weight:800; display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="editTimeRestricted" onchange="toggleTimeInputs('edit')"> 啟用特定時間限制供應
        </label>
        <div id="editTimeInputs" style="display:none; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;">
          <div>開始供應：<input id="editStartTime" type="time"></div>
          <div>結束供應：<input id="editEndTime" type="time"></div>
        </div>
      </div>
      <textarea id="editNote" placeholder="品項備註"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn primary" onclick="saveEditMenu()">儲存修改</button>
      <button class="btn light" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="counterItemModalBg">
  <div class="modal">
    <div class="section-title" id="counterItemTitle">選擇品項</div>
    <div id="counterOptionArea"></div>
    <div class="form-grid" style="margin-top:12px;">
      <button class="btn light" onclick="counterChangeQty(-1)">−</button><input id="counterItemQty" type="number" value="1">
      <button class="btn light" onclick="counterChangeQty(1)">＋</button>
      <button class="btn primary" onclick="addCounterItemToCart()">加入購物車</button>
    </div>
    <div class="btn-row"><button class="btn light" onclick="closeCounterItemModal()">取消</button></div>
  </div>
</div>

<div class="modal-bg" id="cafeSignModalBg">
  <div class="modal" style="max-width: 500px;">
    <div class="section-title">住戶點餐明細確認</div>
    <div id="cafeSignSummary" class="setting-status" style="margin-bottom: 12px; line-height:1.6;"></div>
    <canvas id="cafeSigCanvas" class="sig-canvas" width="450" height="180"></canvas>
    <div class="btn-row">
      <button class="btn primary done" onclick="confirmCounterOrderWithSignature()">確認送出訂單</button>
      <button class="btn light" onclick="clearCafeSignature()">清除重簽</button>
      <button class="btn danger" onclick="closeCafeSignModal()">返回修改</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore,collection,getDocs,addDoc,doc,updateDoc,onSnapshot,query,orderBy,setDoc,where } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",authDomain:"zonghengcafe.firebaseapp.com",projectId:"zonghengcafe",storageBucket:"zonghengcafe.firebasestorage.app",messagingSenderId:"207027108121",appId:"1:207027108121:web:e7a39e19982ed77f9aed88",measurementId:"G-8ZE4SE2T7T"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);

let menuCache=[]; let categoryCache=[]; let newOptionGroups=[]; let editOptionGroups=[]; let knownOrderIds=new Set();
let cafeProfile=null; let counterResident=null; let counterBalanceDocId=null; let counterGranted=0, counterStored=0;
let counterCart=[]; let counterCurrentItem=null; let currentCounterCategory="全部"; let ordersUnsubscribe=null;
let cafeCanvas, cafeCtx, cafeIsDrawing = false; let soundEnabled = true; let isInitialLoad = true;

function playPremiumCrystalSound() {
  if (!soundEnabled) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return; const ctx = new AudioContext();
    const frequencies = [523.25, 659.25]; const now = ctx.currentTime;
    frequencies.forEach(freq => {
      const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 1.2);
    });
  } catch (e) { console.error(e); }
}

// 🚀 修正：為卡片右上角狀態標籤動態指派對應的外框顏色 CSS Class
function getBadgeStatusClass(status) {
  if (status === "等待接單") return "wait";
  if (status === "製作中") return "making";
  if (status === "已完成") return "done";
  if (status === "已取消") return "cancel";
  return "";
}

window.toggleTimeInputs = (prefix) => {
  const checkbox = document.getElementById(`${prefix}TimeRestricted`); const div = document.getElementById(`${prefix}TimeInputs`);
  if (checkbox && div) { div.style.display = checkbox.checked ? "grid" : "none"; }
};

onAuthStateChanged(auth,async user=>{
  if(!user){location.href="index.html";return}
  const raw=localStorage.getItem("zh_user"); if(!raw){location.href="index.html";return}
  cafeProfile=JSON.parse(raw); listenSettings(); listenOrders(); await loadMenu(); await loadSeatsForCounter(); initCafeSignatureCanvas();
});

window.showTab=(tab,btn)=>{
  ordersTab.classList.add("hidden"); menuTab.classList.add("hidden"); counterTab.classList.add("hidden"); settingsTab.classList.add("hidden");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); btn.classList.add("active");
  document.getElementById(tab+"Tab").classList.remove("hidden"); if(tab === "counter"){ renderCounterMenu(); renderCounterCart(); }
};

function formatItems(items){
  return items.map(x=>{
    const optHtml = x.options ? Object.entries(x.options).map(([k,v])=>`<div class="item-detail">${k}：${v}</div>`).join("") : "";
    return `<div class="order-item"><div class="item-name">${x.name} × ${x.qty}</div>${optHtml}<div class="item-detail">備註：${x.note||"無"}</div></div>`;
  }).join("");
}

function listenOrders(){
  if(ordersUnsubscribe) ordersUnsubscribe();
  ordersUnsubscribe=onSnapshot(query(collection(db,"orders"),orderBy("created_at","desc")),snap=>{
    waitingOrders.innerHTML=""; makingOrders.innerHTML=""; doneOrders.innerHTML=""; if(snap.empty) { isInitialLoad = false; return; }
    let hasNewIncomingOrder = false;
    snap.forEach(d=>{
      const o=d.data(); const status=o.status||"等待接單";
      if(status === "等待接單" && !knownOrderIds.has(d.id)){ if(!isInitialLoad){ hasNewIncomingOrder = true; } knownOrderIds.add(d.id); } else { knownOrderIds.add(d.id); }
      const sigHtml = o.counter_signature ? `<div class="meta" style="margin-top:6px;">住戶簽名：<br><img src="${o.counter_signature}" style="width:120px; background:white; border:1px solid #eee; border-radius:6px; margin-top:2px;"></div>` : "";
      let btnHtml = "";
      if (status === "等待接單") {
        btnHtml = `<div class="btn-row"><button class="btn primary" onclick="updateOrder('${d.id}','製作中')">接單</button><button class="btn danger" onclick="updateOrder('${d.id}','已取消')">取消</button></div>`;
      } else if (status === "製作中") {
        btnHtml = `<div class="btn-row"><button class="btn done" onclick="updateOrder('${d.id}','已完成')">完成</button><button class="btn danger" onclick="updateOrder('${d.id}','已取消')">取消</button></div>`;
      }
      
      const div=document.createElement("div"); div.className="order-card";
      // 🚀 修正位置：這裡將右上角的圓角標籤與 getBadgeStatusClass 動態對接
      div.innerHTML=`<div class="order-head"><div><div class="order-id">${o.order_id||d.id}</div><div class="meta">住戶：${o.uid||""}</div><div class="meta">${o.dining_type||""}${o.seat?`｜座位：${o.seat}`:""}</div><div class="meta">金額：${o.total||0} 點</div>${sigHtml}</div><div class="badge ${getBadgeStatusClass(status)}">${status}</div></div>${formatItems(o.items||[])}${btnHtml}`;
      if(status === "等待接單") waitingOrders.appendChild(div); else if(status === "製作中") makingOrders.appendChild(div); else doneOrders.appendChild(div);
    });
    if(hasNewIncomingOrder){ playPremiumCrystalSound(); } isInitialLoad = false;
  });
}

window.updateOrder=async(id,status)=>{ await updateDoc(doc(db,"orders",id),{status,updated_at:new Date().toISOString()}); };

function listenSettings() {
  onSnapshot(doc(db, "settings", "cafe"), s => {
    if (!s.exists()) return; const data = s.data(); let modeText = "智慧自動控管中";
    if (data.manual_mode === "force_open") modeText = "強制手動開放中";
    if (data.manual_mode === "force_closed") modeText = `強制關閉中（原因：${data.closed_reason || '未說明'}）`;
    if (data.manual_mode === "auto") modeText = "智慧自動控管中";
    systemStatus.innerHTML = `<b>目前系統模式：</b>${modeText}<br><b>自動供應時間：</b>${data.open_time || "08:30"} – ${data.close_time || "19:00"}<br><b>公休日期清單：</b>${data.closed_days || "未設定"}`;
    document.getElementById("openTime").value = data.open_time || "08:30"; document.getElementById("closeTime").value = data.close_time || "19:00"; document.getElementById("closedDays").value = data.closed_days || "";
  });
}

window.saveSystemSchedule = async () => {
  const openTime = document.getElementById("openTime").value; const closeTime = document.getElementById("closeTime").value; const closedDays = document.getElementById("closedDays").value.trim();
  await setDoc(doc(db, "settings", "cafe"), { open_time: openTime, close_time: closeTime, closed_days: closedDays }, { merge: true }); alert("設定成功！");
};

window.setSystemManualMode = async (mode) => {
  let reason = ""; if (mode === "force_closed") { reason = prompt("請輸入暫停原因：", "設備維修維護中"); if (reason === null) return; }
  await setDoc(doc(db, "settings", "cafe"), { manual_mode: mode, closed_reason: reason || "" }, { merge: true }); alert("切換成功！");
};

window.addMenu=async()=>{
  const name=mName.value.trim(); const price=Number(mPrice.value); const category=(mCategory.value||mCategorySelect.value).trim(); const isTimeRestricted = document.getElementById("mTimeRestricted").checked;
  await addDoc(collection(db,"menu"),{ name, price, category, enabled:true, custom_options:[], is_time_restricted: isTimeRestricted, start_time: isTimeRestricted ? mStartTime.value : "09:00", end_time: isTimeRestricted ? mEndTime.value : "17:00", created_at:new Date().toISOString() });
  mName.value=""; mPrice.value=""; mCategory.value=""; alert("新增成功"); await loadMenu();
};

async function loadMenu(){
  const snap=await getDocs(collection(db,"menu")); menuCache=[]; categoryCache=[]; menuList.innerHTML="";
  snap.forEach(d=>{ const m = {id:d.id,...d.data()}; menuCache.push(m); if(m.category && !categoryCache.includes(m.category)) categoryCache.push(m.category); });
  menuCache.forEach(m=>{
    const row=document.createElement("div"); row.className="menu-row";
    row.innerHTML=`<img class="menu-img" src="${m.image || 'logo.png'}"><div><div class="menu-name">${m.name||""}</div><div class="menu-meta">${m.price||0} 點｜${m.enabled===false?"暫停供應":"供應中"}</div></div><div class="btn-row"><button class="btn light" onclick="window.openEditMenu('${m.id}')">編輯</button><button class="btn danger" onclick="toggleMenu('${m.id}',${m.enabled!==false})">${m.enabled===false?"恢復":"暫停"}</button></div>`;
    menuList.appendChild(row);
  });
  renderCategorySelects();
}

window.closeEditModal=()=>editModalBg.style.display="none";
window.saveEditMenu=async()=>{
  await updateDoc(doc(db,"menu",editId.value),{ name:editName.value.trim(), price:Number(editPrice.value), category:editCategory.value.trim() });
  editModalBg.style.display="none"; alert("更新成功"); await loadMenu();
};
window.toggleMenu=async(id,enabled)=>{ await updateDoc(doc(db,"menu",id),{enabled:!enabled}); await loadMenu(); };
window.loadCounterResident=async()=>{
  const snap=await getDocs(query(collection(db,"balances"),where("uid","==",counterResidentInput.value.trim())));
  if(!snap.empty){ const b=snap.docs[0]; counterBalanceDocId=b.id; counterGranted=Number(b.data().granted_amount||0); counterStored=Number(b.data().stored_amount||0); counterResident={username:counterResidentInput.value.trim()}; counterResidentInfo.innerHTML=`帳號：${counterResident.username} ｜ 總點數：${counterGranted+counterStored}`; }
};
function renderCategorySelects(){ const f = document.getElementById("counterCategoryFilter"); if(f) { f.innerHTML = `<option value="全部">全部分類</option>`; categoryCache.forEach(c=>{ f.innerHTML += `<option value="${c}">${c}</option>`; }); } }
window.changeCounterCategory=(c)=>{ currentCounterCategory=c; renderCounterMenu(); };
function renderCounterMenu(){
  const box=document.getElementById("counterMenuList"); box.innerHTML=""; let list = menuCache.filter(x=>x.enabled!==false); if(currentCounterCategory !== "全部") { list = list.filter(x=>x.category === currentCounterCategory); }
  list.forEach(m=>{
    const row=document.createElement("div"); row.className="counter-menu-row"; row.innerHTML=`<img class="counter-mini-img" src="${m.image || 'logo.png'}"><div><div class="menu-name">${m.name}</div><div class="menu-meta">${m.price}點</div></div><button class="btn primary" onclick="openCounterItemModal('${m.id}')" style="padding:8px 14px;min-width:60px;">加入</button></div>`; box.appendChild(row);
  });
}
window.openCounterItemModal=(id)=>{ counterCurrentItem=menuCache.find(x=>x.id===id); counterItemTitle.innerText=counterCurrentItem.name; counterItemQty.value=1; counterItemModalBg.style.display="flex"; };
window.closeCounterItemModal=()=>counterItemModalBg.style.display="none";
window.addCounterItemToCart=()=>{ counterCart.push({id:counterCurrentItem.id,name:counterCurrentItem.name,price:Number(counterCurrentItem.price||0),qty:Number(counterItemQty.value||1),options:{}}); closeCounterItemModal(); renderCounterCart(); };
function renderCounterCart(){
  const box=document.getElementById("counterCartList"); box.innerHTML=""; let total=0;
  counterCart.forEach((item,idx)=>{ total+=item.price*item.qty; box.innerHTML+=`<div class="counter-cart-item">${item.name} × ${item.qty} <button class="small-btn danger" onclick="counterCart.splice(${idx},1);renderCounterCart();">刪除</button></div>`; });
  counterTotal.innerText=`${total} 點`;
}
initCafeSignatureCanvas();
function initCafeSignatureCanvas(){
  cafeCanvas=document.getElementById("cafeSigCanvas"); if(!cafeCanvas)return; cafeCtx=cafeCanvas.getContext("2d"); cafeCtx.strokeStyle="#5f574f"; cafeCtx.lineWidth=3; cafeCtx.lineCap="round";
  cafeCanvas.addEventListener("mousedown",(e)=>{ cafeIsDrawing=true; cafeCtx.beginPath(); const rect=cafeCanvas.getBoundingClientRect(); cafeCtx.moveTo(e.clientX-rect.left,e.clientY-rect.top); });
  cafeCanvas.addEventListener("mousemove",(e)=>{ if(!cafeIsDrawing)return; const rect=cafeCanvas.getBoundingClientRect(); cafeCtx.lineTo(e.clientX-rect.left,e.clientY-rect.top); cafeCtx.stroke(); });
  cafeCanvas.addEventListener("mouseup",()=>cafeIsDrawing=false);
}
window.clearCafeSignature=()=>cafeCtx.clearRect(0,0,cafeCanvas.width,cafeCanvas.height);
window.closeCafeSignModal=()=>document.getElementById("cafeSignModalBg").style.display="none";
window.prepareCounterSign=()=>{ const total=counterCart.reduce((s,x)=>s+x.price*x.qty,0); cafeSignSummary.innerHTML=`住戶：${counterResident.username}｜總計：${total}點`; clearCafeSignature(); cafeSignModalBg.style.display="flex"; };
window.confirmCounterOrderWithSignature=async()=>{
  const total=counterCart.reduce((s,x)=>s+x.price*x.qty,0); await addDoc(collection(db,"orders"),{ order_id:"ZH"+Date.now(), uid:counterResident.username, items:counterCart, total, status:"等待接單", counter_signature:cafeCanvas.toDataURL("image/png"), created_at:new Date().toISOString() });
  await updateDoc(doc(db,"balances",counterBalanceDocId),{granted_amount:counterGranted-total}); alert("代客點餐送出成功！"); counterCart=[]; renderCounterCart(); closeCafeSignModal();
};
window.toggleCounterSeat=()=>{}; window.counterChangeQty=(n)=>{ let q=Number(counterItemQty.value||1); q=Math.max(1,q+n); counterItemQty.value=q; }; window.clearCounterCart=()=>{ counterCart=[]; renderCounterCart(); };
logoutBtn.addEventListener("click",async()=>{ await signOut(auth); localStorage.removeItem("zh_user"); location.href="index.html"; });
</script>
