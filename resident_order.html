<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>住戶點餐｜咖啡廳點餐系統</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9c8e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="社區cafe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="logo.png">

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f;padding-bottom:140px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.74);backdrop-filter:blur(5px);z-index:-1}

.sticky-top-group{position:sticky;top:0;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,0.06);transition:box-shadow 0.3s ease}
.header{height:72px;background:rgba(255,255,255,.95);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.brand img{width:72px;opacity:.85;transition:transform 0.3s ease}
.back-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:12px;padding:8px 14px;font-weight:800;text-decoration:none;font-size:15px;transition:all 0.2s ease}
.back-btn:active{transform:scale(0.94);background:#f5f1eb}

.category-nav{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;background:rgba(255,255,255,.95);border-bottom:1px solid #eee5dd;scrollbar-width:none;scroll-behavior:smooth}
.category-nav::-webkit-scrollbar{display:none}
.nav-item{flex-shrink:0;border:none;background:#f5f1eb;color:#6d6258;padding:8px 18px;border-radius:12px;font-weight:800;font-size:15px;white-space:nowrap;transition:all 0.3s cubic-bezier(0.16, 1, 0.3, 1)}
.nav-item.active{background:linear-gradient(135deg,#bcaea1,#9c8e81);color:white;transform:scale(1.03);box-shadow:0 4px 12px rgba(156,142,129,0.3)}

.container{max-width:760px;margin:16px auto;padding:0 14px}
.category-section{scroll-margin-top:140px;margin-bottom:28px}
.category-title{font-size:21px;color:#6d6258;font-weight:900;margin:24px 0 12px 4px;letter-spacing:1px}

/* 滑動卡片容器與底層指示 */
.menu-grid{display:grid;grid-template-columns:1fr;gap:14px}
.swipe-card-wrapper{position:relative;border-radius:14px;overflow:hidden;background:#ebe5df;box-shadow:0 4px 15px rgba(0,0,0,.04);touch-action:pan-y}
.swipe-bg-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:900;font-size:15px;color:white;border-radius:14px;pointer-events:none}
.swipe-bg-left{background:linear-gradient(90deg,#6b9e78,#8bbd98);justify-content:flex-start}
.swipe-bg-right{background:linear-gradient(90deg,#c5a059,#9c8e81);justify-content:flex-end}

.menu-card{position:relative;background:rgba(255,255,255,.96);border-radius:14px;padding:14px;display:grid;grid-template-columns:90px 1fr;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.03);border:1px solid rgba(230,224,218,.7);cursor:pointer;transform:translateX(0);transition:transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);user-select:none;will-change:transform}
.menu-card.disabled{cursor:not-allowed;opacity:0.65}
.menu-img{width:90px;height:90px;object-fit:cover;border-radius:12px;background:#eee;pointer-events:none}
.menu-info{display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.menu-name{font-size:19px;font-weight:900;color:#4a433d;display:flex;align-items:center;justify-content:space-between;gap:8px}
.menu-note{font-size:14px;color:#8c837a;line-height:1.4;margin:4px 0}
.menu-price{font-size:20px;font-weight:900;color:#7a594c;margin-top:6px}

.status-badge{font-size:13px;padding:4px 12px;border-radius:12px;font-weight:700;white-space:nowrap}
.status-badge.soldout{background:#fde8e6;color:#b3514a;border:1px solid #f9cbd7}
.status-badge.notime{background:#fff1d9;color:#9b681f;border:1px solid #ffe3be}

.bottom-cart-panel{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,0.98);border-top:1px solid #ddd5cc;box-shadow:0 -6px 25px rgba(0,0,0,0.08);z-index:90;backdrop-filter:blur(10px)}
.cart-summary-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:white}
.cart-item-name{font-weight:800;font-size:16px}
.cart-info-text{font-size:17px;font-weight:800;color:#5f574f}
.cart-info-text span{color:#7a594c;font-size:21px;transition:transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)}
.open-cart-btn{border:none;background:linear-gradient(135deg,#bcaea1,#9c8e81);color:white;border-radius:12px;padding:10px 20px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(156,142,129,0.25);transition:all 0.2s ease}
.open-cart-btn:active{transform:scale(0.95)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);z-index:150;display:none;align-items:flex-end;opacity:0;transition:opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1)}
.modal-overlay.show{opacity:1}
.bottom-option-slide{background:white;width:100%;border-top-left-radius:20px;border-top-right-radius:20px;padding:20px 18px 30px;max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,0.15);transform:translateY(100%);transition:transform 0.38s cubic-bezier(0.16, 1, 0.3, 1)}
.modal-overlay.show .bottom-option-slide{transform:translateY(0)}

.checkout-title-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:12px}
.checkout-main-title{font-size:19px;font-weight:900;color:#554d46}
.beautiful-close-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:12px;padding:6px 14px;font-weight:800;font-size:14px;cursor:pointer;transition:all 0.2s ease}
.beautiful-close-btn:active{transform:scale(0.92)}

.option-title{font-size:15px;font-weight:800;color:#6d6258;margin-top:4px}
select,textarea{width:100%;border:none;background:#f5f1eb;border-radius:12px;padding:12px;font-size:15px;outline:none;color:#5f574f;transition:all 0.2s ease}
select:focus,textarea:focus{background:#ece5dc}
textarea{height:60px;resize:none}
.qty-row{display:grid;grid-template-columns:50px 1fr 50px;gap:12px;align-items:center;margin:8px 0;text-align:center}
.qty-btn{border:none;background:#eaddd3;color:#5f574f;font-size:20px;font-weight:900;height:42px;border-radius:12px;transition:all 0.15s ease}
.qty-btn:active{transform:scale(0.92);background:#d5c5b8}
.qty-val{font-size:19px;font-weight:900}
.btn-primary-action{border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;color:white;background:linear-gradient(135deg,#7a6b60,#554d46);width:100%;box-shadow:0 6px 18px rgba(85,77,70,0.25);cursor:pointer;transition:all 0.2s ease}
.btn-primary-action:active{transform:scale(0.97)}

.bottom-checkout-slide{background:white;border-top:1px solid #ddd5cc;position:fixed;left:0;right:0;bottom:0;z-index:95;max-height:70vh;overflow-y:auto;padding:20px 18px 30px;display:none;flex-direction:column;gap:12px;box-shadow:0 -6px 25px rgba(0,0,0,0.12);transform:translateY(100%);transition:transform 0.38s cubic-bezier(0.16, 1, 0.3, 1)}
.bottom-checkout-slide.show{transform:translateY(0);display:flex}

.cart-item{background:#f8f5f1;border-radius:12px;padding:12px;position:relative;margin-bottom:8px;transition:transform 0.2s ease}
.cart-item-name{font-weight:800;font-size:16px}
.cart-item-meta{font-size:13px;color:#888;margin-top:2px}
.cart-item-price{font-weight:800;color:#7a594c;font-size:15px;margin-top:4px}
.cart-del{position:absolute;right:12px;top:12px;border:none;background:none;color:#c86b62;font-weight:bold;font-size:14px;cursor:pointer}
.status-banner{background:rgba(109,98,88,.95);color:white;border-radius:14px;padding:16px;text-align:center;font-size:15px;font-weight:bold;box-shadow:0 4px 15px rgba(0,0,0,0.06)}

/* 語音按鈕容器與引導氣泡 */
.voice-float-wrapper{position:fixed;right:18px;bottom:85px;z-index:85;display:flex;flex-direction:column;align-items:flex-end}
.voice-tooltip{position:absolute;bottom:68px;right:0;background:rgba(85,77,70,0.95);backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:800;padding:8px 14px;border-radius:16px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,0.18);opacity:0;transform:translateY(8px) scale(0.92);transition:opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);pointer-events:none}
.voice-tooltip::after{content:"";position:absolute;bottom:-6px;right:22px;border-width:6px 6px 0;border-style:solid;border-color:rgba(85,77,70,0.95) transparent transparent}
.voice-tooltip.show{opacity:1;transform:translateY(0) scale(1)}

.voice-float-btn{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#7a6b60,#554d46);color:white;border:none;box-shadow:0 6px 20px rgba(0,0,0,0.22);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),box-shadow 0.2s ease}
.voice-float-btn:active{transform:scale(0.92)}
.voice-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1)}
.voice-modal-overlay.show{opacity:1}
.voice-box{background:white;width:100%;max-width:360px;border-radius:22px;padding:24px 20px;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,0.2);transform:scale(0.9);transition:transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)}
.voice-modal-overlay.show .voice-box{transform:scale(1)}
.voice-wave{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:#f0e8df;display:flex;align-items:center;justify-content:center;color:#6d6258;transition:background 0.25s ease}
.voice-wave.listening{animation:pulse-wave 1.2s infinite;background:#eaddd3}
.voice-wave.paused{background:#f0ede8;color:#9b9288;animation:none}
@keyframes pulse-wave{0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(109,98,88,0.4)}70%{transform:scale(1.08);box-shadow:0 0 0 16px rgba(109,98,88,0)}100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(109,98,88,0)}}
.voice-text-preview{font-size:14.5px;color:#554d46;min-height:56px;max-height:120px;overflow-y:auto;margin:12px 0;line-height:1.5;background:#f8f5f1;border-radius:12px;padding:10px 12px;text-align:left;word-break:break-all}

.voice-btn-group{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px;margin-top:14px}
.voice-action-btn{border-radius:12px;padding:10px 0;font-weight:800;font-size:14px;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;transition:all 0.2s ease}
.voice-btn-cancel{background:white;border:1px solid #c9c0b7;color:#6d6258}
.voice-btn-pause{background:#f5f1eb;border:1px solid #d8cfc4;color:#6d6258}
.voice-btn-submit{background:#6d6258;color:white}
.voice-action-btn:active{transform:scale(0.94)}

/* ☕ 極簡精品咖啡手寫卡片風格 (去 AI 味) */
.fortune-modal-overlay{position:fixed;inset:0;background:rgba(35,30,26,0.58);backdrop-filter:blur(8px);z-index:300;display:none;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1)}
.fortune-modal-overlay.show{opacity:1}
.fortune-card{background:#faf8f5;border-radius:20px;padding:26px 22px 22px;width:100%;max-width:340px;box-shadow:0 18px 45px rgba(0,0,0,0.2);transform:scale(0.92) translateY(10px);transition:transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);border:1px solid #eae3db;display:flex;flex-direction:column}
.fortune-modal-overlay.show .fortune-card{transform:scale(1) translateY(0)}
.fortune-badge-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fortune-status-text{font-size:13px;font-weight:800;color:#6d6258;display:flex;align-items:center;gap:6px}
.fortune-status-dot{width:7px;height:7px;border-radius:50%;background:#7ba382;display:inline-block}
.fortune-time-tag{font-size:12px;color:#a89d92;font-weight:600}
.fortune-main-msg{font-size:19px;font-weight:900;color:#3f3833;margin-bottom:4px;letter-spacing:0.5px}
.fortune-order-info{font-size:13px;color:#8c8278;margin-bottom:18px;line-height:1.4}
.fortune-note-paper{background:#ffffff;border:1px solid #eee7df;border-radius:14px;padding:16px 14px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.fortune-quote-text{font-size:15px;line-height:1.6;color:#4a433d;font-weight:600;letter-spacing:0.2px}
.fortune-btn{background:#554d46;color:#fff;border:none;border-radius:12px;padding:12px;width:100%;font-size:15px;font-weight:800;cursor:pointer;transition:all 0.2s ease}
.fortune-btn:active{transform:scale(0.97);background:#423b35}
</style>
</head>

<body>

<div id="printKitchenReceiptContainer" style="display: none;"></div>

<div class="sticky-top-group">
  <div class="header">
    <div class="brand"><img src="logo.png"></div>
    <a href="resident.html" class="back-btn">返回首頁</a>
  </div>
  <div class="category-nav" id="categoryNav">正在加載...</div>
</div>

<div class="container">
  <div id="menuContainer">正在加載菜單...</div>
</div>

<!-- 懸浮語音點餐按鈕區 -->
<div class="voice-float-wrapper">
  <div class="voice-tooltip" id="voiceTooltip">歡迎使用語音點餐功能</div>
  <button class="voice-float-btn" id="voiceTriggerBtn" onclick="window.startVoiceOrder()">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>
  </button>
</div>

<!-- 語音辨識互動視窗 -->
<div class="voice-modal-overlay" id="voiceModalOverlay">
  <div class="voice-box">
    <div class="voice-wave" id="voiceWaveIcon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
    </div>
    <div style="font-weight:900; font-size:17px; color:#554d46;" id="voiceStatusTitle">正在聆聽中...</div>
    <div class="voice-text-preview" id="voiceResultText">請說出餐點與規格（支援連講多句，語速快也能辨識）...</div>
    
    <div class="voice-btn-group">
      <button class="voice-action-btn voice-btn-cancel" onclick="window.cancelVoiceOrder()">取消</button>
      <button class="voice-action-btn voice-btn-pause" id="voicePauseBtn" onclick="window.togglePauseVoice()">暫停</button>
      <button class="voice-action-btn voice-btn-submit" id="voiceConfirmBtn" onclick="window.stopAndProcessVoice()">完成送出</button>
    </div>
  </div>
</div>

<!-- 餐點規格彈窗 -->
<div class="modal-overlay" id="optionModalOverlay" onclick="if(event.target===this)closeItemModal()">
  <div class="bottom-option-slide" onclick="event.stopPropagation()">
    <div class="checkout-title-row">
      <div class="checkout-main-title" id="modalItemName">餐點規格</div>
      <button class="beautiful-close-btn" onclick="closeItemModal()">取消 ✕</button>
    </div>
    <div id="optionArea"></div>
    <div class="option-title">備註說明</div>
    <textarea id="itemNote" placeholder="去冰/半糖，可空白"></textarea>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <div class="qty-val" id="qtyVal">1</div>
      <button class="qty-btn" onclick="changeQty(1)">＋</button>
    </div>
    <button class="btn-primary-action" onclick="addItemToCart()">確認加入購物車</button>
  </div>
</div>

<!-- 購物車滑出清單 -->
<div class="bottom-checkout-slide" id="bottomCheckoutSlide" onclick="event.stopPropagation()">
  <div class="checkout-title-row">
    <div class="checkout-main-title">確認購物車餐點</div>
    <button class="beautiful-close-btn" onclick="closeCart()">返回點餐</button>
  </div>
  <div id="cartListArea"></div>
  <div class="option-title">取餐方式</div>
  <select id="diningType" onchange="window.toggleSeatSelect()">
    <option value="外帶">外帶</option>
    <option value="內用">內用</option>
  </select>
  <div id="seatArea" style="display:none;">
    <div class="option-title">選擇座位號碼</div>
    <select id="seatSelect"></select>
  </div>
  <button class="btn-primary-action" id="submitOrderBtn" style="margin-top:6px;">送出訂單</button>
</div>

<!-- 底部常駐購物車條 -->
<div class="bottom-cart-panel">
  <div class="cart-summary-row">
    <div class="cart-info-text">已選擇 <span id="cartCount">0</span> 項商品，共 <span id="cartTotalText">0</span> 點</div>
    <button class="open-cart-btn" onclick="openCart()">查看購物車 ></button>
  </div>
</div>

<!-- ☕ 精品手寫小卡風格彈窗 -->
<div class="fortune-modal-overlay" id="fortuneModalOverlay">
  <div class="fortune-card">
    <div class="fortune-badge-row">
      <div class="fortune-status-text"><span class="fortune-status-dot"></span> 吧台製作中</div>
      <div class="fortune-time-tag" id="fortuneTimeLabel">晨間隨筆</div>
    </div>
    <div class="fortune-main-msg">點餐已收到</div>
    <div class="fortune-order-info" id="fortuneOrderInfo">外帶 · 請留意吧台叫號</div>
    
    <div class="fortune-note-paper">
      <div class="fortune-quote-text" id="fortuneQuoteText">今天也辛苦了，先喝口咖啡喘口氣吧。</div>
    </div>
    
    <button class="fortune-btn" onclick="window.location.href='resident.html'">好的，回首頁</button>
  </div>
</div>

<script type="module">

const timeAdaptiveQuotes = {

function getTaipeiTimeInMinutes() { const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"})); return now.getHours() * 60 + now.getMinutes(); }
function getTaipeiDateString() { const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"})); return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`; }
function timeStringToMinutes(t) { if(!t)return 0; const p=t.split(":"); return Number(p[0]||0)*60+Number(p[1]||0); }

function triggerHaptic() {
  if (navigator.vibrate) {

}

async function loadMenuData() {
  const snap = await getDocs(collection(db, "menu")); 
  menuList = []; 
  let rawCategories = [];
  
  snap.forEach(d => { 
    const m = {id:d.id,...d.data()}; 
    menuList.push(m); 
    if (m.category && !rawCategories.includes(m.category)) {
      rawCategories.push(m.category);
    }
  });
  
  menuList.sort((a,b)=>Number(a.sort_order||999)-Number(b.sort_order||999));
  
  try {
    const orderDoc = await getDoc(doc(db, "settings", "categories_order"));
    if (orderDoc.exists() && orderDoc.data().order_list) {
      const savedOrder = orderDoc.data().order_list;
      categoryCache = savedOrder.filter(c => rawCategories.includes(c));
      rawCategories.forEach(c => { if (!categoryCache.includes(c)) categoryCache.push(c); });
    } else {
      categoryCache = rawCategories;
    }
  } catch (e) {
    console.error("讀取分類自訂順序失敗:", e);
    categoryCache = rawCategories;
  }
  
  renderCategoryNav(); renderMenu();
}

function renderCategoryNav() {
  const nav = document.getElementById("categoryNav"); nav.innerHTML = "";
  categoryCache.forEach((cat, idx) => {
    const btn = document.createElement("button"); 
    btn.className = `nav-item ${idx === 0 ? 'active' : ''}`; 
    btn.id = `cat_nav_${idx}`;
    btn.innerText = cat;
    btn.onclick = () => {
      isManualScrolling = true;
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active")); 
      btn.classList.add("active");
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      
      const target = document.getElementById(`cat_sec_${idx}`); 
      if(target) {
        target.scrollIntoView({ behavior: 'smooth' });
        setTimeout(() => { isManualScrolling = false; }, 800);
      }
    };
    nav.appendChild(btn);
  });
}

function attachSwipeEvents(elem, item) {
  let startX = 0, startY = 0, currentX = 0, isTouching = false, isHorizontal = null;
  const threshold = 68;

  elem.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    currentX = startX;
    isTouching = true;
    isHorizontal = null;
    elem.style.transition = "none";
  }, { passive: true });

  elem.addEventListener("touchmove", (e) => {
    if (!isTouching) return;
    const touchX = e.touches[0].clientX;
    const touchY = e.touches[0].clientY;
    const diffX = touchX - startX;
    const diffY = touchY - startY;

    if (isHorizontal === null) {
      if (Math.abs(diffX) > 7 || Math.abs(diffY) > 7) {
        isHorizontal = Math.abs(diffX) > Math.abs(diffY);
      }
    }

    if (isHorizontal) {
      currentX = touchX;
      const damping = 0.55;
      const transX = diffX * damping;
      elem.style.transform = `translateX(${transX}px)`;
    }
  }, { passive: true });

  const handleTouchEnd = (e) => {
    if (!isTouching) return;
    isTouching = false;
    const diffX = currentX - startX;

    elem.style.transition = "transform 0.38s cubic-bezier(0.16, 1, 0.3, 1)";
    elem.style.transform = "translateX(0)";

    if (isHorizontal) {
      if (diffX > threshold) {
        quickAddDefaultItem(item);
      } else if (diffX < -threshold) {
        triggerHaptic();
        window.openItemModal(item.id);
      }
    } else if (Math.abs(diffX) < 8 && (isHorizontal === null || !isHorizontal)) {
      window.openItemModal(item.id);
    }
  };

  elem.addEventListener("touchend", handleTouchEnd);
  elem.addEventListener("touchcancel", handleTouchEnd);

  elem.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!isHorizontal) {
      window.openItemModal(item.id);
    }
  });
}

function quickAddDefaultItem(item) {

  });

  cart.push({
    id: item.id,

    price: item.price,
    qty: 1,
    options: defaultOptions,
    note: ""
  });

  updateCartSummary();

    countSpan.style.transform = "scale(1.35)";

  }
}

function initScrollSpy() {
  const sections = document.querySelectorAll(".category-section");
  if (!sections.length) return;

  const observerOptions = {
    root: null,
    rootMargin: "-20% 0px -70% 0px",
    threshold: 0
  };

  sectionObserver = new IntersectionObserver((entries) => {
    if (isManualScrolling) return;
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = entry.target.getAttribute("data-index");
        const activeNavBtn = document.getElementById(`cat_nav_${idx}`);
        if (activeNavBtn) {
          document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
          activeNavBtn.classList.add("active");
          activeNavBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }
    });
  }, observerOptions);

  sections.forEach(sec => sectionObserver.observe(sec));
}

// ☕ 真實自然的時段小語抽籤
function getSmartFortuneQuote() {
  const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
  const hour = now.getHours();
  let timeKey = "morning";
  let timeLabel = "晨間隨筆";

  if (hour >= 5 && hour < 11.5) {
    timeKey = "morning";
    timeLabel = "晨間隨筆";
  } else if (hour >= 11.5 && hour < 14) {
    timeKey = "noon";
    timeLabel = "午間時光";
  } else if (hour >= 14 && hour < 18) {
    timeKey = "afternoon";
    timeLabel = "午後微憩";
  } else {
    timeKey = "night";
    timeLabel = "晚間溫馨";
  }

  const pool = timeAdaptiveQuotes[timeKey];
  
  let history = [];
  try {
    history = JSON.parse(localStorage.getItem("zh_fortune_history") || "[]");
  } catch(e) {}

  let availablePool = pool.filter(q => !history.includes(q));
  if (availablePool.length === 0) {
    availablePool = pool;
    history = [];
  }

  const selectedQuote = availablePool[Math.floor(Math.random() * availablePool.length)];

  history.push(selectedQuote);
  if (history.length > 20) history.shift();
  try {
    localStorage.setItem("zh_fortune_history", JSON.stringify(history));
  } catch(e) {}

  return { quote: selectedQuote, timeLabel };
}

// 🚀 多品項自然語言點餐引擎 (語音串流絕對去重)
// ==========================================
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("您的裝置不支援語音辨識，請使用最新版 Safari 或 Chrome 開啟！");
    return null;
  }
  const rec = new SpeechRecognition();
  rec.lang = "zh-TW";
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = (event) => {
    let interimText = "";
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      const transcript = event.results[i][0].transcript.trim();
      if (event.results[i].isFinal) {
        if (transcript && (finalSentencesArray.length === 0 || finalSentencesArray[finalSentencesArray.length - 1] !== transcript)) {
          finalSentencesArray.push(transcript);
        }
      } else {
        interimText += transcript;
      }
    }
    currentInterimText = interimText;
    const displayText = (finalSentencesArray.join(" ") + " " + interimText).trim();
    if (displayText) {
      document.getElementById("voiceResultText").innerText = displayText;
    }
  };

  rec.onend = () => {
    if (!isExplicitStopped && !isUserPaused) {
      try {
        rec.start();
      } catch (e) {}
    }
  };

  rec.onerror = (event) => {
    console.warn("語音辨識提示:", event.error);
    if (event.error === "no-speech" && !isExplicitStopped && !isUserPaused) {
      try { rec.start(); } catch (e) {}
    }
  };

  return rec;
}

  document.getElementById("voiceStatusTitle").innerText = "正在聆聽中...";

  }
};

window.togglePauseVoice = () => {
  if (!recognition) return;
  triggerHaptic();
  const pauseBtn = document.getElementById("voicePauseBtn");
  const waveIcon = document.getElementById("voiceWaveIcon");
  const statusTitle = document.getElementById("voiceStatusTitle");

  if (!isUserPaused) {
    isUserPaused = true;
    try { recognition.stop(); } catch(e) {}
    waveIcon.className = "voice-wave paused";
    statusTitle.innerText = "已暫停聆聽";
    pauseBtn.innerText = "繼續";
  } else {
    isUserPaused = false;
    waveIcon.className = "voice-wave listening";
    statusTitle.innerText = "正在聆聽中...";
    pauseBtn.innerText = "暫停";
    try { recognition.start(); } catch(e) {}
  }
};

window.cancelVoiceOrder = () => {
  triggerHaptic();
  isExplicitStopped = true;
  isUserPaused = false;
  isSubmittingVoice = false;
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
  document.getElementById("voiceWaveIcon").className = "voice-wave";
  const overlay = document.getElementById("voiceModalOverlay");
  overlay.classList.remove("show");
  setTimeout(() => { overlay.style.display = "none"; }, 350);
};

window.stopAndProcessVoice = () => {
  if (isSubmittingVoice) return;
  isSubmittingVoice = true;

  triggerHaptic();
  isExplicitStopped = true;
  isUserPaused = false;
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
  document.getElementById("voiceWaveIcon").className = "voice-wave";
  document.getElementById("voiceConfirmBtn").disabled = true;
  
  const text = (finalSentencesArray.join(" ") + " " + currentInterimText).trim();
  if (!text || text.length < 2 || text.startsWith("請說出餐點")) {
    alert("尚未聽到您的點餐內容，請再試一次！");
    window.cancelVoiceOrder();
    return;
  }

  document.getElementById("voiceStatusTitle").innerText = "正在解析餐點、取餐方式與規格...";
  
  setTimeout(() => {
    const parseResult = parseVoiceOrderLocally(text, menuList);
    
    if (!parseResult.items || parseResult.items.length === 0) {
      alert("抱歉，系統未在菜單中找到您說的品項，請確認品項名稱或手動點餐！");
    } else {
      parseResult.items.forEach(item => cart.push(item));
      updateCartSummary();

      if (parseResult.diningType) {
        const diningSelect = document.getElementById("diningType");
        diningSelect.value = parseResult.diningType;
        window.toggleSeatSelect();
      }

      if (parseResult.seat) {
        const seatSelect = document.getElementById("seatSelect");
        if (seatSelect) {
          seatSelect.value = parseResult.seat;
        }
      }

      alert(`已成功加入 ${parseResult.items.length} 項商品！${parseResult.diningType ? `【${parseResult.diningType}${parseResult.seat ? ` ${parseResult.seat}桌` : ''}】` : ''}`);
      window.openCart();
    }
    const overlay = document.getElementById("voiceModalOverlay");
    overlay.classList.remove("show");
    setTimeout(() => { overlay.style.display = "none"; }, 350);
    isSubmittingVoice = false;
  }, 150);
};

function parseVoiceOrderLocally(rawUserText, currentMenu) {
  const availableItems = currentMenu.filter(m => m.enabled !== false);
  const numMap = { "一": 1, "二": 2, "兩": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10 };

  let userText = rawUserText
    .replace(/(多鮮|多先|多仙|多掀|多萱)/g, "多纖")
    .replace(/(負湯|負糖|副糖|付糖|服糖|父糖|附唐)/g, "附糖")
    .replace(/(冰淇淋|冰其林|冰奇淋|冰奇林)/g, "冰淇淋")
    .replace(/(那鐵|拿帖|拿田|那提)/g, "拿鐵")
    .replace(/(乃茶|奶察|奈茶)/g, "奶茶")
    .replace(/(鬆餅|宋餅|送餅)/g, "鬆餅")
    .replace(/(三明治|三明智)/g, "三明治")
    .replace(/(美式|每式|美士)/g, "美式")
    .replace(/(湯匙|湯匙兒|唐池|唐匙)/g, "湯匙")
    .replace(/(可可|顆顆|科科)/g, "可可")
    .replace(/(歐蕾|歐雷|歐累)/g, "歐蕾")
    .replace(/(抹茶|末茶|磨茶)/g, "抹茶")
    .replace(/(乳香|乳香世家|魯香)/g, "乳香世家");

  userText = userText.replace(/(\b.+?\b)(?:\s+\1)+/gi, "$1");

  let detectedDiningType = null;
  let detectedSeat = null;

  if (/(內用|在裡面吃|店內吃|內吃|現場吃|坐在|桌號|座位)/.test(userText)) {
    detectedDiningType = "內用";
  } else if (/(外帶|帶走|包回去|拿走|帶回家)/.test(userText)) {
    detectedDiningType = "外帶";
  }

  for (let s of staticSeats) {
    const regex = new RegExp(`(?:坐在|座位(?:是)?|桌號(?:是)?|桌|號)?\\s*(${s})\\b`, "i");
    if (regex.test(userText)) {
      detectedSeat = s;
      detectedDiningType = "內用";
      break;
    }
  }

  const cleanedMenu = availableItems.map(item => {
    const cleanName = item.name.replace(/[\(（\[【].*?[\)）\]】]/g, "").trim();
    return {
      rawItem: item,
      cleanName: cleanName || item.name.trim(),
      length: (cleanName || item.name.trim()).length
    };
  }).sort((a, b) => b.length - a.length);

  let occurrences = [];
  let matchedRanges = [];
  
  cleanedMenu.forEach(entry => {
    let pos = userText.indexOf(entry.cleanName);
    
    if (pos === -1 && entry.cleanName.length >= 3) {
      for (let i = 0; i <= userText.length - entry.cleanName.length; i++) {
        let sub = userText.substr(i, entry.cleanName.length);
        let matchCharCount = 0;
        for (let c of entry.cleanName) {
          if (sub.includes(c)) matchCharCount++;
        }
        if (matchCharCount / entry.cleanName.length >= 0.75) {
          pos = i;
          break;
        }
      }
    }

    while (pos !== -1) {
      const endPos = pos + entry.cleanName.length;
      const isOverlap = matchedRanges.some(r => {
        return (pos >= r.start && pos < r.end) || 
               (endPos > r.start && endPos <= r.end) || 
               (pos <= r.start && endPos >= r.end);
      });
      
      if (!isOverlap) {
        occurrences.push({ item: entry.rawItem, index: pos, length: entry.cleanName.length, name: entry.cleanName });
        matchedRanges.push({ start: pos, end: endPos });
      }
      pos = userText.indexOf(entry.cleanName, pos + 1);
    }
  });

  if (occurrences.length === 0) {
    return { items: [], diningType: detectedDiningType, seat: detectedSeat };
  }

  occurrences.sort((a, b) => a.index - b.index);

  let sanitizedOccurrences = [];
  for (let i = 0; i < occurrences.length; i++) {
    if (i > 0 && occurrences[i].item.id === occurrences[i-1].item.id) {
      const distance = occurrences[i].index - (occurrences[i-1].index + occurrences[i-1].length);
      if (distance <= 4) {
        continue;
      }
    }
    sanitizedOccurrences.push(occurrences[i]);
  }

  const finalItems = sanitizedOccurrences.map((occ, idx) => {
    const prevEnd = idx === 0 ? 0 : sanitizedOccurrences[idx - 1].index + sanitizedOccurrences[idx - 1].length;
    const nextStart = idx === sanitizedOccurrences.length - 1 ? userText.length : sanitizedOccurrences[idx + 1].index;
    
    const prefixSegment = userText.substring(prevEnd, occ.index);
    const suffixSegment = userText.substring(occ.index + occ.length, nextStart);
    const fullSegment = prefixSegment + " " + suffixSegment;

    let qty = 1;
    const qtyMatch = (prefixSegment + suffixSegment).match(/(\d+|[一二兩三四五六七八九十]+)\s*(杯|個|份|碗|盤|瓶|隻|顆|罐|支)?/);
    if (qtyMatch) {
      const qStr = qtyMatch[1];
      if (numMap[qStr]) qty = numMap[qStr];
      else if (!isNaN(parseInt(qStr))) qty = parseInt(qStr);
    }

    const selectedOptions = {};
    const usedOptionWords = [];

    (occ.item.custom_options || []).forEach(group => {
      let matchedChoice = null;
      const choices = (group.choices || []).map(c => c.trim());

      for (let c of choices) {
        if (c && fullSegment.includes(c)) {
          matchedChoice = c;
          usedOptionWords.push(c);
          break;
        }
      }

      if (!matchedChoice) {
        const groupTitle = group.title || "";
        const isSugarOption = groupTitle.includes("糖") || choices.some(c => c.includes("糖"));
        const isSpoonOption = groupTitle.includes("匙") || groupTitle.includes("餐具") || choices.some(c => c.includes("匙"));

        if (isSugarOption) {
          if (/(不要附糖|不附糖|免附糖|不用附糖|無糖|不要糖|不加糖|否)/.test(fullSegment)) {
            matchedChoice = choices.find(c => /(否|不要|不附|無|不加)/.test(c)) || choices[choices.length - 1];
            usedOptionWords.push("不要附糖", "不附糖", "無糖", "不要糖", "不加糖", "附糖");
          } else if (/(要附糖|附糖|加糖|有附糖|是)/.test(fullSegment)) {
            matchedChoice = choices.find(c => /(是|要|附糖|加)/.test(c)) || choices[0];
            usedOptionWords.push("要附糖", "附糖", "加糖");
          }
        } else if (isSpoonOption) {
          if (/(不要湯匙|不用湯匙|免湯匙|不附湯匙|否)/.test(fullSegment)) {
            matchedChoice = choices.find(c => /(否|不要|不附|無|不需要)/.test(c)) || choices[choices.length - 1];
            usedOptionWords.push("不要湯匙", "不用湯匙", "免湯匙", "湯匙");
          } else if (/(要湯匙|附湯匙|加湯匙|需要湯匙|是)/.test(fullSegment)) {
            matchedChoice = choices.find(c => /(是|要|附|需要)/.test(c)) || choices[0];
            usedOptionWords.push("要湯匙", "附湯匙", "湯匙");
          }
        } else if (/(不要|不用|別|免|不加|無)/.test(fullSegment)) {
          matchedChoice = choices.find(c => /(否|不要|不加|無|不需要|免)/.test(c));
        } else if (/(要|需要|加|帶)/.test(fullSegment)) {
          matchedChoice = choices.find(c => /(是|要|加|有|需要)/.test(c));
        }
      }

      selectedOptions[group.title] = matchedChoice || (choices[0] || "");
    });

    let note = "";
    const noteMatch = suffixSegment.match(/(?:幫我備註|請幫我備註|幫我註明|備註|註明)[:：\s]*(.*?)(?=\s*(然後|還有|再|下一個|一份|一個|兩杯|一杯|$))/);
    
    if (noteMatch && noteMatch[1]) {
      let rawNote = noteMatch[1].trim();
      usedOptionWords.forEach(w => {
        if (w) rawNote = rawNote.replaceAll(w, "");
      });
      rawNote = rawNote.replace(/(內用|外帶|坐在[A-Z0-9]+|桌號[A-Z0-9]+|座位[A-Z0-9]+|去冰|微冰|少冰|正常冰|熱|溫|半糖|微糖|無糖|全糖|不要糖|附糖|湯匙)/gi, "").trim();
      note = rawNote;
    }

    return {
      id: occ.item.id,
      name: occ.item.name,
      price: Number(occ.item.price || 0),
      qty,
      options: selectedOptions,
      note: note
    };
  });

  return {
    items: finalItems,
    diningType: detectedDiningType,
    seat: detectedSeat
  };
}
</script>
