<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>點餐首頁｜昭揚縱橫</title>

<style>
*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif
}

body{
  margin:0;
  background:url("bg.jpg") center center/cover fixed no-repeat;
  color:#5f574f;
  min-height:100vh;
  padding-bottom:120px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(5px);
  z-index:-1;
}

.header{
  height:72px;
  background:rgba(255,255,255,.88);
  border-bottom:1px solid #ddd5cc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:72px;
  opacity:.84;
}

.title{
  font-size:22px;
  font-weight:700;
  color:#6d6258;
  letter-spacing:2px;
}

.back-btn{
  border:none;
  background:#f5f1eb;
  color:#6d6258;
  border-radius:12px;
  padding:10px 16px;
  font-weight:700;
}

.container{
  max-width:1180px;
  margin:20px auto;
  padding:0 16px;
}

.category-row{
  display:flex;
  gap:10px;
  overflow:auto;
  margin-bottom:20px;
  padding-bottom:4px;
}

.category-btn{
  border:none;
  background:white;
  border-radius:999px;
  padding:10px 18px;
  white-space:nowrap;
  font-weight:700;
  color:#7a6b60;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}

.category-btn.active{
  background:linear-gradient(to bottom,#bcaea1,#9c8e81);
  color:white;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}

.menu-card{
  background:rgba(255,255,255,.92);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.menu-img{
  width:100%;
  height:210px;
  object-fit:cover;
  background:#eee;
}

.menu-body{
  padding:18px;
}

.menu-name{
  font-size:22px;
  font-weight:900;
  color:#5f574f;
}

.menu-price{
  font-size:18px;
  color:#9c8e81;
  margin-top:6px;
  font-weight:700;
}

.menu-note{
  margin-top:10px;
  color:#777;
  line-height:1.7;
  font-size:14px;
}

.option{
  margin-top:14px;
}

.option label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:700;
  color:#6d6258;
}

select,textarea,input{
  width:100%;
  border:none;
  background:#f5f1eb;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  outline:none;
  color:#5f574f;
}

textarea{
  resize:none;
  height:72px;
}

.qty-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:16px;
}

.qty-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.qty-btn{
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#9c8e81;
  color:white;
  font-size:18px;
}

.add-btn{
  border:none;
  border-radius:14px;
  background:#6d6258;
  color:white;
  padding:12px 18px;
  font-weight:800;
}

.cart-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  border-top:1px solid #ddd5cc;
  padding:14px 18px;
  z-index:20;
  box-shadow:0 -8px 22px rgba(0,0,0,.08);
}

.cart-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.cart-total{
  font-size:24px;
  font-weight:900;
  color:#6d6258;
}

.cart-count{
  color:#888;
}

.cart-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.cart-btn{
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  font-weight:800;
}

.primary{
  background:#6d6258;
  color:white;
}

.light{
  background:#f3eee8;
  color:#6d6258;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.36);
  backdrop-filter:blur(5px);
  display:none;
  align-items:flex-end;
  z-index:50;
}

.modal{
  background:white;
  width:100%;
  border-radius:28px 28px 0 0;
  padding:24px;
  max-height:90vh;
  overflow:auto;
}

.section-title{
  font-size:26px;
  font-weight:900;
  color:#6d6258;
  margin-bottom:18px;
}

.cart-item{
  background:#f8f5f1;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}

.cart-item-title{
  font-size:18px;
  font-weight:800;
}

.cart-item-detail{
  color:#777;
  line-height:1.7;
  margin-top:6px;
  font-size:14px;
}

.checkout-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.empty{
  text-align:center;
  padding:40px;
  color:#999;
}

@media(max-width:760px){

  .checkout-grid{
    grid-template-columns:1fr;
  }

  .brand img{
    width:58px;
  }

  .title{
    font-size:18px;
  }

}
</style>
</head>

<body>

<div class="header">
  <div class="brand">
    <img src="logo.png">
    <div class="title">點餐首頁</div>
  </div>

  <button class="back-btn" onclick="location.href='resident.html'">
    返回
  </button>
</div>

<div class="container">

  <div class="category-row" id="categoryRow"></div>

  <div class="menu-grid" id="menuGrid"></div>

</div>

<div class="cart-bar">

  <div class="cart-top">
    <div>
      <div class="cart-total" id="cartTotal">
        NT$ 0
      </div>

      <div class="cart-count" id="cartCount">
        0 件商品
      </div>
    </div>

    <button class="cart-btn light" onclick="openCart()">
      購物車
    </button>
  </div>

  <div class="cart-actions">
    <button class="cart-btn light" onclick="clearCart()">
      清空購物車
    </button>

    <button class="cart-btn primary" onclick="openCart()">
      前往結帳
    </button>
  </div>

</div>

<div class="modal-bg" id="cartModalBg">

  <div class="modal">

    <div class="section-title">
      購物車
    </div>

    <div id="cartList"></div>

    <div class="checkout-grid">

      <select id="diningType">
        <option value="內用">內用</option>
        <option value="外帶">外帶</option>
      </select>

      <select id="seatSelect">
        <option value="">請選擇座位</option>
      </select>

    </div>

    <div style="margin-top:18px;">
      <button
        class="cart-btn primary"
        style="width:100%;"
        onclick="submitOrder()">

        送出訂單

      </button>
    </div>

    <div style="margin-top:10px;">
      <button
        class="cart-btn light"
        style="width:100%;"
        onclick="closeCart()">

        關閉

      </button>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain:"zonghengcafe.firebaseapp.com",
  projectId:"zonghengcafe",
  storageBucket:"zonghengcafe.firebasestorage.app",
  messagingSenderId:"207027108121",
  appId:"1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId:"G-8ZE4SE2T7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let profile=null;
let menuCache=[];
let cart=[];
let currentCategory="全部";

onAuthStateChanged(auth,user=>{

  if(!user){
    location.href="index.html";
    return;
  }

  const raw=
  localStorage.getItem("zh_user");

  if(!raw){
    location.href="index.html";
    return;
  }

  profile=JSON.parse(raw);

  loadMenu();
  loadSeats();

});

async function loadSeats(){

  const snap=
  await getDocs(collection(db,"seats"));

  seatSelect.innerHTML=
  '<option value="">請選擇座位</option>';

  snap.forEach(d=>{

    const s=d.data();

    seatSelect.innerHTML+=`
      <option value="${s.name}">
        ${s.name}
      </option>
    `;

  });

}

async function loadMenu(){

  const snap=
  await getDocs(collection(db,"menu"));

  menuCache=[];

  snap.forEach(d=>{

    const m={
      id:d.id,
      ...d.data()
    };

    if(m.enabled===false) return;

    menuCache.push(m);

  });

  renderCategories();
  renderMenu();

}

function renderCategories(){

  const cats=[
    "全部",
    ...new Set(
      menuCache.map(x=>x.category)
    )
  ];

  categoryRow.innerHTML="";

  cats.forEach(c=>{

    categoryRow.innerHTML+=`

      <button
        class="category-btn ${currentCategory===c?"active":""}"
        onclick="changeCategory('${c}')">

        ${c}

      </button>

    `;

  });

}

window.changeCategory=(c)=>{

  currentCategory=c;

  renderCategories();
  renderMenu();

};

function renderMenu(){

  const list=
  currentCategory==="全部"
  ? menuCache
  : menuCache.filter(
      x=>x.category===currentCategory
    );

  if(!list.length){

    menuGrid.innerHTML=`
      <div class="empty">
        目前沒有品項
      </div>
    `;

    return;

  }

  menuGrid.innerHTML="";

  list.forEach(m=>{

    const div=document.createElement("div");

    div.className="menu-card";

    div.innerHTML=`

      <img
        class="menu-img"
        src="${m.image||''}">

      <div class="menu-body">

        <div class="menu-name">
          ${m.name}
        </div>

        <div class="menu-price">
          NT$ ${m.price}
        </div>

        <div class="menu-note">
          ${m.note||""}
        </div>

        ${
          m.ice_enabled!==false
          ? `
            <div class="option">
              <label>冰度</label>
              <select id="ice_${m.id}">
                <option>正常冰</option>
                <option>少冰</option>
                <option>微冰</option>
                <option>去冰</option>
              </select>
            </div>
          `
          : ""
        }

        ${
          m.sugar_enabled!==false
          ? `
            <div class="option">
              <label>糖度</label>
              <select id="sugar_${m.id}">
                <option>正常糖</option>
                <option>少糖</option>
                <option>半糖</option>
                <option>微糖</option>
                <option>無糖</option>
              </select>
            </div>
          `
          : ""
        }

        ${
          m.note_enabled!==false
          ? `
            <div class="option">
              <label>備註</label>
              <textarea id="note_${m.id}"></textarea>
            </div>
          `
          : ""
        }

        <div class="qty-row">

          <div class="qty-box">

            <button
              class="qty-btn"
              onclick="changeQty('${m.id}',-1)">
              −
            </button>

            <span id="qty_${m.id}">
              1
            </span>

            <button
              class="qty-btn"
              onclick="changeQty('${m.id}',1)">
              ＋
            </button>

          </div>

          <button
            class="add-btn"
            onclick="addToCart('${m.id}')">

            加入購物車

          </button>

        </div>

      </div>

    `;

    menuGrid.appendChild(div);

  });

}

window.changeQty=(id,diff)=>{

  const el=
  document.getElementById(`qty_${id}`);

  let q=
  Number(el.innerText);

  q+=diff;

  if(q<1) q=1;

  el.innerText=q;

};

window.addToCart=(id)=>{

  const m=
  menuCache.find(x=>x.id===id);

  if(!m) return;

  const qty=
  Number(
    document.getElementById(`qty_${id}`).innerText
  );

  const ice=
  m.ice_enabled!==false
  ? document.getElementById(`ice_${id}`).value
  : "";

  const sugar=
  m.sugar_enabled!==false
  ? document.getElementById(`sugar_${id}`).value
  : "";

  const note=
  m.note_enabled!==false
  ? document.getElementById(`note_${id}`).value
  : "";

  cart.push({
    id:m.id,
    name:m.name,
    price:m.price,
    qty,
    ice,
    sugar,
    note
  });

  updateCart();

  alert("已加入購物車");

};

function updateCart(){

  let total=0;
  let count=0;

  cart.forEach(x=>{

    total+=x.price*x.qty;
    count+=x.qty;

  });

  cartTotal.innerText=
  `NT$ ${total}`;

  cartCount.innerText=
  `${count} 件商品`;

}

window.clearCart=()=>{

  if(!confirm("確定清空購物車？"))
    return;

  cart=[];

  updateCart();

};

window.openCart=()=>{

  cartModalBg.style.display="flex";

  renderCart();

};

window.closeCart=()=>{

  cartModalBg.style.display="none";

};

function renderCart(){

  if(!cart.length){

    cartList.innerHTML=`
      <div class="empty">
        購物車是空的
      </div>
    `;

    return;

  }

  cartList.innerHTML="";

  cart.forEach((x,i)=>{

    cartList.innerHTML+=`

      <div class="cart-item">

        <div class="cart-item-title">
          ${x.name} × ${x.qty}
        </div>

        <div class="cart-item-detail">
          冰度：${x.ice||"無"}<br>
          糖度：${x.sugar||"無"}<br>
          備註：${x.note||"無"}
        </div>

        <div
          style="margin-top:10px;font-weight:800;">

          NT$ ${x.price*x.qty}

        </div>

        <div style="margin-top:10px;">

          <button
            class="cart-btn light"
            onclick="removeCart(${i})">

            刪除

          </button>

        </div>

      </div>

    `;

  });

}

window.removeCart=(i)=>{

  cart.splice(i,1);

  updateCart();
  renderCart();

};

window.submitOrder=async()=>{

  if(!cart.length){

    alert("購物車是空的");

    return;

  }

  const diningType=
  diningType.value;

  const seat=
  seatSelect.value;

  if(
    diningType==="內用" &&
    !seat
  ){

    alert("請選擇座位");

    return;

  }

  let total=0;

  cart.forEach(x=>{
    total+=x.price*x.qty;
  });

  const orderId=
  "ZH"+
  Date.now();

  await addDoc(
    collection(db,"orders"),
    {
      order_id:orderId,
      uid:profile.username,
      items:cart,
      total,
      dining_type:diningType,
      seat:seat||"",
      status:"等待接單",
      created_at:new Date().toISOString()
    }
  );

  alert("訂單已送出");

  cart=[];

  updateCart();

  closeCart();

};

cartModalBg.addEventListener("click",e=>{

  if(e.target===cartModalBg){

    closeCart();

  }

});

</script>

</body>
</html>
