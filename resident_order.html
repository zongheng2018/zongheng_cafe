<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住戶點餐｜昭揚縱橫 咖啡廳點餐系統</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9c8e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="縱橫點餐">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="logo.png">

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;min-height:100vh;background:url("bg.jpg") center center/cover fixed no-repeat;color:#5f574f;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.74);backdrop-filter:blur(5px);z-index:-1}
.header{height:72px;background:rgba(255,255,255,.9);border-bottom:1px solid #ddd5cc;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.brand img{width:72px;opacity:.85}
.back-btn{border:1px solid #c9c0b7;background:white;color:#6d6258;border-radius:10px;padding:8px 14px;font-weight:800;text-decoration:none;font-size:15px}
.container{max-width:760px;margin:16px auto;padding:0 14px}
.category-title{font-size:22px;color:#6d6258;font-weight:900;margin:24px 0 12px 4px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.menu-grid{display:grid;grid-template-columns:1fr;gap:14px}
.menu-card{background:rgba(255,255,255,.93);border-radius:18px;padding:14px;display:grid;grid-template-columns:90px 1fr;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.05);border:1px solid rgba(230,224,218,.6)}
.menu-img{width:90px;height:90px;object-fit:cover;border-radius:14px;background:#eee}
.menu-info{display:flex;flex-direction:column;justify-content:space-between}
.menu-name{font-size:18px;font-weight:900;color:#4a433d}
.menu-note{font-size:13px;color:#8c837a;line-height:1.4;margin:4px 0}
.menu-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.menu-price{font-size:19px;font-weight:900;color:#7a594c}
.add-btn{border:none;background:linear-gradient(to bottom,#bcaea1,#9c8e81);color:white;border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer}
.add-btn:disabled{background:#d3cbaf;color:#a6a097;cursor:not-allowed}
.cart-bar{position:fixed;left:14px;right:14px;bottom:14px;height:64px;background:linear-gradient(to right,#8d7f72,#75685c);border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:white;box-shadow:0 8px 25px rgba(0,0,0,.25);z-index:90;cursor:pointer}
.cart-title{font-size:17px;font-weight:800;letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal{background:white;width:100%;max-width:480px;border-radius:24px;padding:20px;max-height:85vh;overflow:auto}
.modal-title{font-size:22px;font-weight:900;color:#554d46;margin-bottom:14px}
.option-title{font-size:15px;font-weight:800;color:#6d6258;margin:12px 0 6px}
select,textarea{width:100%;border:none;background:#f5f1eb;border-radius:12px;padding:12px;font-size:15px;outline:none;color:#5f574f}
textarea{height:72px;resize:none}
.qty-row{display:grid;grid-template-columns:50px 1fr 50px;gap:10px;align-items:center;margin-top:16px;text-align:center}
.qty-btn{border:none;background:#eaddd3;color:#5f574f;font-size:20px;font-weight:900;height:44px;border-radius:12px;cursor:pointer}
.qty-val{font-size:20px;font-weight:900}
.btn-row{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
.btn{border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:800;color:white;background:#9c8e81;cursor:pointer}
.btn.primary{background:#6d6258}
.cart-item{background:#f8f5f1;border-radius:14px;padding:12px;margin-bottom:10px;position:relative}
.cart-item-name{font-weight:800;font-size:16px}
.cart-item-meta{font-size:13px;color:#888;margin-top:2px}
.cart-item-price{font-weight:700;color:#7a594c;margin-top:4px}
.cart-del{position:absolute;right:12px;top:12px;border:none;background:none;color:#c86b62;font-weight:bold;font-size:14px;cursor:pointer}
</style>
</head>

<body>

<div class="header">
  <div class="brand"><img src="logo.png"></div>
  <a href="resident.html" class="back-btn">返回首頁</a>
</div>

<div class="container" id="menuContainer">正在加載美味菜單...</div>

<div class="cart-bar" id="cartBar" style="display:none;" onclick="openCart()">
  <div class="cart-title">🛒 購物車已放入 <span id="cartCount">0</span> 項</div>
  <div class="cart-title" id="cartTotalText">0 點 ></div>
</div>

<div class="modal-bg" id="itemModalBg">
  <div class="modal">
    <div class="modal-title" id="modalItemName">餐點名稱</div>
    <div id="optionArea"></div>
    <div class="option-title">備註說明</div>
    <textarea id="itemNote" placeholder="去冰 / 半糖 / 微溫，可空白"></textarea>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <div class="qty-val" id="qtyVal">1</div>
      <button class="qty-btn" onclick="changeQty(1)">＋</button>
    </div>
    <div class="btn-row">
      <button class="btn primary" onclick="addItemToCart()">加入購物車</button>
      <button class="btn" style="background:#ddd; color:#555;" onclick="closeItemModal()">取消</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="cartModalBg">
  <div class="modal">
    <div class="modal-title">確認購物車餐點</div>
    <div id="cartListArea"></div>
    <div class="option-title">取餐方式</div>
    <select id="diningType" onchange="toggleSeatSelect()">
      <option value="外帶">外帶</option>
      <option value="內用">內用</option>
    </select>
    <div id="seatArea" style="display:none;">
      <div class="option-title">選擇座位號碼</div>
      <select id="seatSelect"></select>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="submitOrderBtn">送出訂單</button>
      <button class="btn" style="background:#ddd; color:#555;" onclick="closeCart()">繼續點餐</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",authDomain:"zonghengcafe.firebaseapp.com",projectId:"zonghengcafe",storageBucket:"zonghengcafe.firebasestorage.app",messagingSenderId:"207027108121",appId:"1:207027108121:web:e7a39e19982ed77f9aed88",measurementId:"G-8ZE4SE2T7T"};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let profile=null;
let menuList=[];
let cart=[];
let currentSelectItem=null;
let balanceDocId=null;
let currentGranted=0, currentStored=0;

function getTaipeiTimeInMinutes() {
  const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
  return now.getHours() * 60 + now.getMinutes();
}

function timeStringToMinutes(timeStr) {
  if (!timeStr) return 0;
  const parts = timeStr.split(":");
  return Number(parts[0] || 0) * 60 + Number(parts[1] || 0);
}

onAuthStateChanged(auth, async user => {
  if (!user) { location.href = "index.html"; return; }
  const raw = localStorage.getItem("zh_user");
  if (!raw) { location.href = "index.html"; return; }
  profile = JSON.parse(raw);
  await loadBalance();
  await loadMenuData();
  await loadSeats();
});

async function loadBalance() {
  const snap = await getDocs(query(collection(db, "balances"), where("uid", "==", profile.username)));
  if (!snap.empty) {
    balanceDocId = snap.docs[0].id;
    currentGranted = Number(snap.docs[0].data().granted_amount || 0);
    currentStored = Number(snap.docs[0].data().stored_amount || 0);
  }
}

async function loadMenuData() {
  const snap = await getDocs(collection(db, "menu"));
  menuList = [];
  snap.forEach(d => { menuList.push({id:d.id,...d.data()}); });
  menuList.sort((a,b)=>Number(a.sort_order||999)-Number(b.sort_order||999));
  renderMenu();
}

function renderMenu() {
  const container = document.getElementById("menuContainer");
  container.innerHTML = "";

  const categories = [...new Set(menuList.map(x => x.category || "其他"))];
  const nowMinutes = getTaipeiTimeInMinutes();

  categories.forEach(cat => {
    const catDiv = document.createElement("div");
    catDiv.className = "category-title";
    catDiv.innerText = cat;
    container.appendChild(catDiv);

    const grid = document.createElement("div");
    grid.className = "menu-grid";

    const items = menuList.filter(x => (x.category || "其他") === cat);
    items.forEach(m => {
      let isAvailable = true;
      let buttonText = "點餐 ＋";
      let timeTip = "";

      if (m.enabled === false) {
        isAvailable = false;
        buttonText = "今日售完";
      } 
      else if (m.is_time_restricted) {
        const start = timeStringToMinutes(m.start_time);
        const end = timeStringToMinutes(m.end_time);
        if (nowMinutes < start || nowMinutes > end) {
          isAvailable = false;
          buttonText = "非供應時段";
          timeTip = `<span style="color:#c86b62; font-size:12px; font-weight:bold;">（限時：${m.start_time}-${m.end_time}）</span>`;
        }
      }

      const card = document.createElement("div");
      card.className = "menu-card";
      card.innerHTML = `
        <img class="menu-img" src="${m.image || 'logo.png'}">
        <div class="menu-info">
          <div>
            <div class="menu-name">${m.name} ${timeTip}</div>
            <div class="menu-note">${m.note || ""}</div>
          </div>
          <div class="menu-footer">
            <div class="menu-price">${m.price} 點</div>
            <button class="add-btn" ${!isAvailable ? 'disabled' : ''} onclick="window.openItemModal('${m.id}')">
              ${buttonText}
            </button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  });
}

window.openItemModal = (id) => {
  currentSelectItem = menuList.find(x => x.id === id);
  modalItemName.innerText = currentSelectItem.name;
  qtyVal.innerText = "1";
  itemNote.value = "";
  const area = document.getElementById("optionArea");
  area.innerHTML = "";
  (currentSelectItem.custom_options || []).forEach((g, idx) => {
    area.innerHTML += `<div class="option-title">${g.title}</div><select id="opt_${idx}">${g.choices.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>`;
  });
  itemModalBg.style.display = "flex";
};

window.closeItemModal = () => { itemModalBg.style.display = "none"; };
window.changeQty = (n) => { let q = Number(qtyVal.innerText); q = Math.max(1, q + n); qtyVal.innerText = q; };

window.addItemToCart = () => {
  const options = {};
  (currentSelectItem.custom_options || []).forEach((g, idx) => {
    options[g.title] = document.getElementById(`opt_${idx}`).value;
  });
  cart.push({
    id: currentSelectItem.id, name: currentSelectItem.name, price: currentSelectItem.price,
    qty: Number(qtyVal.innerText), options, note: itemNote.value.trim()
  });
  closeItemModal(); updateCartSummary();
};

function updateCartSummary() {
  if(!cart.length) { cartBar.style.display = "none"; return; }
  cartBar.style.display = "flex";
  cartCount.innerText = cart.reduce((s,x)=>s+x.qty, 0);
  cartTotalText.innerText = cart.reduce((s,x)=>s+x.price*x.qty, 0) + " 點 >";
}

window.openCart = () => {
  const area = document.getElementById("cartListArea");
  area.innerHTML = "";
  cart.forEach((x, idx) => {
    const meta = Object.entries(x.options).map(([k,v])=>`${k}:${v}`).join(", ");
    area.innerHTML += `<div class="cart-item"><div class="cart-item-name">${x.name} × ${x.qty}</div><div class="cart-item-meta">${meta} ${x.note?`[${x.note}]`:''}</div><div class="cart-item-price">${x.price*x.qty} 點</div><button class="cart-del" onclick="window.delCartItem(${idx})">刪除</button></div>`;
  });
  cartModalBg.style.display = "flex";
};
window.closeCart = () => { cartModalBg.style.display = "none"; };
window.delCartItem = (idx) => { cart.splice(idx,1); openCart(); updateCartSummary(); };
window.toggleSeatSelect = () => { seatArea.style.display = diningType.value === "內用" ? "block" : "none"; };

async function loadSeats() {
  const snap = await getDocs(collection(db, "seats"));
  const select = document.getElementById("seatSelect");
  select.innerHTML = "";
  snap.forEach(d => { if(d.data().available !== false) select.innerHTML += `<option value="${d.data().seatId}">${d.data().seatId}</option>`; });
}

async function submitOrder() {
  const total = cart.reduce((s,x)=>s+x.price*x.qty, 0);
  if(currentGranted + currentStored < total) { alert("您的點數不足！"); return; }
  
  submitOrderBtn.disabled = true;
  submitOrderBtn.innerText = "送出中...";

  await addDoc(collection(db, "orders"), {
    order_id: "ZH" + Date.now(), uid: profile.username, items: cart, total,
    dining_type: diningType.value, seat: diningType.value === "內用" ? seatSelect.value : "",
    status: "等待接單", created_at: new Date().toISOString()
  });

  await updateDoc(doc(db, "balances", balanceDocId), {
    granted_amount: currentGranted >= total ? currentGranted - total : 0,
    stored_amount: currentGranted >= total ? currentStored : currentStored - (total - currentGranted),
    updated_by: "resident_auto"
  });

  alert("訂單已成功送出！"); cart = []; location.href = "resident.html";
}
document.getElementById("submitOrderBtn").addEventListener("click", submitOrder);
itemModalBg.addEventListener("click", e => { if(e.target===itemModalBg) closeItemModal(); });
cartModalBg.addEventListener("click", e => { if(e.target===cartModalBg) closeCart(); });
</script>
</body>
</html>
