<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住戶點餐｜昭揚縱橫 咖啡廳點餐系統</title>

<style>
*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif
}

body{
  margin:0;
  min-height:100vh;
  background:url("bg.jpg") center center/cover fixed no-repeat;
  color:#5f574f;
  padding-bottom:120px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(4px);
  z-index:-1;
}

.header{
  height:72px;
  background:rgba(255,255,255,.9);
  border-bottom:1px solid #ddd5cc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:68px;
  opacity:.85;
}

.title{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  color:#6d6258;
}

.back-btn{
  border:none;
  background:#f0e8df;
  color:#6d6258;
  border-radius:12px;
  padding:10px 16px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 16px;
}

.section-title{
  font-size:28px;
  font-weight:900;
  color:#6d6258;
  margin-bottom:18px;
}

.category-tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.category-btn{
  border:none;
  background:white;
  border-radius:999px;
  padding:10px 18px;
  font-weight:800;
  color:#7b6d61;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.category-btn.active{
  background:#9c8e81;
  color:white;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}

.menu-card{
  background:rgba(255,255,255,.94);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
  border:1px solid #eee5dd;
}

.menu-img{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#eee;
}

.menu-content{
  padding:18px;
}

.menu-name{
  font-size:22px;
  font-weight:900;
  color:#6d6258;
}

.menu-price{
  margin-top:8px;
  font-size:18px;
  font-weight:800;
  color:#9b7d57;
}

.menu-note{
  margin-top:10px;
  font-size:14px;
  color:#777;
  line-height:1.7;
  min-height:40px;
}

.add-btn{
  margin-top:14px;
  width:100%;
  border:none;
  background:#6d6258;
  color:white;
  border-radius:16px;
  padding:13px;
  font-size:15px;
  font-weight:900;
}

.cart-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(255,255,255,.96);
  border-top:1px solid #ddd5cc;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  backdrop-filter:blur(8px);
}

.cart-total{
  font-size:20px;
  font-weight:900;
  color:#6d6258;
}

.checkout-btn{
  border:none;
  background:#9c8e81;
  color:white;
  border-radius:16px;
  padding:14px 22px;
  font-size:16px;
  font-weight:900;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:18px;
}

.modal{
  width:100%;
  max-width:620px;
  background:white;
  border-radius:26px;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.modal-title{
  font-size:28px;
  font-weight:900;
  color:#6d6258;
  margin-bottom:18px;
}

.option-group{
  margin-bottom:18px;
}

.option-label{
  display:block;
  font-weight:900;
  margin-bottom:8px;
  color:#6d6258;
}

select,
textarea,
input{
  width:100%;
  border:none;
  background:#f5f1eb;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  outline:none;
  color:#5f574f;
}

textarea{
  resize:none;
  height:90px;
}

.qty-row{
  display:grid;
  grid-template-columns:60px 1fr 60px;
  gap:10px;
  margin-top:18px;
}

.qty-btn{
  border:none;
  border-radius:14px;
  background:#f0e8df;
  font-size:24px;
  font-weight:900;
  color:#6d6258;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.primary-btn{
  flex:1;
  border:none;
  background:#6d6258;
  color:white;
  border-radius:16px;
  padding:14px;
  font-size:16px;
  font-weight:900;
}

.secondary-btn{
  flex:1;
  border:none;
  background:#eee5dd;
  color:#6d6258;
  border-radius:16px;
  padding:14px;
  font-size:16px;
  font-weight:900;
}

.checkout-box{
  background:#f8f5f1;
  border-radius:20px;
  padding:18px;
  margin-top:18px;
}

.section-label{
  display:block;
  margin-bottom:10px;
  font-weight:900;
  color:#6d6258;
}

.radio-row{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.radio-btn{
  flex:1;
  border:none;
  border-radius:14px;
  background:white;
  padding:14px;
  font-weight:900;
  color:#6d6258;
}

.radio-btn.active{
  background:#9c8e81;
  color:white;
}

.empty{
  text-align:center;
  color:#999;
  padding:60px 20px;
}

@media(max-width:700px){

  .menu-grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="header">

  <div class="brand">

    <img src="logo.png"
      class="logo">

    <div class="title">
      咖啡廳點餐
    </div>

  </div>

  <button class="back-btn"
    onclick="location.href='resident.html'">

    返回

  </button>

</div>

<div class="container">

  <div class="section-title">
    今日菜單
  </div>

  <div class="category-tabs"
    id="categoryTabs"></div>

  <div class="menu-grid"
    id="menuGrid"></div>

</div>

<div class="cart-bar">

  <div class="cart-total"
    id="cartTotal">

    NT$ 0

  </div>

  <button class="checkout-btn"
    onclick="openCheckout()">

    查看購物車

  </button>

</div>

<div class="modal-bg"
  id="itemModalBg">

  <div class="modal">

    <div class="modal-title"
      id="itemModalTitle">

      商品

    </div>

    <div id="itemOptions"></div>

    <div style="margin-top:14px;">

      <label class="option-label">
        備註
      </label>

      <textarea id="itemNote"
        placeholder="例如：少冰、先做"></textarea>

    </div>

    <div class="qty-row">

      <button class="qty-btn"
        onclick="changeQty(-1)">

        −

      </button>

      <input id="itemQty"
        type="number"
        value="1"
        min="1">

      <button class="qty-btn"
        onclick="changeQty(1)">

        ＋

      </button>

    </div>

    <div class="modal-actions">

      <button class="secondary-btn"
        onclick="closeItemModal()">

        取消

      </button>

      <button class="primary-btn"
        onclick="addToCart()">

        加入購物車

      </button>

    </div>

  </div>

</div>

<div class="modal-bg"
  id="checkoutModalBg">

  <div class="modal">

    <div class="modal-title">
      購物車
    </div>

    <div id="checkoutCartList"></div>

    <div class="checkout-box">

      <label class="section-label">
        用餐方式
      </label>

      <div class="radio-row">

        <button class="radio-btn active"
          id="dineInBtn"
          onclick="setDining('內用')">

          內用

        </button>

        <button class="radio-btn"
          id="takeOutBtn"
          onclick="setDining('外帶')">

          外帶

        </button>

      </div>

      <div id="seatArea">

        <label class="section-label">
          座位選擇
        </label>

        <select id="seatSelect">

          <option value="">
            請選擇座位
          </option>

          <optgroup label="A區">
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="A3">A3</option>
            <option value="A4">A4</option>
          </optgroup>

          <optgroup label="B區">
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="B3">B3</option>
            <option value="B4">B4</option>
            <option value="B5">B5</option>
            <option value="B6">B6</option>
            <option value="B7">B7</option>
            <option value="B8">B8</option>
          </optgroup>

          <optgroup label="C區">
            <option value="C1">C1</option>
            <option value="C2">C2</option>
            <option value="C3">C3</option>
            <option value="C4">C4</option>
            <option value="C5">C5</option>
            <option value="C6">C6</option>
          </optgroup>

        </select>

      </div>

    </div>

    <div class="modal-actions">

      <button class="secondary-btn"
        onclick="closeCheckout()">

        關閉

      </button>

      <button class="primary-btn"
        onclick="submitOrder()">

        送出訂單

      </button>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  query,
  where,
  updateDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain:"zonghengcafe.firebaseapp.com",
  projectId:"zonghengcafe",
  storageBucket:"zonghengcafe.firebasestorage.app",
  messagingSenderId:"207027108121",
  appId:"1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId:"G-8ZE4SE2T7T"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let profile=null;
let menuCache=[];
let cart=[];
let currentItem=null;
let diningType="內用";

onAuthStateChanged(auth,async user=>{

  if(!user){

    location.href="index.html";
    return;

  }

  const raw=
  localStorage.getItem("zh_user");

  if(!raw){

    location.href="index.html";
    return;

  }

  profile=
  JSON.parse(raw);

  await loadMenu();

});

async function loadMenu(){

  const snap=
  await getDocs(collection(db,"menu"));

  menuCache=[];

  snap.forEach(d=>{

    const x={
      id:d.id,
      ...d.data()
    };

    if(x.enabled===false)return;

    menuCache.push(x);

  });

  renderCategories();
  renderMenu();

}

function renderCategories(){

  const cats=[
    ...new Set(
      menuCache.map(x=>x.category||"其它")
    )
  ];

  categoryTabs.innerHTML=`
    <button class="category-btn active"
      onclick="renderMenu()">

      全部

    </button>
  `;

  cats.forEach(cat=>{

    categoryTabs.innerHTML+=`
      <button class="category-btn"
        onclick="renderMenu('${cat}',this)">

        ${cat}

      </button>
    `;

  });

}

window.renderMenu=(cat="",btn=null)=>{

  document
    .querySelectorAll(".category-btn")
    .forEach(x=>x.classList.remove("active"));

  if(btn){

    btn.classList.add("active");

  }else{

    document
      .querySelector(".category-btn")
      ?.classList.add("active");

  }

  menuGrid.innerHTML="";

  const list=
  cat
  ? menuCache.filter(x=>x.category===cat)
  : menuCache;

  if(!list.length){

    menuGrid.innerHTML=`
      <div class="empty">
        目前沒有商品
      </div>
    `;

    return;

  }

  list.forEach(item=>{

    const div=
    document.createElement("div");

    div.className="menu-card";

    div.innerHTML=`
      <img class="menu-img"
        src="${item.image||''}">

      <div class="menu-content">

        <div class="menu-name">
          ${item.name||''}
        </div>

        <div class="menu-price">
          NT$ ${item.price||0}
        </div>

        <div class="menu-note">
          ${item.note||'無說明'}
        </div>

        <button class="add-btn">

          加入購物車

        </button>

      </div>
    `;

    div.querySelector("button")
      .onclick=()=>openItemModal(item);

    menuGrid.appendChild(div);

  });

};

window.openItemModal=(item)=>{

  currentItem=item;

  itemModalTitle.innerText=
  item.name||"商品";

  itemQty.value=1;
  itemNote.value="";

  itemOptions.innerHTML="";

  const opts=
  Array.isArray(item.custom_options)
  ? item.custom_options
  : [];

  opts.forEach((group,index)=>{

    const div=
    document.createElement("div");

    div.className="option-group";

    div.innerHTML=`
      <label class="option-label">

        ${group.title}

      </label>

      <select id="opt_${index}">

        ${
          (group.choices||[])
          .map(x=>`
            <option value="${x}">
              ${x}
            </option>
          `)
          .join("")
        }

      </select>
    `;

    itemOptions.appendChild(div);

  });

  itemModalBg.style.display="flex";

};

window.closeItemModal=()=>{

  itemModalBg.style.display="none";

};

window.changeQty=(n)=>{

  let q=
  Number(itemQty.value||1);

  q=Math.max(1,q+n);

  itemQty.value=q;

};

window.addToCart=()=>{

  if(!currentItem)return;

  const options={};

  (
    currentItem.custom_options||[]
  ).forEach((group,index)=>{

    const el=
    document.getElementById(
      `opt_${index}`
    );

    if(el){

      options[group.title]=el.value;

    }

  });

  cart.push({
    id:currentItem.id,
    name:currentItem.name,
    price:Number(currentItem.price||0),
    qty:Number(itemQty.value||1),
    note:itemNote.value.trim(),
    options
  });

  updateCartTotal();

  closeItemModal();

};

function updateCartTotal(){

  const total=
  cart.reduce(
    (s,x)=>s+x.price*x.qty,
    0
  );

  cartTotal.innerText=
  `NT$ ${total}`;

}

window.openCheckout=()=>{

  renderCheckoutCart();

  checkoutModalBg.style.display="flex";

};

window.closeCheckout=()=>{

  checkoutModalBg.style.display="none";

};

function renderCheckoutCart(){

  checkoutCartList.innerHTML="";

  if(!cart.length){

    checkoutCartList.innerHTML=`
      <div class="empty">
        購物車是空的
      </div>
    `;

    return;

  }

  cart.forEach((item,index)=>{

    const div=
    document.createElement("div");

    div.className="checkout-box";

    div.innerHTML=`
      <div class="menu-name">
        ${item.name} × ${item.qty}
      </div>

      <div class="menu-note">

        ${
          Object.entries(item.options||{})
          .map(([k,v])=>`${k}：${v}`)
          .join("<br>")
        }

        <br>

        備註：
        ${item.note||"無"}

      </div>

      <div class="menu-price">
        NT$ ${item.price*item.qty}
      </div>

      <button class="secondary-btn"
        style="margin-top:14px;"
        onclick="removeCartItem(${index})">

        刪除

      </button>
    `;

    checkoutCartList.appendChild(div);

  });

}

window.removeCartItem=(index)=>{

  cart.splice(index,1);

  renderCheckoutCart();

  updateCartTotal();

};

window.setDining=(type)=>{

  diningType=type;

  dineInBtn.classList.remove("active");
  takeOutBtn.classList.remove("active");

  if(type==="內用"){

    dineInBtn.classList.add("active");

    seatArea.style.display="block";

  }else{

    takeOutBtn.classList.add("active");

    seatArea.style.display="none";

  }

};

window.submitOrder=async()=>{

  if(!cart.length){

    alert("購物車是空的");

    return;

  }

  const total=
  cart.reduce(
    (s,x)=>s+x.price*x.qty,
    0
  );

  const seat=
  diningType==="內用"
  ? seatSelect.value
  : "";

  if(diningType==="內用"&&!seat){

    alert("請選擇座位");

    return;

  }

  const bq=query(
    collection(db,"balances"),
    where("uid","==",profile.username)
  );

  const bs=
  await getDocs(bq);

  if(bs.empty){

    alert("找不到點數資料");

    return;

  }

  const bdoc=
  bs.docs[0];

  let granted=
  Number(
    bdoc.data().granted_amount||0
  );

  let stored=
  Number(
    bdoc.data().stored_amount||0
  );

  if(granted+stored<total){

    alert("點數不足");

    return;

  }

  if(granted>=total){

    granted-=total;

  }else{

    const rest=
    total-granted;

    granted=0;

    stored-=rest;

  }

  await addDoc(
    collection(db,"orders"),
    {
      order_id:"ZH"+Date.now(),
      uid:profile.username,
      items:cart,
      total,
      dining_type:diningType,
      seat,
      status:"等待接單",
      created_at:
        new Date().toISOString()
    }
  );

  await updateDoc(
    doc(db,"balances",bdoc.id),
    {
      granted_amount:granted,
      stored_amount:stored
    }
  );

  alert("訂單已送出");

  cart=[];

  updateCartTotal();

  closeCheckout();

};

itemModalBg.addEventListener("click",e=>{

  if(e.target===itemModalBg){

    closeItemModal();

  }

});

checkoutModalBg.addEventListener("click",e=>{

  if(e.target===checkoutModalBg){

    closeCheckout();

  }

});
</script>

</body>
</html>
