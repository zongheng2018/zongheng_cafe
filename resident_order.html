<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昭揚縱橫｜開始點餐</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
body{margin:0;background:#f5f1eb;color:#5c4033;padding-bottom:92px}
.header{height:68px;background:#6b4637;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:22px;font-weight:700;position:sticky;top:0;z-index:20}
.back{border:0;background:rgba(255,255,255,.18);color:white;border-radius:10px;padding:8px 12px}
.cart{position:relative;font-size:26px;cursor:pointer}.badge{position:absolute;top:-8px;right:-10px;background:#d64545;color:white;border-radius:50%;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center}
.category{display:flex;gap:10px;overflow-x:auto;background:white;padding:12px;position:sticky;top:68px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cat{border:0;border-radius:999px;background:#e9dfd4;color:#6b4637;padding:9px 16px;font-weight:700;white-space:nowrap}.cat.active{background:#6b4637;color:white}
.grid{padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
.item{background:white;border-radius:20px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.item img{width:100%;height:140px;object-fit:cover}.body{padding:13px}.name{font-size:20px;font-weight:700}.price{color:#b7791f;font-weight:700;font-size:18px;margin-top:6px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:82px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 -3px 14px rgba(0,0,0,.12);z-index:30}
.total{font-size:22px;font-weight:800}.btn{border:0;background:#6b4637;color:white;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal{background:white;width:100%;max-width:520px;border-radius:24px;max-height:90vh;overflow:auto}
.modal img{width:100%;height:220px;object-fit:cover}.modal-body{padding:20px}
.m-title{font-size:26px;font-weight:800}.m-price{font-size:22px;color:#b7791f;font-weight:800;margin:8px 0 18px}
.label{font-weight:800;margin:16px 0 8px}.choice{border:0;background:#ece3da;color:#6b4637;border-radius:13px;padding:9px 14px;margin:0 8px 8px 0;font-weight:700}.choice.active{background:#6b4637;color:white}
textarea,input,select{width:100%;border:0;background:#f3f0eb;border-radius:14px;padding:14px;font-size:16px;outline:none}textarea{height:95px;resize:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.qty{display:flex;align-items:center;gap:14px}.round{width:40px;height:40px;border:0;border-radius:50%;background:#6b4637;color:white;font-size:22px}
.cart-item{padding:15px 0;border-bottom:1px solid #eee}.cart-name{font-size:18px;font-weight:800}.detail{font-size:14px;color:#666;margin-top:4px}.danger{border:0;background:#d65b55;color:white;border-radius:10px;padding:8px 12px;margin-top:8px}
.hidden{display:none}
.notice{background:#f8f5f1;border-radius:14px;padding:14px;line-height:1.7;margin:12px 0;color:#6b635b}
</style>
</head>

<body>
<div class="header">
  <button class="back" onclick="location.href='resident.html'">返回</button>
  <div>開始點餐</div>
  <div class="cart" onclick="openCart()">🛒<div class="badge" id="count">0</div></div>
</div>

<div class="category" id="category"></div>
<div class="grid" id="grid"></div>

<div class="bottom">
  <div class="total" id="total">NT$ 0</div>
  <button class="btn" onclick="openCart()">查看購物車</button>
</div>

<div class="overlay" id="itemOverlay">
  <div class="modal">
    <img id="mImg">
    <div class="modal-body">
      <div class="m-title" id="mName"></div>
      <div class="m-price" id="mPrice"></div>

      <div class="label">冰度</div>
      <div id="iceBox"></div>

      <div class="label">糖度</div>
      <div id="sugarBox"></div>

      <div class="label">備註</div>
      <textarea id="note" placeholder="例如：少冰、不要太燙、餐後上"></textarea>

      <div class="row">
        <div class="qty">
          <button class="round" onclick="changeQty(-1)">−</button>
          <b id="qty">1</b>
          <button class="round" onclick="changeQty(1)">＋</button>
        </div>
        <button class="btn" onclick="addCart()">加入購物車</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="cartOverlay">
  <div class="modal">
    <div class="modal-body">
      <div class="m-title">購物車</div>
      <div id="cartList"></div>
      <button class="btn" style="width:100%;margin-top:16px" onclick="openCheckout()">下一步</button>
    </div>
  </div>
</div>

<div class="overlay" id="checkoutOverlay">
  <div class="modal">
    <div class="modal-body">
      <div class="m-title">確認訂單</div>

      <div class="label">用餐方式</div>
      <button class="choice active" id="dineInBtn" onclick="setDining('內用')">內用</button>
      <button class="choice" id="takeOutBtn" onclick="setDining('外帶')">外帶</button>

      <div id="seatArea">
        <div class="label">座位</div>
        <select id="seatSelect"></select>
      </div>

      <div class="label">餐點完成是否需要通知？</div>
      <label><input type="checkbox" id="needNotify" checked style="width:auto"> 需要通知</label>

      <div class="notice" id="pointInfo">讀取點數中...</div>

      <button class="btn" style="width:100%;margin-top:16px" onclick="submitOrder()">送出訂單</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore,collection,getDocs,query,where,addDoc,doc,updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",authDomain:"zonghengcafe.firebaseapp.com",projectId:"zonghengcafe",storageBucket:"zonghengcafe.firebasestorage.app",messagingSenderId:"207027108121",appId:"1:207027108121:web:e7a39e19982ed77f9aed88",measurementId:"G-8ZE4SE2T7T"};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let profile=null, menu=[], cart=[], current=null, qty=1, ice="正常冰", sugar="全糖", dining="內用";
let balanceDocId=null, granted=0, stored=0;

onAuthStateChanged(auth, async user=>{
  if(!user){location.href="index.html";return}
  const raw=localStorage.getItem("zh_user");
  if(!raw){location.href="index.html";return}
  profile=JSON.parse(raw);
  if(profile.role!=="resident"){alert("沒有權限");location.href="index.html";return}
  await loadMenu();
  await loadSeats();
});

async function loadMenu(){
  const snap=await getDocs(collection(db,"menu"));
  menu=[];
  snap.forEach(d=>{
    const x=d.data();
    if(x.enabled) menu.push({id:d.id,...x});
  });
  renderCategories();
  renderMenu("全部");
}

function renderCategories(){
  const cats=["全部",...new Set(menu.map(x=>x.category||"未分類"))];
  document.getElementById("category").innerHTML="";
  cats.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="cat"+(i===0?" active":"");
    b.innerText=c;
    b.onclick=()=>{
      document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      renderMenu(c);
    };
    category.appendChild(b);
  });
}

function renderMenu(cat){
  grid.innerHTML="";
  const list=cat==="全部"?menu:menu.filter(x=>(x.category||"未分類")===cat);
  list.forEach(item=>{
    const div=document.createElement("div");
    div.className="item";
    div.onclick=()=>openItem(item);
    div.innerHTML=`<img src="${item.image||""}"><div class="body"><div class="name">${item.name}</div><div class="price">NT$ ${Number(item.price||0)}</div></div>`;
    grid.appendChild(div);
  });
}

window.openItem=item=>{
  current=item; qty=1; ice="正常冰"; sugar="全糖";
  mImg.src=item.image||""; mName.innerText=item.name; mPrice.innerText=`NT$ ${Number(item.price||0)}`;
  note.value=""; document.getElementById("qty").innerText=qty;
  renderChoices("iceBox",["正常冰","少冰","去冰","熱"],"ice");
  renderChoices("sugarBox",["全糖","半糖","微糖","無糖"],"sugar");
  itemOverlay.style.display="flex";
};

function renderChoices(id,arr,type){
  const box=document.getElementById(id); box.innerHTML="";
  arr.forEach(v=>{
    const b=document.createElement("button");
    b.className="choice "+((type==="ice"?ice:sugar)===v?"active":"");
    b.innerText=v;
    b.onclick=()=>{ if(type==="ice") ice=v; else sugar=v; renderChoices(id,arr,type); };
    box.appendChild(b);
  });
}

window.changeQty=n=>{qty=Math.max(1,qty+n);document.getElementById("qty").innerText=qty};

window.addCart=()=>{
  cart.push({id:current.id,name:current.name,price:Number(current.price||0),qty,ice,sugar,note:note.value||""});
  itemOverlay.style.display="none";
  updateCart();
};

function updateCart(){
  const count=cart.reduce((s,x)=>s+x.qty,0);
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  document.getElementById("count").innerText=count;
  document.getElementById("total").innerText=`NT$ ${total}`;
  renderCart();
}

window.openCart=()=>{renderCart();cartOverlay.style.display="flex"};

function renderCart(){
  if(cart.length===0){cartList.innerHTML='<div class="notice">購物車目前沒有商品</div>';return}
  cartList.innerHTML="";
  cart.forEach((x,i)=>{
    const div=document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`<div class="cart-name">${x.name} × ${x.qty}</div><div class="detail">冰度：${x.ice}｜糖度：${x.sugar}</div><div class="detail">備註：${x.note||"無"}</div><div class="detail">NT$ ${x.price*x.qty}</div><button class="danger" onclick="delCart(${i})">刪除</button>`;
    cartList.appendChild(div);
  });
}
window.delCart=i=>{cart.splice(i,1);updateCart()};

async function loadSeats(){
  try{
    const snap=await getDocs(collection(db,"seats"));
    seatSelect.innerHTML="";
    if(snap.empty){["A1","A2","B1","B2"].forEach(s=>seatSelect.innerHTML+=`<option>${s}</option>`);return}
    snap.forEach(d=>{
      const s=d.data();
      seatSelect.innerHTML+=`<option>${s.seatId||d.id}</option>`;
    });
  }catch(e){seatSelect.innerHTML="<option>A1</option><option>A2</option>"}
}

window.openCheckout=async()=>{
  if(cart.length===0){alert("購物車是空的");return}
  cartOverlay.style.display="none";
  checkoutOverlay.style.display="flex";
  await loadBalance();
};

window.setDining=v=>{
  dining=v;
  dineInBtn.classList.toggle("active",v==="內用");
  takeOutBtn.classList.toggle("active",v==="外帶");
  seatArea.style.display=v==="內用"?"block":"none";
};

async function loadBalance(){
  const q=query(collection(db,"balances"),where("uid","==",profile.username));
  const snap=await getDocs(q);
  if(snap.empty){pointInfo.innerText="找不到點數資料，請洽物業櫃台。";return}
  const d=snap.docs[0];
  balanceDocId=d.id;
  granted=Number(d.data().granted_amount||0);
  stored=Number(d.data().stored_amount||0);
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  pointInfo.innerText=`配發點數：${granted}｜儲值點數：${stored}｜訂單金額：${total}`;
}

window.submitOrder=async()=>{
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  if(granted+stored<total){alert("點數不足，請洽物業櫃台儲值。");return}

  let newGranted=granted, newStored=stored;
  if(newGranted>=total){newGranted-=total}
  else{const rest=total-newGranted; newGranted=0; newStored-=rest}

  const orderId="ZH"+Date.now();

  await addDoc(collection(db,"orders"),{
    order_id:orderId,
    uid:profile.username,
    items:cart,
    total,
    dining_type:dining,
    seat:dining==="內用"?seatSelect.value:"",
    need_notify:needNotify.checked,
    status:"等待接單",
    created_at:new Date().toISOString()
  });

  await updateDoc(doc(db,"balances",balanceDocId),{
    granted_amount:newGranted,
    stored_amount:newStored
  });

  alert("訂單已送出！");
  cart=[];
  updateCart();
  checkoutOverlay.style.display="none";
  location.href="resident.html";
};

[itemOverlay,cartOverlay,checkoutOverlay].forEach(el=>{
  el.addEventListener("click",e=>{if(e.target===el) el.style.display="none"});
});
</script>
</body>
</html>
