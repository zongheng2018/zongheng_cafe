<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9c8e81">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>昭揚縱橫 咖啡廳點餐系統</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
  background: url("bg.jpg") no-repeat center center fixed;
  background-size: cover;
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.wrapper {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.logo {
  width: 180px;
  margin-bottom: 12px;
  opacity: .82;
}

.system-title {
  font-size: 20px;
  color: #666;
  letter-spacing: 2px;
  margin-bottom: 48px;
}

.login-title {
  font-size: 30px;
  color: #666;
  font-weight: 400;
  letter-spacing: 8px;
  margin-bottom: 24px;
}

.login-box {
  background: rgba(255,255,255,.86);
  backdrop-filter: blur(10px);
  border-radius: 8px;
  padding: 28px;
  box-shadow: 0 10px 28px rgba(0,0,0,.15);
}

.input-group {
  margin-bottom: 16px;
}

input {
  width: 100%;
  height: 54px;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 0 16px;
  font-size: 18px;
  box-sizing: border-box;
  outline: none;
}

input:focus {
  border-color: #9c8e81;
}

.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #666;
  font-size: 15px;
  margin: 8px 0 24px;
  text-align: left;
}

.remember input {
  width: 18px;
  height: 18px;
}

button {
  width: 100%;
  height: 56px;
  border: none;
  border-radius: 6px;
  background: linear-gradient(to bottom, #bcaea1, #9c8e81);
  color: white;
  font-size: 22px;
  letter-spacing: 8px;
  font-weight: 500;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="wrapper">
  <img src="logo.png" class="logo">
  <div class="system-title">昭揚縱橫 咖啡廳點餐系統</div>

  <div class="login-title">登入</div>

  <div class="login-box">
    <div class="input-group">
      <input id="username" placeholder="username">
    </div>

    <div class="input-group">
      <input id="password" type="password" placeholder="password">
    </div>

    <label class="remember">
      <input type="checkbox" id="rememberMe">
      保持登入狀態
    </label>

    <button id="loginBtn">登入</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain: "zonghengcafe.firebaseapp.com",
  projectId: "zonghengcafe",
  storageBucket: "zonghengcafe.firebasestorage.app",
  messagingSenderId: "207027108121",
  appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId: "G-8ZE4SE2T7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const rememberMe = document.getElementById("rememberMe");
const loginBtn = document.getElementById("loginBtn");

const remembered = localStorage.getItem("rememberUser");
if (remembered) {
  usernameInput.value = remembered;
  rememberMe.checked = true;
}

async function login() {
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();

  if (!username || !password) {
    alert("請輸入帳號密碼");
    return;
  }

  loginBtn.innerText = "登入中";
  loginBtn.disabled = true;

  try {
    const q = query(
      collection(db, "accounts"),
      where("username", "==", username)
    );

    const snap = await getDocs(q);

    if (snap.empty) {
      alert("帳號不存在");
      return;
    }

    const accountDoc = snap.docs[0];
    const account = {
      id: accountDoc.id,
      ...accountDoc.data()
    };

    if (!account.auth_email) {
      alert("此帳號尚未設定 auth_email");
      return;
    }

    await setPersistence(
      auth,
      rememberMe.checked ? browserLocalPersistence : browserSessionPersistence
    );

    await signInWithEmailAndPassword(
      auth,
      account.auth_email,
      password
    );

    localStorage.setItem(
      "zh_user",
      JSON.stringify({
        id: account.id,
        username: account.username,
        role: account.role,
        auth_email: account.auth_email,
        unit_number: account.unit_number || ""
      })
    );

    if (rememberMe.checked) {
      localStorage.setItem("rememberUser", username);
    } else {
      localStorage.removeItem("rememberUser");
    }

    if (account.role === "resident") {
      location.href = "resident.html";
    } else if (account.role === "cafe") {
      location.href = "cafe.html";
    } else if (account.role === "property") {
      location.href = "property.html";
    } else if (account.role === "engineer") {
      location.href = "engineer.html";
    } else {
      alert("未知角色");
    }

  } catch (e) {
    console.error(e);
    alert("登入失敗，請確認帳號密碼");
  } finally {
    loginBtn.innerText = "登入";
    loginBtn.disabled = false;
  }
}

loginBtn.addEventListener("click", login);

passwordInput.addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
