<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昭揚縱橫 咖啡廳點餐系統</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .top-banner {
      text-align: center;
      margin-bottom: 20px;
    }
    .top-banner img.logo {
      width: 160px;
      margin-bottom: 10px;
    }
    .top-banner h1 {
      font-size: 22px;
      color: #5c4033;
      margin: 0;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      width: 360px;
      text-align: center;
    }
    .login-box h2 {
      font-size: 24px;
      color: #5c4033;
      margin-bottom: 20px;
      letter-spacing: 4px;
    }
    input, button {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #5c4033;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {background: #3e2a20;}
    .remember {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #5c4033;
    }
    .remember input {margin-right: 8px;}

    /* 響應式設計 */
    @media (max-width: 480px) {
      .login-box {
        width: 90%;
        padding: 20px;
      }
      .top-banner img.logo {
        width: 120px;
      }
      .top-banner h1 {
        font-size: 18px;
      }
      .login-box h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="top-banner">
    <img src="logo.png" class="logo" alt="縱橫Logo">
    <h1>昭揚縱橫 咖啡廳點餐系統</h1>
  </div>

  <div class="login-box">
    <h2>登入</h2>
    <input id="username" placeholder="帳號">
    <input id="password" type="password" placeholder="密碼">
    <div class="remember">
      <input type="checkbox" id="rememberMe"> 記住我
    </div>
    <button onclick="login()">登入</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = { /* Firebase 設定 */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 預設工程師帳號
    async function ensureAdmin() {
      const snapshot = await db.collection("accounts").where("username","==","admin").get();
      if (snapshot.empty) {
        await db.collection("accounts").add({username:"admin", password:"admin", role:"engineer"});
      }
    }
    ensureAdmin();

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const remember = document.getElementById("rememberMe").checked;

      try {
        const snapshot = await db.collection("accounts").where("username","==",username).get();
        if (!snapshot.empty) {
          const user = snapshot.docs[0].data();
          if (user.password === password) {
            if (remember) {
              localStorage.setItem("savedUser", username);
              localStorage.setItem("savedPass", password);
            } else {
              localStorage.removeItem("savedUser");
              localStorage.removeItem("savedPass");
            }
            if (user.role === "resident") window.location.href="resident.html";
            else if (user.role === "property") window.location.href="property.html";
            else if (user.role === "cafe") window.location.href="cafe.html";
            else if (user.role === "engineer") window.location.href="engineer.html";
          } else alert("密碼錯誤！");
        } else alert("帳號不存在！");
      } catch(e) {
        alert("登入失敗，請檢查 Firebase 設定");
      }
    }

    // 自動填入記住的帳號密碼
    window.onload = function() {
      const savedUser = localStorage.getItem("savedUser");
      const savedPass = localStorage.getItem("savedPass");
      if (savedUser && savedPass) {
        document.getElementById("username").value = savedUser;
        document.getElementById("password").value = savedPass;
        document.getElementById("rememberMe").checked = true;
      }
    }
  </script>
</body>
</html>
