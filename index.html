<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昭揚縱橫 咖啡廳點餐系統</title>
  <style>
    body {
      font-family: "-apple-system", BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft JhengHei", Arial, sans-serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 20px;
    }

    /* 頂部標題與 Logo 區 */
    .top-banner {
      text-align: center;
      margin-bottom: 25px;
    }
    .top-banner img.logo {
      width: 180px;
      height: auto;
      margin-bottom: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .top-banner h1 {
      font-size: 20px;
      color: #656565;
      font-weight: 500;
      margin: 0;
      letter-spacing: 2px;
    }

    /* 登入區塊外殼 */
    .login-container {
      width: 100%;
      max-width: 380px;
    }

    /* 「登入」文字的分隔線設計 */
    .login-title-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .login-title-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to var(--direction, right), rgba(160, 160, 160, 0), rgba(160, 160, 160, 0.5));
    }
    .login-title-line.right {
      --direction: left;
    }
    .login-title {
      font-size: 24px;
      color: #555;
      font-weight: 400;
      margin: 0 20px;
      letter-spacing: 6px;
    }

    /* 登入白盒（加入毛玻璃與對比設計圖的軟陰影） */
    .login-box {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 30px 25px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
    }

    /* 輸入框外層包裝（放圖標用） */
    .input-group {
      position: relative;
      margin-bottom: 16px;
      width: 100%;
    }
    .input-group svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: #8c8c8c;
    }
    .input-group input {
      width: 100%;
      padding: 14px 14px 14px 46px;
      border-radius: 4px;
      border: 1px solid #dcdcdc;
      font-size: 16px;
      color: #333;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      border-color: #a39485;
    }
    .input-group input::placeholder {
      color: #a0a0a0;
    }

    /* 記住我 勾選方塊 */
    .remember {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
      user-select: none;
      cursor: pointer;
    }
    .remember input {
      margin: 0 8px 0 2px;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* 完美還原設計圖的磨砂質感金屬漸層按鈕 */
    button.btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 4px;
      border: 1px solid #9c9183;
      background: linear-gradient(to bottom, #bcaea1 0%, #9c8e81 100%);
      color: white;
      font-size: 18px;
      letter-spacing: 6px;
      text-indent: 6px; /* 修正因字距產生的偏心 */
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: opacity 0.2s, transform 0.1s;
    }
    button.btn-login:hover {
      opacity: 0.95;
    }
    button.btn-login:active {
      transform: scale(0.99);
    }

    /* RWD 響應式：手機版調整 */
    @media (max-width: 480px) {
      .top-banner img.logo {
        width: 150px;
      }
      .top-banner h1 {
        font-size: 18px;
      }
      .login-title {
        font-size: 22px;
      }
      .login-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="top-banner">
    <img src="logo.png" class="logo" alt="縱橫Logo">
    <h1>昭揚縱橫 咖啡廳點餐系統</h1>
  </div>

  <div class="login-container">
    <div class="login-title-wrapper">
      <div class="login-title-line"></div>
      <h2 class="login-title">登入</h2>
      <div class="login-title-line right"></div>
    </div>

    <div class="login-box">
      <div class="input-group">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/></svg>
        <input id="username" type="text" placeholder="admin" autocomplete="username">
      </div>
      
      <div class="input-group">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <label class="remember" for="rememberMe">
        <input type="checkbox" id="rememberMe"> 記住我的帳號
      </label>

      <button class="btn-login" onclick="login()">登入</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    // 填入你的 Firebase 專案設定
    const firebaseConfig = { 
      // apiKey: "...",
      // authDomain: "...",
      // projectId: "...",
      // storageBucket: "...",
      // messagingSenderId: "...",
      // appId: "..."
    };
    
    // 初始化 Firebase (Compat 版本)
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 預設工程師帳號
    async function ensureAdmin() {
      try {
        const snapshot = await db.collection("accounts").where("username","==","admin").get();
        if (snapshot.empty) {
          await db.collection("accounts").add({username:"admin", password:"admin", role:"engineer"});
        }
      } catch (e) {
        console.error("預設帳號檢查失敗：", e);
      }
    }
    ensureAdmin();

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const remember = document.getElementById("rememberMe").checked;

      if (!username || !password) {
        alert("請輸入帳號和密碼");
        return;
      }

      try {
        const snapshot = await db.collection("accounts").where("username","==",username).get();
        if (!snapshot.empty) {
          const user = snapshot.docs[0].data();
          if (user.password === password) {
            if (remember) {
              localStorage.setItem("savedUser", username);
              localStorage.setItem("savedPass", password);
            } else {
              localStorage.removeItem("savedUser");
              localStorage.removeItem("savedPass");
            }
            
            // 頁面跳轉
            if (user.role === "resident") window.location.href="resident.html";
            else if (user.role === "property") window.location.href="property.html";
            else if (user.role === "cafe") window.location.href="cafe.html";
            else if (user.role === "engineer") window.location.href="engineer.html";
          } else {
            alert("密碼錯誤！");
          }
        } else {
          alert("帳號不存在！");
        }
      } catch(e) {
        alert("登入失敗，請檢查 Firebase 設定或網路連線");
        console.error(e);
      }
    }

    // 自動填入記住的帳號密碼
    window.onload = function() {
      const savedUser = localStorage.getItem("savedUser");
      const savedPass = localStorage.getItem("savedPass");
      if (savedUser && savedPass) {
        document.getElementById("username").value = savedUser;
        document.getElementById("password").value = savedPass;
        document.getElementById("rememberMe").checked = true;
      }
    }
  </script>
</body>
</html>
