<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昭揚縱橫 咖啡廳點餐系統</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#9c8e81">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="縱橫cafe">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    body {
      font-family: "-apple-system", BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft JhengHei", Arial, sans-serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 20px;
    }

    .top-banner {
      text-align: center;
      margin-bottom: 25px;
    }

    .top-banner img.logo {
      width: 180px;
      height: auto;
      margin-bottom: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .top-banner h1 {
      font-size: 20px;
      color: #656565;
      font-weight: 500;
      margin: 0;
      letter-spacing: 2px;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
    }

    .login-title-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .login-title-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(
        to var(--direction, right),
        rgba(160,160,160,0),
        rgba(160,160,160,0.5)
      );
    }

    .login-title-line.right {
      --direction: left;
    }

    .login-title {
      font-size: 24px;
      color: #555;
      font-weight: 400;
      margin: 0 20px;
      letter-spacing: 6px;
    }

    .login-box {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 30px 25px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
      width: 100%;
    }

    .input-group svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: #8c8c8c;
    }

    .input-group input {
      width: 100%;
      padding: 14px 14px 14px 46px;
      border-radius: 4px;
      border: 1px solid #dcdcdc;
      font-size: 16px;
      color: #333;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #a39485;
    }

    .input-group input::placeholder {
      color: #a0a0a0;
    }

    .remember {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
      user-select: none;
      cursor: pointer;
    }

    .remember input {
      margin: 0 8px 0 2px;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    button.btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 4px;
      border: 1px solid #9c9183;
      background: linear-gradient(to bottom,#bcaea1 0%,#9c8e81 100%);
      color: white;
      font-size: 18px;
      letter-spacing: 6px;
      text-indent: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: opacity 0.2s, transform 0.1s;
    }

    button.btn-login:hover {
      opacity: 0.95;
    }

    button.btn-login:active {
      transform: scale(0.99);
    }

    .system-credit{
      margin-top:14px;
      text-align:center;
      font-size:10px;
      color:rgba(120,110,100,0.45);
      letter-spacing:0.5px;
      line-height:1.4;
    }

    @media (max-width: 480px) {
      .top-banner img.logo { width: 150px; }
      .top-banner h1 { font-size: 18px; }
      .login-title { font-size: 22px; }
      .login-box { padding: 25px 20px; }
    }
  </style>
</head>

<body>

  <div class="top-banner">
    <img src="logo.png" class="logo" alt="縱橫Logo">
    <h1>昭揚縱橫 咖啡廳點餐系統</h1>
  </div>

  <div class="login-container">
    <div class="login-title-wrapper">
      <div class="login-title-line"></div>
      <h2 class="login-title">登入</h2>
      <div class="login-title-line right"></div>
    </div>

    <div class="login-box">
      <div class="input-group">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/>
        </svg>
        <input id="username" type="text" placeholder="username" autocomplete="username">
      </div>

      <div class="input-group">
        <svg viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
        <input id="password" type="password" placeholder="password" autocomplete="current-password">
      </div>

      <label class="remember" for="rememberMe">
        <input type="checkbox" id="rememberMe">
        保持登入狀態
      </label>

      <button class="btn-login" id="loginBtn">登入</button>

      <div class="system-credit">
        © 2026 謝秉諺 · Gemini · ChatGPT
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
  authDomain: "zonghengcafe.firebaseapp.com",
  projectId: "zonghengcafe",
  storageBucket: "zonghengcafe.firebasestorage.app",
  messagingSenderId: "207027108121",
  appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
  measurementId: "G-8ZE4SE2T7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBtn = document.getElementById("loginBtn");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const rememberInput = document.getElementById("rememberMe");

function makeEmail(username){
  return `${username}@zongheng.local`;
}

function redirectByRole(role){
  switch(role){
    case "engineer":
      window.location.href = "engineer.html";
      break;
    case "cafe":
      window.location.href = "cafe.html";
      break;
    case "property":
      window.location.href = "property.html";
      break;
    case "resident":
      window.location.href = "resident.html";
      break;
    default:
      alert("未知帳戶角色，請聯絡系統管理員。");
  }
}

async function getUserDataByUsername(username){
  const q = query(
    collection(db,"accounts"),
    where("username","==",username)
  );

  const snapshot = await getDocs(q);

  if(snapshot.empty){
    return null;
  }

  return snapshot.docs[0].data();
}

async function getUserDataByEmail(email){
  const q1 = query(
    collection(db,"accounts"),
    where("auth_email","==",email)
  );

  let snapshot = await getDocs(q1);

  if(!snapshot.empty){
    return snapshot.docs[0].data();
  }

  const q2 = query(
    collection(db,"accounts"),
    where("email","==",email)
  );

  snapshot = await getDocs(q2);

  if(!snapshot.empty){
    return snapshot.docs[0].data();
  }

  return null;
}

const rememberedUser = localStorage.getItem("rememberUser");
const rememberLogin = localStorage.getItem("rememberLogin");

if(rememberedUser){
  usernameInput.value = rememberedUser;
}

if(rememberLogin === "yes"){
  rememberInput.checked = true;
}

let checkingAutoLogin = true;

// 核心安全修正：自動登入時，一律重新向資料庫比對真正的角色，防止竄改 LocalStorage 繞過驗證
onAuthStateChanged(auth, async user => {
  if(!checkingAutoLogin){
    return;
  }

  checkingAutoLogin = false;

  if(!user){
    return;
  }

  const remember = localStorage.getItem("rememberLogin");

  if(remember !== "yes"){
    return;
  }

  const email = user.email || "";
  // 直接向資料庫撈取安全的角色資料
  const userData = await getUserDataByEmail(email);

  if(userData && userData.username && userData.role){
    localStorage.setItem(
      "zh_user",
      JSON.stringify({
        username:userData.username,
        role:userData.role
      })
    );

    localStorage.setItem("rememberUser", userData.username);
    redirectByRole(userData.role);
  } else {
    // 找不到該帳號的角色或資料異常，清除快取
    localStorage.removeItem("zh_user");
  }
});

loginBtn.addEventListener("click", async ()=>{

  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();
  const remember = rememberInput.checked;

  if(!username || !password){
    alert("請輸入帳號密碼");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerText = "登入中...";

  try{
    await setPersistence(
      auth,
      remember ? browserLocalPersistence : browserSessionPersistence
    );

    const email = makeEmail(username);

    // 1. 先通過 Firebase 身分驗證
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    // 2. 登入成功後，「親自」去資料庫抓取該帳號被設定的角色
    const userData = await getUserDataByUsername(username);

    if(!userData){
      alert("找不到帳號資料，請洽管理員。");
      return;
    }

    // 3. 確認有這個人，才寫入快取並導向對應的頁面
    localStorage.setItem(
      "zh_user",
      JSON.stringify({
        username: username,
        role: userData.role
      })
    );

    if(remember){
      localStorage.setItem("rememberLogin","yes");
      localStorage.setItem("rememberUser", username);
    }else{
      localStorage.removeItem("rememberLogin");
      localStorage.removeItem("rememberUser");
    }

    redirectByRole(userData.role);

  }catch(error){
    console.error(error);
    let errorMsg = "登入失敗，請檢查帳號密碼。";
    if (error.code === "auth/invalid-credential") {
      errorMsg = "帳號或密碼輸入錯誤！";
    }
    alert(errorMsg);
  }finally{
    loginBtn.disabled = false;
    loginBtn.innerText = "登入";
  }
});

passwordInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    loginBtn.click();
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => {
        console.log("PWA 已啟用");
      })
      .catch(err => {
        console.error("PWA 啟用失敗", err);
      });
  });
}
</script>

</body>
</html>
