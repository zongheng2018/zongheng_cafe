<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>昭揚縱橫 咖啡廳點餐系統</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(255,255,255,0.68), rgba(255,255,255,0.78)),
        url("./bg.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5a5148;
    }

    .login-wrap {
      width: min(92vw, 430px);
      transform: translateY(-22px);
      animation: fadeUp .7s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(-22px);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand img {
      width: 180px;
      max-width: 58%;
      opacity: .78;
      margin-bottom: 12px;
    }

    .brand h1 {
      font-size: 28px;
      letter-spacing: 4px;
      font-weight: 500;
      margin: 0;
      color: #777168;
    }

    .brand p {
      margin: 10px 0 0;
      font-size: 15px;
      letter-spacing: 2px;
      color: #8c8378;
    }

    .card {
      background: rgba(255,255,255,.84);
      border-radius: 14px;
      padding: 26px 26px 24px;
      box-shadow: 0 14px 36px rgba(73, 63, 51, .16);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(188, 174, 156, .35);
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 24px;
      color: #7d766d;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 4px;
    }

    .title::before,
    .title::after {
      content: "";
      width: 74px;
      height: 1px;
      background: #d8cec2;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-group span {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #9b948c;
      font-size: 21px;
    }

    input {
      width: 100%;
      height: 54px;
      border: 1px solid #d8d0c8;
      border-radius: 8px;
      background: rgba(255,255,255,.76);
      padding: 0 16px 0 52px;
      font-size: 19px;
      color: #5a5148;
      outline: none;
      transition: .25s ease;
    }

    input:focus {
      border-color: #aa9270;
      box-shadow: 0 0 0 3px rgba(170,146,112,.16);
      background: #fff;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 20px;
      font-size: 17px;
      color: #7c756e;
      user-select: none;
    }

    .remember input {
      width: 22px;
      height: 22px;
      padding: 0;
      accent-color: #9b8768;
    }

    button {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(#bba57e, #7e745f);
      color: white;
      font-size: 28px;
      letter-spacing: 5px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(86,73,54,.25);
      transition: transform .18s ease, filter .18s ease;
    }

    button:active {
      transform: scale(.985);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .msg {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      color: #b84236;
      font-size: 15px;
    }

    @media (max-height: 720px) {
      .login-wrap {
        transform: translateY(-38px);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(0);
        }
        to {
          opacity: 1;
          transform: translateY(-38px);
        }
      }

      .brand img {
        width: 145px;
        margin-bottom: 8px;
      }

      .brand h1 {
        font-size: 24px;
      }

      .brand p {
        font-size: 14px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="login-wrap">
    <div class="brand">
      <img src="./logo.png" alt="縱橫 Logo" />
      <h1>昭揚縱橫</h1>
      <p>咖啡廳點餐系統</p>
    </div>

    <div class="card">
      <div class="title">登入</div>

      <div class="input-group">
        <span>👤</span>
        <input id="username" type="text" placeholder="帳號" autocomplete="username" />
      </div>

      <div class="input-group">
        <span>🔒</span>
        <input id="password" type="password" placeholder="密碼" autocomplete="current-password" />
      </div>

      <label class="remember">
        <input id="rememberMe" type="checkbox" />
        記住我的帳號
      </label>

      <button id="loginBtn">登入</button>
      <div id="message" class="msg"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
      authDomain: "zonghengcafe.firebaseapp.com",
      projectId: "zonghengcafe",
      storageBucket: "zonghengcafe.firebasestorage.app",
      messagingSenderId: "207027108121",
      appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
      measurementId: "G-8ZE4SE2T7T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("rememberMe");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    const savedUsername = localStorage.getItem("zh_saved_username");
    if (savedUsername) {
      usernameInput.value = savedUsername;
      rememberInput.checked = true;
    }

    function roleToPage(role) {
      if (role === "engineer") return "engineer.html";
      if (role === "cafe") return "cafe.html";
      if (role === "property") return "property.html";
      if (role === "resident") return "resident.html";
      return "index.html";
    }

    async function getAccountByUsername(username) {
      const q = query(
        collection(db, "accounts"),
        where("username", "==", username)
      );

      const snap = await getDocs(q);

      if (snap.empty) {
        return null;
      }

      const doc = snap.docs[0];

      return {
        id: doc.id,
        ...doc.data()
      };
    }

    async function login() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      message.textContent = "";

      if (!username || !password) {
        message.textContent = "請輸入帳號與密碼";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "登入中";

      try {
        const account = await getAccountByUsername(username);

        if (!account) {
          throw new Error("找不到此帳號");
        }

        if (!account.auth_email) {
          throw new Error("此帳號尚未設定 Firebase Auth Email");
        }

        await setPersistence(
          auth,
          rememberInput.checked ? browserLocalPersistence : browserSessionPersistence
        );

        await signInWithEmailAndPassword(auth, account.auth_email, password);

        const profile = {
          accountId: account.id,
          username: account.username,
          role: account.role,
          unit_number: account.unit_number || "",
          auth_email: account.auth_email
        };

        localStorage.setItem("zh_user", JSON.stringify(profile));

        if (rememberInput.checked) {
          localStorage.setItem("zh_saved_username", username);
        } else {
          localStorage.removeItem("zh_saved_username");
        }

        window.location.href = roleToPage(account.role);

      } catch (err) {
        console.error(err);
        message.textContent = "登入失敗，請確認帳號密碼是否正確";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "登入";
      }
    }

    loginBtn.addEventListener("click", login);

    passwordInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        login();
      }
    });

    onAuthStateChanged(auth, async function(user) {
      if (!user) return;

      const raw = localStorage.getItem("zh_user");
      if (!raw) return;

      try {
        const profile = JSON.parse(raw);
        if (profile && profile.role) {
          window.location.href = roleToPage(profile.role);
        }
      } catch (e) {
        localStorage.removeItem("zh_user");
      }
    });
  </script>
</body>
</html>
