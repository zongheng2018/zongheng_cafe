<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>登入介面</title>
</head>
<body>
  <h1>登入介面</h1>
  <input id="username" placeholder="帳號">
  <input id="password" type="password" placeholder="密碼">
  <button onclick="login()">登入</button>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyOpbsZy4h3Fs3u4JzWLjWAAaAzROU6mU",
      authDomain: "zonghengcafe.firebaseapp.com",
      projectId: "zonghengcafe",
      storageBucket: "zonghengcafe.firebasestorage.app",
      messagingSenderId: "927076108212",
      appId: "1:927076108212:web:907e1980e2d77f9aad88",
      measurementId: "G-6224ESE471"
    };

    // 初始化 Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 登入函式
    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const snapshot = await db.collection("accounts")
        .where("username", "==", username)
        .get();

      if (!snapshot.empty) {
        const user = snapshot.docs[0].data();
        if (user.password === password) {
          const role = user.role;
          if (role === "resident") {
            window.location.href = "resident.html";
          } else if (role === "property") {
            window.location.href = "property.html";
          } else if (role === "cafe") {
            window.location.href = "cafe.html";
          } else if (role === "engineer") {
            window.location.href = "engineer.html";
          } else {
            alert("未知角色：" + role);
          }
        } else {
          alert("密碼錯誤！");
        }
      } else {
        alert("帳號不存在！");
      }
    }
  </script>
</body>
</html>
