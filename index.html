<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昭揚縱橫 咖啡廳點餐系統</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft JhengHei", Arial, sans-serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 20px;
    }

    .top-banner {
      text-align: center;
      margin-bottom: 25px;
    }

    .top-banner img.logo {
      width: 180px;
      height: auto;
      margin-bottom: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      opacity: 0.88;
    }

    .top-banner h1 {
      font-size: 20px;
      color: #656565;
      font-weight: 500;
      margin: 0;
      letter-spacing: 2px;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
    }

    .login-title-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .login-title-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to var(--direction, right), rgba(160, 160, 160, 0), rgba(160, 160, 160, 0.5));
    }

    .login-title-line.right {
      --direction: left;
    }

    .login-title {
      font-size: 24px;
      color: #555;
      font-weight: 400;
      margin: 0 20px;
      letter-spacing: 6px;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 30px 25px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
      width: 100%;
    }

    .input-group svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: #8c8c8c;
    }

    .input-group input {
      width: 100%;
      padding: 14px 14px 14px 46px;
      border-radius: 4px;
      border: 1px solid #dcdcdc;
      font-size: 16px;
      color: #333;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
      background: rgba(255,255,255,0.88);
    }

    .input-group input:focus {
      border-color: #a39485;
    }

    .input-group input::placeholder {
      color: #a0a0a0;
    }

    .remember {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
      user-select: none;
      cursor: pointer;
    }

    .remember input {
      margin: 0 8px 0 2px;
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #9c8e81;
    }

    button.btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 4px;
      border: 1px solid #9c9183;
      background: linear-gradient(to bottom, #bcaea1 0%, #9c8e81 100%);
      color: white;
      font-size: 18px;
      letter-spacing: 6px;
      text-indent: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: opacity 0.2s, transform 0.1s;
    }

    button.btn-login:hover {
      opacity: 0.95;
    }

    button.btn-login:active {
      transform: scale(0.99);
    }

    button.btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      margin-top: 14px;
      min-height: 20px;
      text-align: center;
      font-size: 14px;
      color: #b84236;
    }

    @media (max-width: 480px) {
      body {
        justify-content: flex-start;
        padding-top: 56px;
      }

      .top-banner img.logo {
        width: 150px;
      }

      .top-banner h1 {
        font-size: 18px;
      }

      .login-title {
        font-size: 22px;
      }

      .login-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="top-banner">
    <img src="logo.png" class="logo" alt="縱橫Logo">
    <h1>昭揚縱橫 咖啡廳點餐系統</h1>
  </div>

  <div class="login-container">
    <div class="login-title-wrapper">
      <div class="login-title-line"></div>
      <h2 class="login-title">登入</h2>
      <div class="login-title-line right"></div>
    </div>

    <div class="login-box">
      <div class="input-group">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <input id="username" type="text" placeholder="admin" autocomplete="username">
      </div>

      <div class="input-group">
        <svg viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
        </svg>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <label class="remember" for="rememberMe">
        <input type="checkbox" id="rememberMe"> 記住我的帳號
      </label>

      <button id="loginBtn" class="btn-login">登入</button>
      <div id="message" class="message"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDp5hZbAyHSn34UzJLWtrAAiAb2zROU6mU",
      authDomain: "zonghengcafe.firebaseapp.com",
      projectId: "zonghengcafe",
      storageBucket: "zonghengcafe.firebasestorage.app",
      messagingSenderId: "207027108121",
      appId: "1:207027108121:web:e7a39e19982ed77f9aed88",
      measurementId: "G-8ZE4SE2T7T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("rememberMe");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    const savedUsername = localStorage.getItem("zh_saved_username");

    if (savedUsername) {
      usernameInput.value = savedUsername;
      rememberInput.checked = true;
    }

    function roleToPage(role) {
      if (role === "engineer") return "engineer.html";
      if (role === "cafe") return "cafe.html";
      if (role === "property") return "property.html";
      if (role === "resident") return "resident.html";
      return "index.html";
    }

    async function getAccountByUsername(username) {
      const q = query(
        collection(db, "accounts"),
        where("username", "==", username)
      );

      const snap = await getDocs(q);

      if (snap.empty) {
        return null;
      }

      return {
        id: snap.docs[0].id,
        ...snap.docs[0].data()
      };
    }

    async function login() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      message.textContent = "";

      if (!username || !password) {
        message.textContent = "請輸入帳號與密碼";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "登入中";

      try {
        const account = await getAccountByUsername(username);

        if (!account) {
          throw new Error("帳號不存在");
        }

        if (!account.auth_email) {
          throw new Error("此帳號尚未設定 auth_email");
        }

        await setPersistence(
          auth,
          rememberInput.checked ? browserLocalPersistence : browserSessionPersistence
        );

        await signInWithEmailAndPassword(
          auth,
          account.auth_email,
          password
        );

        localStorage.setItem("zh_user", JSON.stringify({
          accountId: account.id,
          username: account.username,
          role: account.role,
          unit_number: account.unit_number || "",
          auth_email: account.auth_email
        }));

        if (rememberInput.checked) {
          localStorage.setItem("zh_saved_username", username);
        } else {
          localStorage.removeItem("zh_saved_username");
        }

        window.location.href = roleToPage(account.role);

      } catch (e) {
        console.error(e);
        message.textContent = "登入失敗，請確認帳號密碼";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "登入";
      }
    }

    loginBtn.addEventListener("click", login);

    passwordInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        login();
      }
    });

    onAuthStateChanged(auth, function(user) {
      if (!user) return;

      const raw = localStorage.getItem("zh_user");

      if (!raw) return;

      try {
        const profile = JSON.parse(raw);

        if (profile && profile.role) {
          window.location.href = roleToPage(profile.role);
        }
      } catch (e) {
        localStorage.removeItem("zh_user");
      }
    });
  </script>

</body>
</html>
